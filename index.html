*{box-sizing:border-box}

const serveTxt=v=>v.serveMl?v.serveMl+" mL":T(v.serveLabel||{en:"1 portion",es:"1 porción"});
function nice(x){ if(x>=100) return Math.round(x).toString(); if(x>=10) return (Math.round(x*10)/10).toString(); return (Math.round(x*100)/100).toString(); }
function frac(x){ const w=Math.floor(x), r=x-w, qs=[[0,""],[.25,"¼"],[.33,"⅓"],[.5,"½"],[.67,"⅔"],[.75,"¾"],[1,""]]; let best=qs[0]; for(const q of qs){ if(Math.abs(r-q[0])<Math.abs(r-best[0])) best=q; } const ww=best[0]===1?w+1:w; return (ww?ww:"")+(best[1]) || "0"; }
const UN = {
  g:{en:"g",es:"g"}, ml:{en:"mL",es:"mL"}, u:{en:"pc",es:"und"}, tbsp:{en:"tbsp",es:"cda"}, tsp:{en:"tsp",es:"cdta"}
};
function conv(q,u){
  if(u==="ml"){ const cups=q/236.6; return (q>=1000? nice(q/1000)+" L · ":"")+frac(cups)+(state.lang==="es"?" tazas":" cups"); }
  if(u==="g"){ return q>=1000? nice(q/1000)+" kg" : (nice(q/28.35)+" oz"); }
  if(u==="tbsp"){ return nice(q*15)+" mL"; }
  if(u==="tsp"){ return nice(q*5)+" mL"; }
  if(u==="u"){ return "≈ "+frac(q); }
  return "";
}

const RUNITS=["g","kg","mL","L","pc","tbsp","tsp"];
const UF={g:["m",1],kg:["m",1000],mg:["m",0.001],ml:["v",1],mL:["v",1],l:["v",1000],L:["v",1000],tbsp:["v",15],tsp:["v",5],pc:["c",1],u:["c",1],und:["c",1]};
const convQty=(q,from,to)=>{const a=UF[from],b=UF[to]; if(!a||!b||a[0]!==b[0]) return null; return num(q)*a[1]/b[1];};
const r3=n=>Math.round(num(n)*1000)/1000;
const normU=u=>u==="ml"?"mL":u==="u"?"pc":u;

  return {...r,ingredients:(r.ingredients||[]).map(g=>({...g,n:g["n_"+l]||g.n})),steps:r["steps_"+l]!=null?r["steps_"+l]:r.steps,

function lacksLang(r,l){ if(!r) return false; return (r.ingredients||[]).some(g=>!g["n_"+l]&&g.n)||(!!String(r.steps||"").trim()&&r["steps_"+l]==null); }
// fill the `_to` fields of doc (source texts in doc.n/steps/notes/portionLabel, language `from`)
async function fillLang(doc,item,from,to,prior,useAI){
  const prod=item&&item.prodId?P.find(x=>x.id===item.prodId):null, v=prod?prod.variants[0]:null;
  const refSteps=l=>v?(v.steps||[]).map(x=>(x.t||x)[l]||(x.t||x).en).join("\n"):null;
  const need={ing:[]};
  doc.ingredients=(doc.ingredients||[]).map((g,i)=>{ if(g["n_"+to]) return g; const src=g["n_"+from]||g.n;
    const pm=prior&&(prior.ingredients||[]).find(x=>(x["n_"+from]||x.n)===src&&x["n_"+to]);
    const rm=v&&v.ing.find(x=>x.n[from]===src);
    const t=pm?pm["n_"+to]:rm?rm.n[to]:null;
    if(t) return {...g,["n_"+to]:t}; need.ing.push(i); return g; });
  const txt=(f,refFn)=>{ if(doc[f+"_"+to]!=null) return; const src=doc[f+"_"+from]!=null?doc[f+"_"+from]:doc[f]; if(!String(src||"").trim()){ doc[f+"_"+to]=""; return; }
    if(prior&&(prior[f+"_"+from]!=null?prior[f+"_"+from]:prior[f])===src&&prior[f+"_"+to]!=null){ doc[f+"_"+to]=prior[f+"_"+to]; return; }
    const r=refFn&&refFn(); if(r&&r[from]===src){ doc[f+"_"+to]=r[to]; return; } need[f]=src; };
  txt("steps",()=>v?{en:refSteps("en"),es:refSteps("es")}:null);
  txt("notes",()=>prod&&prod.allergen?prod.allergen:null);
  txt("portionLabel",()=>v?{en:serveTxtL(v,"en"),es:serveTxtL(v,"es")}:null);
  const wantName=item&&!prod&&item.name&&!item["name_"+to];
  if((need.ing.length||need.steps!=null||need.notes!=null||need.portionLabel!=null||wantName)&&useAI&&SAMPLE){
    const ask={ingredients:need.ing.map(i=>doc.ingredients[i]["n_"+from]||doc.ingredients[i].n)};
    if(need.steps!=null) ask.steps=need.steps; if(need.notes!=null) ask.notes=need.notes; if(need.portionLabel!=null) ask.portionLabel=need.portionLabel; if(wantName) ask.name=item.name;
    try{ const j=await SAMPLE.json(`Translate these restaurant recipe texts into ${LNAME(to)} for a Peruvian restaurant in Canada. If a text is already in ${LNAME(to)}, return it unchanged. Keep numbers, units and line breaks (one step per line). Keep Peruvian dish and ingredient names that have no common translation (e.g. ají amarillo, lomo saltado, chicha morada), adding nothing else.
Reply with only JSON with the same keys: ${JSON.stringify(Object.keys(ask).reduce((o,k)=>(o[k]=k==="ingredients"?["..."]:"...",o),{}))}
TEXTS: ${JSON.stringify(ask)}`,{cache:false,modelTier:"quick"});
      if(j&&Array.isArray(j.ingredients)) need.ing.forEach((i,k)=>{ if(j.ingredients[k]) doc.ingredients[i]={...doc.ingredients[i],["n_"+to]:String(j.ingredients[k]).trim()}; });
      ["steps","notes","portionLabel"].forEach(f=>{ if(need[f]!=null&&typeof j[f]==="string") doc[f+"_"+to]=j[f].trim(); });
      if(wantName&&typeof j.name==="string"&&j.name.trim()) doc._name=j.name.trim().slice(0,60);
    }catch(e){ console.warn("translate",e); }
  }
  return doc;
}
const serveTxtL=(v,l)=>v.serveMl?v.serveMl+" mL":(v.serveLabel?v.serveLabel[l]:(l==="es"?"1 porción":"1 portion"));
// save a recipe (texts in the current language) with both languages
async function saveRecipeDoc(item,d,extra){
  const from=state.lang, to=OTH(from), prior=recipeOf(item.id);
  let doc={itemId:item.id,item:item.name,lang:from,portionLabel:d.portionLabel||"",["portionLabel_"+from]:d.portionLabel||"",
    ingredients:d.ingredients.map(g=>({...g,["n_"+from]:g.n})),steps:d.steps||"",["steps_"+from]:d.steps||"",notes:d.notes||"",["notes_"+from]:d.notes||"",...(extra||{})};
  doc=await fillLang(doc,item,from,to,prior,true);
  const nm=doc._name; delete doc._name;
  doc.ingText=doc.ingredients.map(x=>`${x.n} ${nice(x.q)} ${x.u}${x.inv&&invItem(x.inv)?" ["+invItem(x.inv).name+"]":""}`).join("; ");
  await dbSet("recipes/r"+item.id,doc);
  if(nm&&DB) try{ await DB.collection("menu").doc(item.id).update({["name_"+from]:item.name,["name_"+to]:nm}); }catch(e){}

// translate a saved recipe to the language on screen (older recipes saved in one language)
async function translateSaved(item){
  const r=recipeOf(item.id); if(!r) return;
  const l=state.lang, from=r.lang||OTH(l);
  const doc=await fillLang(JSON.parse(JSON.stringify(r)),item,from,l,null,true);
  const nm=doc._name; delete doc._name; delete doc.id;
  if(!doc.lang) doc.lang=from;
  await dbSet("recipes/r"+item.id,doc);
  if(nm&&DB) try{ await DB.collection("menu").doc(item.id).update({["name_"+from]:item.name,["name_"+l]:nm}); }catch(e){}
  return !lacksLang(doc,l);
}

const invItem=id=>D.inventory.find(i=>i.id===id);
// stock on hand = the Kardex balance (an item with no Kardex movements has 0).
// Roles that can't read the Kardex (waiter) fall back to the Inventory quantity.
function kardexOn(){ return canRead("kardex")&&Array.isArray(D.kardex)&&LOADED.has("kardex"); }
function stockQty(it,T){ if(!it) return 0; if(!kardexOn()) return num(it.qty); const t=(T||kxTotals())[it.id]; return t?num(t.q):0; }
// Kardex totals, recomputed only when the Kardex changes
let _kxMemo=null;
function kxT(){ const k=D.kardex||[], sig=k.length+"|"+(k.length?String(k[k.length-1].id)+String(k[k.length-1].balQty):"");
  if(!_kxMemo||_kxMemo.ref!==k||_kxMemo.sig!==sig) _kxMemo={ref:k,sig,T:kxTotals()}; return _kxMemo.T; }
// weighted average cost of an inventory item (per kg / L / piece) — from the Kardex; roles that can't read the Kardex use the Inventory cost
function avgCostOf(it){ if(!it) return 0; if(!kardexOn()) return num(it.cost); const t=kxT()[it.id]; return t?num(t.c):0; }
// cost of 1 portion of a recipe = Σ ingredient quantity × Kardex weighted average cost
function portionCost(std){
  let cost=0; const lines=[], missing=[], unlinked=[], bad=[];
  (std.ingredients||[]).forEach(g=>{ if(!num(g.q)||ingFree(g)) return; const it=ingItem(g);
    if(!it){ if(invGone(g)) missing.push(g.n+" ("+tt("deleted from inventory","eliminado del inventario")+")"); else unlinked.push(g.n); return; }
    const per=convQty(g.q,g.u,it.unit); if(per==null){ bad.push(g.n); return; }
    const c=avgCostOf(it); if(!(c>0)){ missing.push(g.n); lines.push({n:g.n,it,per,cost:null}); return; }
    const lc=toBaseI(per,it)*c; cost+=lc; lines.push({n:g.n,it,per,cost:lc}); });
  return {cost,lines,missing,unlinked,bad,known:cost>0&&!missing.length&&!bad.length};
}
// cost per cup / plate of an app product (sales are kept per product): the saved recipe × Kardex; manual cost only as a fallback
function recipeForProd(pid){ const m=D.menu.find(x=>x.prodId===pid&&recipeOf(x.id)&&recipeOf(x.id).locked); return m?recipeOf(m.id):null; }
function prodCost(pid){ const r=String(pid).startsWith("m_")?(()=>{ const x=recipeOf(String(pid).slice(2)); return x&&x.locked?x:null; })():recipeForProd(pid); if(r){ const pc=portionCost(r); if(pc.cost>0) return {c:pc.cost,src:"kardex",pc,partial:!pc.known}; }
  const c=num(D.costs&&D.costs[pid]); return {c,src:c>0?"manual":"",pc:null}; }
// how many portions the current stock allows, and which ingredient runs out first
// a recipe ingredient linked to an inventory item that was deleted afterwards
const invGone=g=>!!(g&&g.inv&&!invItem(g.inv)&&LOADED.has("inventory"));
// the inventory item of a recipe ingredient: its link, or (if not linked) an item with the same name
function ingItem(g){ if(!g) return null; if(g.inv){ const it=invItem(g.inv); if(it) return it; } const n=normName(g.n); return n?D.inventory.find(i=>normName(i.name)===n)||null:null; }
// water and ice are not kept in stock; "to taste" lines have no quantity
const ingFree=g=>!!(g&&(g.taste||/^(water|cold water|hot water|potable water|ice|agua|hielo)\b/.test(normName(g.n))));
// portions possible = the MINIMUM over every ingredient of the recipe of (stock ÷ quantity per portion).
// An ingredient that isn't in the inventory, was deleted, or whose unit can't be converted counts as 0 available.
function portionsPossible(std){
  let best=null, limit=null, linked=0; const bad=[], gone=[], missing=[], T=kardexOn()?kxTotals():null;
  (std.ingredients||[]).forEach(g=>{ if(!num(g.q)||ingFree(g)) return; linked++; const it=ingItem(g);
    if(!it){ (invGone(g)?gone:missing).push(g.n); return; }
    const per=convQty(g.q,g.u,it.unit); if(per==null){ bad.push(g.n); return; }
    const n=Math.floor(stockQty(it,T)/per+1e-9); if(best==null||n<best){best=n;limit=g.n;} });
  const block=[...gone.map(n=>n+" ("+tt("deleted from inventory","eliminado del inventario")+")"),...missing.map(n=>n+" ("+tt("not in inventory","no está en el inventario")+")"),...bad.map(n=>n+" ("+tt("unit can't be converted","unidad no convertible")+")")];
  if(block.length){ best=0; limit=block[0]; }
  return {linked,best:best==null?0:best,limit,bad,gone,missing,block};
}
// stock used by N portions, in each inventory item's own unit
function stockUseFor(std,portions){
  const out=[];
  (std.ingredients||[]).forEach(g=>{ if(!num(g.q)||ingFree(g)) return; const it=ingItem(g); if(!it) return;
    const per=convQty(g.q,g.u,it.unit); if(per==null) return;
    const f=out.find(x=>x.id===it.id); const q=Math.round(per*portions*100)/100;
    if(f) f.qty=Math.round((f.qty+q)*100)/100; else out.push({id:it.id,name:it.name,unit:it.unit,qty:q}); });
  return out;
}

function calcHTML(item){
  const std=recEdit||standardOf(item), ing=(std.ingredients||[]).filter(g=>g.n), n=Math.max(1,Math.round(num(recN))||1);
  if(!ing.length) return `<p class="empty">${tt("Add the ingredients for one portion first.","Primero agrega los ingredientes de una porción.")}</p>`;
  const pp=portionsPossible(std), T=kardexOn()?kxTotals():null, pcst=portionCost(std);
  const rows=ing.map(g=>{ const it=ingFree(g)?null:ingItem(g), need=num(g.q)*n, inU=it?convQty(need,g.u,it.unit):null, have=stockQty(it,T);
    const ok=it&&inU!=null?have>=inU:null;
    return `<tr><td>${esc(g.n)}</td><td class="nw">${nice(num(g.q))} ${esc(g.u)}</td><td class="nw"><b>${nice(need)} ${esc(g.u)}</b>${inU!=null&&it.unit!==g.u?`<small>= ${nice(inU)} ${esc(it.unit)}</small>`:""}</td>
      <td class="nw">${it?`${nice(have)} ${esc(it.unit)}`:invGone(g)?`<span class="badge bad">${tt("deleted from inventory","eliminado del inventario")}</span>`:`<span class="dimtxt">—</span>`}</td>
      <td>${ok==null?"":ok?`<span class="badge ok">OK</span>`:`<span class="badge bad">${tt("short","falta")} ${nice(inU-have)} ${esc(it.unit)}</span>`}</td>
      <td class="nw">${(()=>{ const l=pcst.lines.find(x=>x.n===g.n&&x.it===it); return l&&l.cost!=null?money2(l.cost*n):`<span class="dimtxt">—</span>`; })()}</td></tr>`; }).join("");
  return `<p class="dimtxt">${esc(itemName(item))} · <b>${n}</b> ${tt("portion(s)","porción(es)")}${std.portionLabel?" × "+esc(std.portionLabel):""}</p>
   <div class="tablewrap"><table class="dt"><thead><tr><th>${tt("Ingredient","Ingrediente")}</th><th>1</th><th>× ${n}</th><th>${tt("In stock","En stock")}</th><th></th><th>${tt("Cost","Costo")} × ${n}</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${pcst.cost>0?`<p class="capnote">💲 ${tt("Cost per portion","Costo por porción")}: <b>${money2(pcst.cost)}</b>${n>1?` · × ${n} = <b>${money2(pcst.cost*n)}</b>`:""} <span class="dimtxt">(${tt("Kardex weighted average cost","costo promedio ponderado del Kardex")})</span>${pcst.missing.length?` · <span class="alltxt">⚠ ${tt("no Kardex cost yet","aún sin costo en Kardex")}: ${esc(pcst.missing.join(", "))}</span>`:""}</p>`:""}
   ${pp.linked?`<p class="capnote ${pp.best===0?"warnnote":""}">📦 ${tt(`With the current stock you can make <b>${pp.best}</b> portion(s)`,`Con el stock actual alcanzan <b>${pp.best}</b> porción(es)`)}${pp.limit?` — ${tt("first to run out","se acaba primero")}: ${esc(pp.limit)}`:""}.</p>`
     :`<p class="hint">${tt("Link the ingredients to inventory items to see how many portions your stock allows and to discount stock when a bill is paid.","Vincula los ingredientes con artículos del inventario para ver cuántas porciones alcanzan con tu stock y descontar el stock al cobrar una cuenta.")}</p>`}
   ${pp.block&&pp.block.length?`<p class="hint alltxt">⚠ ${tt("Counted as 0 available — fix to get the real number","Se cuentan como 0 disponibles — corrígelo para ver el número real")}: ${esc(pp.block.join(", "))}</p>`:""}
   ${!std.locked||recEdit?`<p class="hint">${tt("Stock is only discounted on paid bills once this measure is saved.","El stock solo se descuenta en las cuentas cobradas cuando esta medida esté guardada.")}</p>`:""}`;

function wireStandard(item){
  const trb=document.getElementById("rcTranslate");
  if(trb) trb.onclick=async()=>{ trb.disabled=true; trb.textContent=tt("Translating…","Traduciendo…");
    const ok=await translateSaved(item); recSig=""; render();
    toast(ok?tt("Recipe translated to English.","Receta traducida al español."):tt("Only part of the recipe could be translated — AI is not available here. Edit the missing texts by hand.","Solo se pudo traducir una parte — la IA no está disponible aquí. Edita a mano los textos que faltan.")); };
  const std0=recEdit||standardOf(item), locked=!!std0.locked&&!recEdit;
  const draft=()=>{
    const rows=[...main.querySelectorAll("section .dt tbody tr[data-i]")].map(tr=>({n:tr.querySelector('[data-r="n"]').value.trim(),q:r3(tr.querySelector('[data-r="q"]').value),u:tr.querySelector('[data-r="u"]').value,inv:tr.querySelector('[data-r="inv"]').value}));
    return {...std0,portionLabel:val("stPortion"),ingredients:rows,steps:document.getElementById("rcSteps").value.trim(),notes:val("rcNotes")};
  };
  const paint=()=>{ const el=document.getElementById("rcCalc"); if(el) el.innerHTML=calcHTML(item); };
  paint();
  const lockUI=()=>main.querySelectorAll("#stPortion,section .dt [data-r],#rcAdd,[data-rrm],#rcSteps,#rcNotes").forEach(el=>{el.disabled=true;el.classList.add("ro");});
  if(locked||!canWrite("recipes")) lockUI();
  document.getElementById("rcN").oninput=e=>{ recN=Math.max(1,Math.round(num(e.target.value))||1); paint(); };
  main.querySelectorAll("[data-rn]").forEach(b=>b.onclick=()=>{ recN=num(b.dataset.rn); document.getElementById("rcN").value=recN; main.querySelectorAll("[data-rn]").forEach(x=>x.classList.toggle("ghost",x!==b)); paint(); });
  if(locked){
    const e=document.getElementById("rcEdit");
    if(e){ if(!canWrite("recipes")){ e.disabled=true; e.classList.add("ro"); e.title=tt("Only an administrator or the chef can change recipes","Solo un administrador o el chef pueden cambiar recetas"); }
      e.onclick=()=>{ recEdit=JSON.parse(JSON.stringify(standardOf(item))); render(); }; }
    return;
  }
  const live=()=>{ recEdit=draft(); paint(); };
  main.querySelectorAll('section .dt [data-r],#stPortion,#rcSteps,#rcNotes').forEach(el=>{ el.addEventListener("input",live); el.addEventListener("change",live); });
  document.getElementById("rcAdd").onclick=()=>{ const d=draft(); d.ingredients.push({n:"",q:0,u:"g",inv:""}); recEdit=d; render(); };
  main.querySelectorAll("[data-rrm]").forEach(b=>b.onclick=()=>{ const d=draft(); d.ingredients.splice(num(b.dataset.rrm),1); recEdit=d; render(); });
  const c=document.getElementById("rcCancel"); if(c) c.onclick=()=>{ recEdit=null; render(); };
  const s=document.getElementById("rcSave");
  if(s) s.onclick=async()=>{
    const d=draft(), ing=d.ingredients.filter(x=>x.n&&num(x.q)>0);
    const m=document.getElementById("rcMsg");
    if(!ing.length){ m.textContent=tt("Add at least one ingredient with an amount for one portion.","Agrega al menos un ingrediente con su cantidad para una porción."); return; }
    const stamp=new Date().toISOString();
    s.disabled=true; m.textContent=SAMPLE?tt("Saving and preparing the Spanish version…","Guardando y preparando la versión en inglés…"):"";
    await saveRecipeDoc(item,{portionLabel:d.portionLabel,ingredients:ing,steps:d.steps,notes:d.notes},{locked:true,lockedAt:stamp,lockedBy:SESSION?SESSION.name:"",updated:stamp});
    recEdit=null; recSig=""; render();
    toast(tt("Saved. This is now the standard measure for one portion.","Guardado. Esta es ahora la medida única para una porción."));
  };
}

function wireProduct(p){
  const vi=state.variant[p.id]||0, v=p.variants[vi], key=p.id+":"+vi;
  const sec=main.querySelector("section");
  const update=(f,skip)=>{
    state.factor[key]=f;
    sec.querySelectorAll("table.ing input").forEach(inp=>{const i=+inp.dataset.i; if(inp!==skip) inp.value=nice(v.ing[i].q*f); sec.querySelector(`[data-conv="${i}"]`).textContent=conv(v.ing[i].q*f,v.ing[i].u);});
    const s=sec.querySelector(`#srv-${p.id}`); if(s!==skip) s.value=nice(v.servings*f);
    sec.querySelector("[data-factor]").textContent="×"+nice(f);
    sec.querySelectorAll("[data-yield]").forEach(y=>y.textContent=nice(v.servings*f));
  };
  sec.querySelectorAll("table.ing input").forEach(inp=>inp.addEventListener("input",()=>{const x=parseFloat(inp.value); if(x>0) update(x/v.ing[+inp.dataset.i].q,inp);}));
  sec.querySelector(`#srv-${p.id}`).addEventListener("input",e=>{const x=parseFloat(e.target.value); if(x>0) update(x/v.servings,e.target);});
  sec.querySelectorAll("[data-mult]").forEach(b=>b.addEventListener("click",()=>update(+b.dataset.mult)));
  sec.querySelectorAll("[data-variant]").forEach(b=>b.addEventListener("click",()=>{state.variant[p.id]=+b.dataset.variant; render();}));
}

const LS_DB="top-db-v1", LS_KEY="top-apikey";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function makeLocalDB(){
  let store={}; try{store=JSON.parse(lsGet(LS_DB)||"{}")||{};}catch(e){store={};}
  const subs=new Set();
  const persist=()=>{ if(!lsSet(LS_DB,JSON.stringify(store))) toast(tt("Browser storage is full or blocked.","El almacenamiento del navegador está lleno o bloqueado.")); };
  const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const snapDoc=(path)=>({id:path.split("/").pop(),exists:path in store,data:()=>store[path]?JSON.parse(JSON.stringify(store[path])):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  function docRef(path){return{id:path.split("/").pop(),path,
    async get(){return snapDoc(path);},
    async set(d){store[path]=JSON.parse(JSON.stringify(d));persist();notify();},
    async update(d){if(!(path in store))throw{code:"invalid_argument"};Object.assign(store[path],JSON.parse(JSON.stringify(d)));persist();notify();},
    async delete(){delete store[path];persist();notify();},
    onSnapshot(next){const f=()=>next(snapDoc(path));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}};}
  function col(name){return{path:name,
    doc(id){return docRef(name+"/"+(id||rid()));},
    async add(d){const r=this.doc();await r.set(d);return r;},
    onSnapshot(next){const f=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(name+"/")&&k.split("/").length===2).sort().map(snapDoc);next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}});};subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}};}
  return {collection:col,doc:docRef,_dump:()=>JSON.parse(JSON.stringify(store)),_load:obj=>{store=obj||{};persist();notify();},_empty:()=>!Object.keys(store).length};
}

function makeApiSample(){
  async function call(input,opts={}){
    const key=lsGet(LS_KEY); if(!key) throw {code:"not_granted",message:"no key"};
    let msgs=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
    const merged=[]; msgs.forEach(m=>{const last=merged[merged.length-1]; if(last&&last.role===m.role) last.content+="\n\n"+m.content; else merged.push({...m});});
    let r;
    try{ r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:await pickModel(opts.modelTier),max_tokens:2048,messages:merged})}); }
    catch(e){ throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error",message:String(e)}; }
    if(!r.ok){ const code=r.status===401||r.status===403?"bad_key":r.status===429?"rate_limited":"upstream_error"; throw {code,message:"HTTP "+r.status}; }
    const j=await r.json(); const text=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim();
    if(!text) throw {code:"empty_completion"};
    opts.onText&&opts.onText({text,delta:text});
    return {text,truncated:j.stop_reason==="max_tokens",modelTierApplied:opts.modelTier||"default"};
  }
  const fn=(i,o)=>call(i,o);
  fn.json=async(i,o)=>{ const {text}=await call(typeof i==="string"?i+"\n\nReply with the JSON only.":i,o);
    const tryP=s=>{try{return JSON.parse(s);}catch(e){return undefined;}};
    let v=tryP(text); if(v===undefined){const m=text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) v=tryP(m[1]);}
    if(v===undefined){const a=text.search(/[\[{]/), b=Math.max(text.lastIndexOf("]"),text.lastIndexOf("}")); if(a>=0&&b>a) v=tryP(text.slice(a,b+1));}
    if(v===undefined) throw {code:"invalid_json",text}; return v; };
  return fn;
}

function aiErr(e){ const c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed") return tt("AI is not allowed in this view.","La IA no está permitida en esta vista.");

  if(c==="rate_limited") return tt("Too many AI requests — wait a moment and try again.","Demasiadas solicitudes de IA — espera un momento e inténtalo de nuevo.");
  if(c==="session_expired") return tt("Sign in again to use AI.","Vuelve a iniciar sesión para usar la IA.");
  if(c==="refused") return tt("The AI declined this request. Rephrase it.","La IA rechazó esta solicitud. Reformúlala.");
  if(c==="invalid_json") return tt("The AI answer could not be read. Try again.","No se pudo leer la respuesta de la IA. Inténtalo de nuevo.");

}

async function dedupeAppDrinks(){
  dedupeDone=true;
  const groups={}; D.menu.forEach(m=>{ if(m.prodId) (groups[m.prodId] ||= []).push(m); });
  const saved=m=>{const r=recipeOf(m.id); return !!(r&&r.locked);};
  let removed=0;
  for(const list of Object.values(groups)){
    if(list.length<2) continue;
    const keep=list.slice().sort((a,b)=>(saved(b)-saved(a))||String((recipeOf(b.id)||{}).lockedAt||"").localeCompare(String((recipeOf(a.id)||{}).lockedAt||""))||String(a.id).localeCompare(String(b.id)))[0];
    for(const m of list) if(m.id!==keep.id&&!saved(m)){ await dbDel("menu",m.id); removed++; }
  }
  if(removed) toast(tt(`Removed ${removed} duplicated drink(s) from the menu; kept the one with the saved recipe.`,`Se quitaron ${removed} bebida(s) duplicada(s) del menú; se dejó la que tiene la receta guardada.`));
}

function speak(text){
  if(!("speechSynthesis" in window)||!text) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text), lang=voiceLang(), base=lang.slice(0,2);
  u.lang=lang; const vs=speechSynthesis.getVoices(); const v=vs.find(x=>x.lang===lang)||vs.find(x=>x.lang&&x.lang.startsWith(base)); if(v) u.voice=v;

function startVoice(){

  if(listening){ recog?.stop(); return; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
  const inp=document.getElementById("chatIn"); let finalTxt="";
  recog=new SR(); recog.lang=voiceLang(); recog.interimResults=true; recog.continuous=false; recog.maxAlternatives=1;
  recog.onstart=()=>{setMic(true);vMsg("");};
  recog.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i]; if(r.isFinal) finalTxt+=r[0].transcript; else interim+=r[0].transcript;} inp.value=(finalTxt+interim).trim(); };
  recog.onerror=e=>{ const c=e.error;
    vMsg(c==="not-allowed"||c==="service-not-allowed"?tt("Microphone access is blocked. Allow the microphone for this page in your browser settings.","El micrófono está bloqueado. Permite el micrófono para esta página en la configuración del navegador.")
      :c==="no-speech"?tt("I didn't hear anything. Try again.","No escuché nada. Inténtalo de nuevo.")
      :c==="audio-capture"?tt("No microphone found.","No se encontró un micrófono.")
      :c==="network"?tt("Voice recognition needs an internet connection.","El reconocimiento de voz necesita conexión a internet.")
      :c==="aborted"?"":tt("Voice input stopped. Try again or type.","La entrada de voz se detuvo. Inténtalo de nuevo o escribe.")); };
  recog.onend=()=>{ setMic(false); if(inp.value.trim()){ lastByVoice=true; document.getElementById("chatForm").requestSubmit(); } };

/* ================= TABLES LAYOUT (Distribución de mesas) ================= */
const BOOK_MIN=90; // each booking holds its table for 1 h 30 min
const tmin=t=>{const p=String(t||"").split(":");return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);};
const mtime=n=>{n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");};
const endTime=t=>mtime(tmin(t)+BOOK_MIN);
const activeTables=()=>D.tables.filter(t=>t.active!==false&&num(t.seats)>0).sort((a,b)=>num(a.num)-num(b.num));
const totalCap=()=>activeTables().reduce((s,t)=>s+num(t.seats),0);
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const dayNum=d=>{const p=String(d||"").split("-");return Date.UTC(+p[0]||1970,(+p[1]||1)-1,+p[2]||1)/86400000;};
const absMin=(date,time)=>dayNum(date)*1440+tmin(time); // minutes since epoch: safe across midnight
const nowAbs=()=>absMin(today(),nowHM());
const onTable=(r,tnum,exceptId)=>r.id!==exceptId&&r.status!=="cancelled"&&r.table!==""&&r.table!=null&&String(r.table)===String(tnum);
// another booking whose 1 h 30 min hold overlaps this one
function tableBooking(tnum,date,time,exceptId){
  const s=absMin(date,time);
  return D.reservations.find(r=>onTable(r,tnum,exceptId)&&Math.abs(absMin(r.date,r.time)-s)<BOOK_MIN);
}
// the booking sitting at the table right now (already started, still inside its 1 h 30 min)
function tableBookingNow(tnum){
  const n=nowAbs();
  return D.reservations.find(r=>{const st=absMin(r.date,r.time);return onTable(r,tnum)&&st<=n&&n<st+BOOK_MIN;});
}
// a table marked "occupied" (guests seated now) can't take a booking that starts today before it is expected to be free
function tableOccupiedFor(t,date,time){ const a=absMin(date,time),n=nowAbs(); return !!t.occupied&&a>n-BOOK_MIN&&a<n+BOOK_MIN; }
function tableStatus(t){
  if(t.active===false) return ["off",tt("Out of service","Fuera de servicio")];
  if(t.occupied) return ["occ",tt("Occupied","Ocupada")];
  const b=tableBookingNow(t.num);
  if(b) return ["res",tt(`Booked ${esc(b.time)}–${esc(endTime(b.time))}`,`Reservada ${esc(b.time)}–${esc(endTime(b.time))}`)];
  return ["free",tt("Free · ready for bookings","Libre · lista para reservas")];
}
// returns {table} (number, or "" when no layout is defined) or {err}
function pickTable(party,date,time,want,exceptId){
  const tabs=activeTables();
  if(!tabs.length) return {table:""};
  if(want){
    const t=tabs.find(x=>String(x.num)===String(want));
    if(!t) return {err:tt("That table doesn't exist or is not active.","Esa mesa no existe o no está activa.")};
    if(num(t.seats)<party) return {err:tt(`Table ${t.num} has only ${t.seats} chairs.`,`La mesa ${t.num} tiene solo ${t.seats} sillas.`)};
    if(tableOccupiedFor(t,date,time)) return {err:tt(`Table ${t.num} is occupied now. Mark it free in “Tables layout” or book after ${mtime(tmin(nowHM())+BOOK_MIN)}.`,`La mesa ${t.num} está ocupada ahora. Márcala libre en “Distribución de mesas” o reserva después de las ${mtime(tmin(nowHM())+BOOK_MIN)}.`)};
    const b=tableBooking(t.num,date,time,exceptId);
    if(b) return {err:tt(`Table ${t.num} is booked from ${b.time} to ${endTime(b.time)} (${b.name}). Each booking holds the table 1 h 30 min.`,`La mesa ${t.num} está reservada de ${b.time} a ${endTime(b.time)} (${b.name}). Cada reserva ocupa la mesa 1 h 30 min.`)};
    return {table:num(t.num)};
  }
  const max=Math.max(...tabs.map(t=>num(t.seats)));
  if(party>max) return {err:tt(`No table has ${party} chairs (largest: ${max}). Add a bigger table or join tables in “Tables layout”.`,`Ninguna mesa tiene ${party} sillas (la más grande: ${max}). Agrega una mesa más grande o junta mesas en “Distribución de mesas”.`)};
  const free=tabs.filter(t=>num(t.seats)>=party&&!tableOccupiedFor(t,date,time)&&!tableBooking(t.num,date,time,exceptId)).sort((a,b)=>num(a.seats)-num(b.seats)||num(a.num)-num(b.num));
  if(!free.length) return {err:tt(`Full: no free table for ${party} between ${time} and ${endTime(time)}. Try another time.`,`Completo: no hay mesa libre para ${party} entre ${time} y ${endTime(time)}. Prueba otra hora.`)};
  return {table:num(free[0].num)};
}

const occupiedTables=()=>activeTables().filter(t=>t.occupied);
function occTableOptions(sel){ const ts=occupiedTables();
  return ts.length?`<option value="">${tt("Choose an occupied table…","Elige una mesa ocupada…")}</option>`+ts.map(t=>`<option value="${esc(t.num)}"${String(t.num)===String(sel)?" selected":""}>${tt("Table","Mesa")} ${esc(t.num)} · ${esc(t.seats)} ${tt("chairs","sillas")}${t.waiter?" · 👤 "+esc(t.waiter):""}</option>`).join("")

const occTableHint=()=>occupiedTables().length?"":`<p class="hint warnnote f full">🪑 ${tt("No table is occupied. Mark the table as occupied when the guests sit down in","Ninguna mesa está ocupada. Marca la mesa como ocupada cuando se sienten los clientes en")} <button type="button" class="linkbtn" data-aiview="tables">${tt("Tables layout","Distribución de mesas")}</button>.</p>`;

async function freeTable(num){ const tb=D.tables.find(x=>String(x.num)===String(num)); if(!tb||!tb.occupied) return false;
  if(!canWrite("tables")){ toast(tt(`Mark table ${num} as free in Tables layout (your role can't change tables).`,`Marca la mesa ${num} como libre en Distribución de mesas (tu rol no puede cambiar mesas).`)); return false; }
  await dbUpd("tables",tb.id,{occupied:false,occSince:""}); return true; }

}

    await dbSet("tables/t"+n,{num:n,seats:s,zone:val("tZone"),active:true});

    if(el.dataset.f==="zone") await dbUpd("tables",id,{zone:el.value.trim()});
    if(el.dataset.f==="active") await dbUpd("tables",id,{active:el.checked});

const PAYMENTS=[["cash","Cash","Efectivo"],["card","Card","Tarjeta"],["transfer","Transfer","Transferencia"],["other","Other","Otro"]];
const payName=k=>{const x=PAYMENTS.find(p=>p[0]===k);return x?tt(x[1],x[2]):k;};
const GST_DEFAULT=5;
const dishKey=d=>String(d||"").trim().toLowerCase();
const menuNamesOf=m=>{const p=m.prodId?P.find(x=>x.id===m.prodId):null;return [m.name,m.name_en,m.name_es,p&&p.name.en,p&&p.name.es,...String(m.aka||"").split("|")].filter(Boolean);};
const menuFind=d=>{const k=dishKey(d);return D.menu.find(x=>menuNamesOf(x).some(n=>dishKey(n)===k));};
const priceOf=d=>{const m=menuFind(d);return m?num(m.price):0;};
const taxRate=()=>{const r=D.bill&&D.bill.taxRate!=null?num(D.bill.taxRate):GST_DEFAULT;return r>=0&&r<=100?r:GST_DEFAULT;};
const r2=n=>Math.round(num(n)*100)/100;
// orders of a table that are not cancelled and not billed yet
// a dish goes on the bill when the Kitchen board marks its order "Served"
const openOrders=t=>D.orders.filter(o=>String(o.table)===String(t)&&o.status==="served"&&!o.billId);
const kitchenOrders=t=>D.orders.filter(o=>String(o.table)===String(t)&&["new","prep","ready"].includes(o.status||"new")&&!o.billId);
const tablesToBill=()=>[...new Set(D.orders.filter(o=>o.status==="served"&&!o.billId).map(o=>String(o.table)))].sort((a,b)=>num(a)-num(b));
// the menu product a bill line matches, so paid drinks can be added to module 3
const matchProduct=d=>{const k=dishKey(d);const m=menuFind(d);if(m&&m.prodId) return m.prodId;const p=P.find(x=>dishKey(x.name.en)===k||dishKey(x.name.es)===k);return p?p.id:"";};
let billMsg=""; let billTable="", billLines=null, billTip=0, billTipPct=null, billDisc={v:0,mode:"pct",why:""}, billSplit=1, billMethod="cash", lastBill=null;
function billTotals(){
  const lines=billLines||[];
  const subtotal=r2(lines.reduce((s,l)=>s+num(l.qty)*num(l.price),0));
  const discount=r2(billDisc.mode==="pct"?subtotal*Math.min(100,Math.max(0,num(billDisc.v)))/100:Math.min(subtotal,Math.max(0,num(billDisc.v))));
  const base=r2(subtotal-discount), tax=r2(base*taxRate()/100);
  const tip=r2(billTipPct!=null?base*billTipPct/100:billTip);
  const total=r2(base+tax+tip), split=Math.max(1,Math.round(num(billSplit)||1));
  return {subtotal,discount,base,tax,tip,total,split,per:r2(total/split)};
}

// orders of the table still in the kitchen: they join the bill when they are served
// cost of what a bill sold: every line × its dish's cost per portion (saved recipe × Kardex weighted average cost)
function billCostOf(lines){ let cost=0, known=true; const out=[];
  (lines||[]).forEach(l=>{ const q=num(l.qty); if(!(q>0)) return; const m=menuFind(l.dish), r=m?recipeOf(m.id):null;
    const pc=r&&r.locked?portionCost(r):null, u=pc?pc.cost:0; if(!pc||!pc.known) known=false;
    const c=cost2(u*q); cost+=c; out.push({dish:l.dish,qty:q,unitCost:cost2(u),cost:c}); });
  return {cost:cost2(cost),lines:out,known}; }
const billRevenue=b=>cost2(num(b.subtotal)-num(b.discount));   // what the food and drinks sold for (no GST, no tip)
function billCost(b){ if(b.cost!=null&&b.cost!=="") return {cost:num(b.cost),known:b.costKnown!==false,est:false}; const c=billCostOf(b.lines); return {cost:c.cost,known:c.known,est:true}; }
let bcDays=30;
// "Clear": hides from this table every bill charged up to that moment (the bills themselves stay saved — receipts, sales and Kardex untouched)
const bcCleared=()=>String((D.bill&&D.bill.costClearedAt)||"");

const bcShown=b=>{ const c=bcCleared(); return !c||!(bcTime(b)<=new Date(c).getTime()); };

let billOrderIds=new Set();
function loadTableLines(){
  const os=openOrders(billTable), lines=[]; billOrderIds=new Set(os.map(o=>o.id));
  os.forEach(o=>(o.items||[]).forEach(i=>{
    const k=dishKey(i.dish), f=lines.find(l=>dishKey(l.dish)===k&&!l.note);
    if(f) f.qty=num(f.qty)+num(i.qty); else lines.push({dish:i.dish,qty:num(i.qty)||1,price:priceOf(i.dish)});
  }));
  billLines=lines; billTip=0; billTipPct=null; billDisc={v:0,mode:"pct",why:""}; billSplit=Math.max(1,num(os[0]&&os[0].guests)||1);

function receiptText(b){
  const L=[], cur=b.currency||"CAD", rt=b.rate==null?1:num(b.rate);
  L.push("TASTE OF PERU"); L.push(tt("Table","Mesa")+" "+b.table+"  ·  "+b.date+" "+(b.paid||"").slice(11,16));
  L.push("".padEnd(34,"-"));
  (b.lines||[]).forEach(l=>{ const left=`${l.qty}x ${l.dish}`.slice(0,23); L.push(left.padEnd(24)+fmtCur(num(l.qty)*num(l.price),cur,rt).padStart(10)); });
  L.push("".padEnd(34,"-"));
  const amt=v=>(num(v)<0?"-":"")+fmtCur(Math.abs(num(v)),cur,rt);
  const row=(a,v)=>L.push(String(a).slice(0,23).padEnd(24)+amt(v).padStart(10));
  row(tt("Subtotal","Subtotal"),b.subtotal);
  if(num(b.discount)) row(tt("Discount","Descuento")+(b.discountReason?" ("+b.discountReason+")":""),-num(b.discount));
  row("GST "+num(b.taxRate)+"%",b.tax);
  if(num(b.tip)) row(tt("Tip","Propina"),b.tip);
  row(tt("TOTAL","TOTAL"),b.total);
  if(num(b.split)>1) row(tt("Each","Cada uno")+" ("+b.split+")",b.per);
  L.push(tt("Payment","Pago")+": "+payName(b.method)+" · "+cur);
  if(cur!=="CAD") L.push(tt("Rate","Cambio")+": 1 CAD = "+rt+" "+cur+"  ·  "+fmtCur(b.total,"CAD",1)+" CAD");
  L.push(""); L.push(tt("Thank you!","¡Gracias!"));
  return L.join("\n");
}

    const rm=e.target.closest("[data-brm]"); if(rm){ billLines.splice(num(rm.dataset.brm),1); billBody(); return; }
    const tp=e.target.closest("[data-tip]"); if(tp){ billTipPct=num(tp.dataset.tip); billTip=0; billBody(); return; }
    if(e.target.id==="blAdd"){ (billLines=billLines||[]).push({dish:"",qty:1,price:0}); billBody(); return; }

  document.getElementById("blBody").addEventListener("change",e=>{

    if(el.id==="blDiscMode"){ billDisc.mode=el.value; billDisc.v=0; billBody(); }
    if(el.id==="blDiscWhy"){ billDisc.why=el.value.trim(); }
    if(el.id==="blTip"){ billTip=toCAD(el.value); billTipPct=null; billBody(); }

async function payBill(){
  const msg=document.getElementById("blMsg"), t=billTotals();
  const lines=(billLines||[]).filter(l=>l.dish&&num(l.qty)>0);
  if(!lines.length||t.total<=0){ msg.textContent=tt("Add at least one line with a price.","Agrega al menos una línea con precio."); return; }
  const stamp=new Date().toISOString(), os=openOrders(billTable);
  const bill={date:today(),table:num(billTable),guests:num(os[0]&&os[0].guests)||t.split,lines,
    linesText:lines.map(l=>`${l.qty}× ${l.dish} @ ${money(l.price)}`).join("; "),
    subtotal:t.subtotal,discount:t.discount,discountReason:billDisc.why,taxRate:taxRate(),tax:t.tax,tip:t.tip,
    total:t.total,split:t.split,per:t.per,method:billMethod,status:"paid",orderIds:os.map(o=>o.id).join(","),
    currency:curOk(state.cur)?state.cur:"CAD",rate:curOk(state.cur)?curRate(state.cur):1,totalCur:r2(t.total*(curOk(state.cur)?curRate(state.cur):1)),
    by:SESSION?SESSION.name:"",created:stamp,paid:stamp};
  // stock: dishes already served from the Kitchen board left the Kardex then; the bill only takes out the rest
  const done={}; os.filter(o=>o.stockDone).forEach(o=>(o.items||[]).forEach(i=>{ const k=dishKey(i.dish); done[k]=num(done[k])+num(i.qty); }));
  const rest=lines.map(l=>{ const k=dishKey(l.dish), take=Math.min(num(l.qty),num(done[k])); done[k]=num(done[k])-take; return {dish:l.dish,qty:r3(num(l.qty)-take)}; }).filter(l=>l.qty>0);
  const use=stockUseForLines(rest);
  bill.stockLines=rest; bill.stockUse=use; bill.stockText=useText(use);
  bill.salesAll=true;   // every line (drinks and dishes) is counted in Sales
  { const bc=billCostOf(lines); bill.cost=bc.cost; bill.costLines=bc.lines; bill.costKnown=bc.known; }
  const id="b"+today().replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,7);
  await dbSet("bills/"+id,bill);
  // on the Google Sheet the server discounts the stock when it saves a new bill; elsewhere the app does it
  if(MODE!=="sheet") for(const u of use){ const it=invItem(u.id); if(it) await kardexMove(it,{type:"out",reason:"sale",qty:u.qty,ref:tt("Bill","Factura")+" "+id}); }

  // close the table's orders (their stock is now taken out by the bill), free the table and add the menu drinks to the day's sales
  for(const o of os) await dbUpd("orders",o.id,{status:"served",billId:id,stockDone:true,updated:stamp});
  await freeTable(billTable);
  let counted=0, skipped=0;
  const cur=D.sales.find(s=>s.id===today())||{items:{},hours:{}};
  const items={...(cur.items||{})}, hours={...(cur.hours||{})};
  lines.forEach(l=>{ const pid=saleKeyOf(l.dish);
    if(!pid){ skipped++; return; }
    counted++; const it=items[pid]||{cups:0,revenue:0};
    it.cups=num(it.cups)+num(l.qty); it.revenue=r2(num(it.revenue)+num(l.qty)*num(l.price)); items[pid]=it; });
  if(counted){ const h=String(new Date().getHours()).padStart(2,"0"); hours[h]=num(hours[h])+lines.reduce((s,l)=>s+(saleKeyOf(l.dish)?num(l.qty):0),0); await dbSet("sales/"+today(),{items,hours}); }
  showReceipt({...bill,id});
  billMsg=tt(`Charged ${money(bill.total)} for table ${bill.table}. The table is free again and its orders are closed.`,`Cobrado ${money(bill.total)} de la mesa ${bill.table}. La mesa quedó libre y sus órdenes cerradas.`)+(skipped?" "+tt(`${skipped} line(s) are not menu drinks, so they are not counted in module 3 · Costs, sales & analytics.`,`${skipped} línea(s) no son bebidas del menú, así que no se cuentan en el módulo 3 · Costos, ventas y análisis.`):"");
  billTable=""; billLines=null; billTip=0; billTipPct=null; billDisc={v:0,mode:"pct",why:""}; billSplit=1;
  render();
}

/* ================= MENU (Menú: comidas y bebidas) ================= */
const MENU_CATS=[["comida","Food","Comidas"],["bebida","Drinks","Bebidas"]];
const MENU_KINDS={
  comida:[["entrada","Starter","Entrada"],["fondo","Main dish","Plato de fondo"],["postre","Dessert","Postre"],["otro","Other","Otro"]],
  bebida:[["jugo","Juice","Jugo"],["gaseosa","Soda","Gaseosa"],["alcohol","Alcohol","Alcohol"],["caliente","Hot drink","Bebida caliente"],["otro","Other","Otra"]]
};
const catName=c=>{const x=MENU_CATS.find(m=>m[0]===c);return x?tt(x[1],x[2]):c;};
const kindName=(c,k)=>{const x=(MENU_KINDS[c]||[]).find(m=>m[0]===k);return x?tt(x[1],x[2]):(k||"");};
const menuItems=cat=>D.menu.filter(m=>!cat||m.cat===cat).sort((a,b)=>String(a.kind).localeCompare(String(b.kind))||String(a.name).localeCompare(String(b.name)));
const menuActive=()=>D.menu.filter(m=>m.active!==false);
const menuNames=()=>{const n=menuActive().map(m=>itemName(m)).filter(Boolean);return n.length?n:P.map(p=>T(p.name));};
const dishDatalist=id=>`<datalist id="${id}">${menuNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`;
// the drinks and dishes of this app, so they can be loaded into the menu in one click (drinks → Juices, lomo saltado → Food → Main dish)
const SEED_DRINKS=()=>P.map(p=>({name:T(p.name),cat:p.cat||"bebida",kind:p.kind||"jugo",prodId:p.id,price:0,active:true}));
async function seedMenuDrinks(){
  let added=0;
  for(const d of SEED_DRINKS()){
    if(D.menu.some(m=>m.prodId===d.prodId||dishKey(m.name)===dishKey(d.name))) continue;
    await dbAdd("menu",d); added++;
  }
  return added;
}
let menuCat="comida", menuSeeded=false, mnDocMsg="";
// Menu → "Import ingredients": a file with a list of ingredients → stock (and, with a Name typed, a new dish whose recipe is that list)
async function ingredientsFromDoc(file){
  const box=document.getElementById("mnDocMsg"), say=t=>{ mnDocMsg=esc(t); if(box) box.innerHTML=mnDocMsg; };
  if(!DB) return noDb();
  if(!canWrite("inventory")){ say(tt("Your role can't add items to the stock.","Tu rol no puede agregar artículos al stock.")); return; }
  say(tt("Reading “"+file.name+"”…","Leyendo “"+file.name+"”…"));
  try{
    const {r,how}=await learnFile(file,say,true);
    if(!r.ingredients.length){ say(tt("I couldn't find ingredients in this file. Put one ingredient per line, e.g. “500 g beef sirloin”.","No encontré ingredientes en este archivo. Pon un ingrediente por línea, p. ej. “500 g de lomo de res”.")); return; }
    const {ingredients,created,linked}=await linkIngredients(r);
    const newNames=ingredients.map(g=>g.n);
    let extra="", id="";
    const typed=val("mnName");
    if(typed&&canWrite("menu")&&canWrite("recipes")){
      const name=typed.charAt(0).toUpperCase()+typed.slice(1);
      if(menuFind(name)) extra=tt(` “${name}” is already on the menu, so no dish was created — link these ingredients in Recipes → ${name}.`,` “${name}” ya está en el menú, así que no se creó un plato — vincula estos ingredientes en Recetas → ${name}.`);
      else{
        const cat=val("mnCat")||menuCat, kind=val("mnKind"); id="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        await dbSet("menu/"+id,{name,cat,kind,price:toCAD(val("mnPrice")),prodId:matchProduct(name),notes:val("mnNotes"),active:true});
        const keep=ingredients.filter(g=>g.n&&num(g.q)>0);
        if(keep.length){ const stamp=new Date().toISOString();
          await saveRecipeDoc({id,name,prodId:matchProduct(name)},{portionLabel:r.portionLabel||"",ingredients:keep,steps:r.steps.join("\n"),notes:r.notes||""},{locked:true,lockedAt:stamp,lockedBy:SESSION?SESSION.name:"",updated:stamp,source:file.name}); }
        const el=document.getElementById("mnForm"); if(el){ el.reset(); document.getElementById("mnCat").value=cat; const ks=document.getElementById("mnKind"); ks.innerHTML=(MENU_KINDS[cat]||[]).map(k=>`<option value="${k[0]}">${tt(k[1],k[2])}</option>`).join(""); ks.value=kind; document.getElementById("mnPrice").value=0; }
        extra=keep.length?tt(` “${name}” was added to the menu with these ingredients as its recipe (1 portion${r.servingsFound?`, the file makes ${Math.max(1,num(r.servings))}`:""}).`,` “${name}” se agregó al menú con estos ingredientes como su receta (1 porción${r.servingsFound?`, el archivo rinde ${Math.max(1,num(r.servings))}`:""}).`)
          :tt(` “${name}” was added to the menu; the file has no amounts, so set its recipe in Recipes.`,` “${name}” se agregó al menú; el archivo no tiene cantidades, así que define su receta en Recetas.`);
      }
    }
    say(tt(`✅ Ingredients from “${file.name}”${how==="ai"?" (read with AI)":""}: ${ingredients.length} found — ${created} new in the stock, ${linked} already there${ingredients.length-created-linked>0?`, ${ingredients.length-created-linked} skipped (water/ice)`:""}. New stock items start at quantity 0: fill them in with “+ Stock” in 2 · Kitchen & inventory.${extra}`,
      `✅ Ingredientes de “${file.name}”${how==="ai"?" (leído con IA)":""}: ${ingredients.length} encontrados — ${created} nuevos en el stock, ${linked} ya existían${ingredients.length-created-linked>0?`, ${ingredients.length-created-linked} omitidos (agua/hielo)`:""}. Los artículos nuevos empiezan con cantidad 0: complétalos con “+ Stock” en 2 · Cocina e inventario.${extra}`)
      +(newNames.length?"\n"+newNames.join(", "):""));
    if(box){ box.style.whiteSpace="pre-line"; if(id) box.insertAdjacentHTML("beforeend",` <button type="button" class="linkbtn" data-openrec="${esc(id)}">${tt("Open its recipe","Abrir su receta")} →</button>`);
      box.insertAdjacentHTML("beforeend",` <button type="button" class="linkbtn" data-openstock="1">${tt("Open the stock","Abrir el stock")} →</button>`); mnDocMsg=box.innerHTML; }
    toast(tt(`${created} ingredient(s) added to the stock.`,`${created} ingrediente(s) agregado(s) al stock.`));
  }catch(e){ console.warn(e); say(e&&e.msg?e.msg:tt("Could not read this file.","No se pudo leer este archivo.")); }
}
// Menu → new dish or drink straight from a recipe document: menu item + saved recipe (1 portion) + stock items
async function menuFromDoc(file){
  const box=document.getElementById("mnDocMsg"), say=t=>{ mnDocMsg=esc(t); if(box) box.innerHTML=mnDocMsg; };
  if(!DOC_OK.test(file.name)){ say(DOC_BAD()); return; }
  if(!DB) return noDb();
  if(!canWrite("menu")||!canWrite("recipes")){ say(tt("Only an administrator can add dishes from a document.","Solo un administrador puede agregar platos desde un documento.")); return; }
  const cat=val("mnCat")||menuCat, kind=val("mnKind"), price=toCAD(val("mnPrice")), notes=val("mnNotes");
  say(tt("Reading “"+file.name+"”…","Leyendo “"+file.name+"”…"));
  try{
    const {r,how}=await learnFile(file,say);
    let name=(val("mnName")||r.name||file.name.replace(DOC_OK,"").replace(/[_-]+/g," ")).trim().slice(0,60); name=name.charAt(0).toUpperCase()+name.slice(1);
    if(menuFind(name)){ say(tt(`“${name}” is already on the menu. To replace its recipe, open Recipes → ${name} → “Learn ingredients and preparation from a Word document”. Or type a different name above and try again.`,`“${name}” ya está en el menú. Para reemplazar su receta, abre Recetas → ${name} → “Aprender ingredientes y preparación de un documento de Word”. O escribe otro nombre arriba e inténtalo de nuevo.`)); return; }
    const id="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await dbSet("menu/"+id,{name,cat,kind,price,prodId:matchProduct(name),notes:notes||r.notes||"",active:true});
    const {ingredients,created,linked,skipped,s}=await linkIngredients(r);
    const keep=ingredients.filter(g=>g.n&&num(g.q)>0), miss=ingredients.filter(g=>!(num(g.q)>0)).map(g=>g.n);
    const stamp=new Date().toISOString();
    if(keep.length) await saveRecipeDoc({id,name,prodId:matchProduct(name)},{portionLabel:r.portionLabel||"",ingredients:keep,steps:r.steps.join("\n"),notes:r.notes||""},{locked:true,lockedAt:stamp,lockedBy:SESSION?SESSION.name:"",updated:stamp,source:file.name});
    else pendingImport={itemId:id,draft:{...defaultStandard({id,prodId:""}),saved:false,portionLabel:r.portionLabel||"",ingredients,steps:r.steps.join("\n"),notes:r.notes||""}};
    const el=document.getElementById("mnForm"); if(el){ el.reset(); document.getElementById("mnCat").value=cat; const ks=document.getElementById("mnKind"); ks.innerHTML=(MENU_KINDS[cat]||[]).map(k=>`<option value="${k[0]}">${tt(k[1],k[2])}</option>`).join(""); ks.value=kind; document.getElementById("mnPrice").value=0; }
    say(tt(`✅ “${name}” added to ${catName(cat)} · ${kindName(cat,kind)}${how==="ai"?" (read with AI)":""}. Recipe saved for 1 portion: ${keep.length} ingredient(s), ${r.steps.length} step(s)${r.servingsFound?` (the document makes ${s} portions)`:" (the document doesn't say how many portions — amounts kept as written)"}. Stock: ${created} new item(s), ${linked} already there${skipped?`, ${skipped} not added (your role)`:""}.${miss.length?` Without an amount, left out of the recipe: ${miss.join(", ")}.`:""}${num(price)?"":" Set its price."}`,
      `✅ “${name}” agregado a ${catName(cat)} · ${kindName(cat,kind)}${how==="ai"?" (leído con IA)":""}. Receta guardada para 1 porción: ${keep.length} ingrediente(s), ${r.steps.length} paso(s)${r.servingsFound?` (el documento rinde ${s} porciones)`:" (el documento no dice cuántas porciones rinde — cantidades como están escritas)"}. Stock: ${created} artículo(s) nuevo(s), ${linked} ya existían${skipped?`, ${skipped} sin agregar (tu rol)`:""}.${miss.length?` Sin cantidad, quedaron fuera de la receta: ${miss.join(", ")}.`:""}${num(price)?"":" Ponle precio."}`));
    if(box) box.insertAdjacentHTML("beforeend",` <button type="button" class="linkbtn" data-openrec="${esc(id)}">${tt("Open its recipe","Abrir su receta")} →</button>`);
    mnDocMsg=box?box.innerHTML:mnDocMsg;
    toast(tt(`“${name}” added with its recipe and ingredients.`,`“${name}” agregado con su receta e ingredientes.`));
  }catch(e){ console.warn(e); say(e&&e.msg?e.msg:tt("Could not read this document.","No se pudo leer este documento.")); }
}

function wireMenu(){
  main.querySelectorAll("[data-mncat]").forEach(b=>b.onclick=()=>{menuCat=b.dataset.mncat;render();window.scrollTo({top:0});});
  const kindSel=()=>{const c=document.getElementById("mnCat").value;
    document.getElementById("mnKind").innerHTML=(MENU_KINDS[c]||[]).map(k=>`<option value="${k[0]}">${tt(k[1],k[2])}</option>`).join("");};
  document.getElementById("mnCat").onchange=kindSel;
  document.getElementById("mnForm").onsubmit=async e=>{
    e.preventDefault(); const name=val("mnName"), msg=document.getElementById("mnMsg");
    if(!name){ msg.textContent=tt("Type a name — or use “Import document” to take it from a recipe file.","Escribe un nombre — o usa “Importar documento” para tomarlo de un archivo de receta."); return; }
    if(menuFind(name)){ msg.textContent=tt(`“${name}” is already on the menu.`,`“${name}” ya está en el menú.`); return; }
    const cat=val("mnCat"), kind=val("mnKind");
    const prod=matchProduct(name);
    await dbAdd("menu",{name,cat,kind,price:toCAD(val("mnPrice")),prodId:prod,notes:val("mnNotes"),active:true});
    msg.textContent=""; e.target.reset(); document.getElementById("mnCat").value=cat; kindSel(); document.getElementById("mnPrice").value=0; document.getElementById("mnName").focus();
  };
  const pickDoc=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onchange=async()=>{ const f=el.files[0]; el.value=""; if(!f) return; document.getElementById("mnMsg").textContent="";
    if(!DOC_OK.test(f.name)){ document.getElementById("mnDocMsg").textContent=DOC_BAD(); return; }
    const bs=main.querySelectorAll('#mnDocBox label.btn'); bs.forEach(x=>x.classList.add("ro")); try{ await fn(f); }finally{ bs.forEach(x=>x.classList.remove("ro")); } }; };
  pickDoc("mnDoc",menuFromDoc); pickDoc("mnIng",ingredientsFromDoc);
  document.getElementById("mnDocBox").onclick=e=>{ if(e.target.closest("[data-openstock]")){ state.tab="ai"; state.aiView="m2"; mnDocMsg=""; save(); render(); window.scrollTo({top:0}); return; }
    const b=e.target.closest("[data-openrec]"); if(!b) return; state.tab="recipes"; state.recipe=b.dataset.openrec; impMsg={}; mnDocMsg=""; save(); render(); window.scrollTo({top:0}); };
  document.getElementById("mnSeed").onclick=async()=>{
    const n=await seedMenuDrinks();
    document.getElementById("mnMsg").textContent=n?tt(`${n} item(s) added to the menu. Set their prices.`,`${n} producto(s) agregado(s) al menú. Ponles precio.`):tt("They are already on the menu.","Ya están en el menú.");
  };
  const list=document.getElementById("mnList");
  list.addEventListener("change",async e=>{
    const id=e.target.closest("tr")?.dataset.id; if(!id) return; const f=e.target.dataset.f;
    if(f==="name"){ const it=D.menu.find(x=>x.id===id); if(!it) return; const old=itemName(it);
      let nm=e.target.value.trim().replace(/\s+/g," ").slice(0,60); if(nm) nm=nm.charAt(0).toUpperCase()+nm.slice(1);
      if(!nm){ e.target.value=old; toast(tt("The name can't be empty.","El nombre no puede quedar vacío.")); return; }
      if(nm===old) return;
      const dup=D.menu.find(x=>x.id!==id&&[x.name,x.name_en,x.name_es,itemName(x)].some(n=>dishKey(n)===dishKey(nm)));
      if(dup){ e.target.value=old; toast(tt(`“${nm}” is already on the menu.`,`“${nm}” ya está en el menú.`)); return; }
      const aka=[...new Set([...String(it.aka||"").split("|"),old,it.name].filter(x=>x&&dishKey(x)!==dishKey(nm)))].join("|");
      await dbUpd("menu",id,{name:nm,name_es:nm,name_en:nm,customName:true,aka});
      if(recipeOf(id)) await dbUpd("recipes","r"+id,{item:nm});
      toast(tt(`Renamed to “${nm}”.`,`Nombre cambiado a “${nm}”.`)); }
    if(f==="price") await dbUpd("menu",id,{price:Math.max(0,toCAD(e.target.value))});
    if(f==="active") await dbUpd("menu",id,{active:e.target.checked});
    if(f==="kind") await dbUpd("menu",id,{kind:e.target.value});
    if(f==="notes") await dbUpd("menu",id,{notes:e.target.value.trim()});
  });
  list.addEventListener("focusout",()=>setTimeout(()=>{if(!list.contains(document.activeElement))refreshAI();},50));
  list.addEventListener("click",async e=>{ const b=e.target.closest("[data-mndel]"); if(!b) return;
    const it=D.menu.find(x=>x.id===b.dataset.mndel);
    if(it&&confirm(tt(`Delete “${it.name}” from the menu?`,`¿Borrar “${it.name}” del menú?`))) await dbDel("menu",it.id); });
  if(!canWrite("menu")) main.querySelectorAll("#mnForm input,#mnForm select,#mnForm button,#mnSeed,#mnDoc,#mnIng,#mnDocBox label").forEach(el=>{el.disabled=true;el.classList.add("ro");el.title=tt("Only an administrator can change the menu","Solo un administrador puede cambiar el menú");});
}
function listMenu(){
  const k=document.getElementById("mnKpis"); if(!k) return;
  if(!menuSeeded&&LOADED.has("menu")&&!D.menu.length&&canWrite("menu")){ menuSeeded=true; seedMenuDrinks().then(n=>{ if(n) toast(tt(`${n} items added to the menu — set their prices.`,`${n} productos agregados al menú — ponles precio.`)); }); }
  const food=menuItems("comida"), drinks=menuItems("bebida"), priced=D.menu.filter(m=>num(m.price)>0);
  setHTML(k,[[D.menu.length,tt("menu items","ítems del menú")],[food.length,tt("food","comidas")],[drinks.length,tt("drinks","bebidas")],[D.menu.length-priced.length,tt("without a price","sin precio"),D.menu.length>priced.length?"warn":""]]
    .map(x=>`<div class="kpi${x[2]?" "+x[2]:""}"><div class="big">${x[0]}</div><div class="lbl">${x[1]}</div></div>`).join(""));
  document.getElementById("mnTitle").textContent=(menuCat==="comida"?"🍽 ":"🥤 ")+catName(menuCat);
  const rows=menuItems(menuCat), el=document.getElementById("mnList");

/* ================= MODULE 2 — KITCHEN & INVENTORY ================= */
/* RULE: stock can be kept in g, kg, mL, L or pieces, but the COST is always per kg (g, kg), per L (mL, L) or per piece.
   Value = stock converted to kg / L × cost.  e.g. 4,500 g of purple corn at CA$8.50/kg = 4.5 kg × 8.50 = CA$38.25 */
const UNITS=["g","kg","ml","L","pc"];
const baseOf=u=>u==="g"||u==="kg"?"kg":u==="ml"||u==="mL"||u==="L"||u==="l"?"L":"pc";
/* Pieces: they are BOUGHT by the package but COSTED per piece. Unit cost = package price ÷ pieces in the package
   (e.g. a box of 30 eggs for CA$9.00 → CA$0.30 per egg). Value = pieces × unit cost. "pieces per package" is the usual box size. */
const packOf=i=>i&&i.unit==="pc"&&num(i.pack)>0?num(i.pack):1;
const factorOf=i=>i.unit==="g"||i.unit==="ml"||i.unit==="mL"?1000:1;   // stock units in 1 cost unit (g, mL → kg, L)
const toBase=(q,u)=>u==="g"||u==="ml"||u==="mL"?num(q)/1000:num(q);
const costR=(i,v)=>i&&i.unit==="pc"?Math.round(num(v)*10000)/10000:Math.round(num(v)*100)/100;   // per-piece costs keep 4 decimals
const toBaseI=(q,i)=>num(q)/factorOf(i);   // stock quantity → kg / L / packages
// the "Per g / mL / piece" column: g/mL = cost per kg/L ÷ 1,000; pieces = package price ÷ on hand (owner's rule)
const perUnit=i=>i.unit==="pc"?(num(i.qty)>0?num(i.cost)*packOf(i)/num(i.qty):0):num(i.cost)/factorOf(i);
// stock value: g / mL = Per g / mL × On hand; pieces = Per piece × pieces per package (owner's rule)
const stockValue=i=>i.unit==="pc"?perUnit(i)*packOf(i):perUnit(i)*num(i.qty);
const cost2=v=>Math.round(num(v)*100)/100;
const money2=v=>fmtCur(v,curNow());
const unitLbl=u=>u==="kg"?"kg":u==="L"||u==="l"?"L":u==="g"?"g":u==="ml"||u==="mL"?"mL":tt("pc","und");
const subUnit=u=>baseOf(u)==="kg"?"g":baseOf(u)==="L"?"mL":tt("pc","und");
// cost of 1 g / 1 mL / 1 piece from the cost per kg / L / package (shown with 4 decimals)
const subCost=(i,c)=>num(c!=null?c:i.cost)/factorOf(i);
const fmtSub=v=>{ const c=curInfo(curNow()); return c[1]+(v*(curRate(c[0])||1)).toLocaleString(state.lang==="es"?"es-CA":"en-CA",{minimumFractionDigits:4,maximumFractionDigits:4}); };
const costPerLbl=(u,i)=>baseOf(u)==="pc"?tt("piece","und"):baseOf(u);
const money4=v=>{ const c=curInfo(curNow()); return c[1]+(num(v)*(curRate(c[0])||1)).toLocaleString(state.lang==="es"?"es-CA":"en-CA",{minimumFractionDigits:2,maximumFractionDigits:4}); };
const KX_REASON={opening:["Opening balance of the month","Saldo inicial del mes"],initial:["Opening stock","Stock inicial"],purchase:["Purchase","Compra"],sale:["Sale (paid bill)","Venta (cuenta cobrada)"],waste:["Waste","Merma"],adjust:["Stock count / adjustment","Conteo / ajuste"],cost:["Cost change","Cambio de costo"],manual_in:["Manual entry","Entrada manual"],manual_out:["Manual exit","Salida manual"],unit:["Unit change to kg/L","Cambio de unidad a kg/L"]};
const kxReason=k=>KX_REASON[k]?tt(KX_REASON[k][0],KX_REASON[k][1]):k;
/* Kardex row snapshot with the same rules as the stock table:
   cost per kg / L / package · per g / mL / piece · stock value (pieces: per piece = package cost ÷ on hand, value = per piece × pieces per package) */
const fmtQ=v=>(Math.round(num(v)*1000)/1000).toLocaleString(state.lang==="es"?"es-CA":"en-CA",{maximumFractionDigits:3});   // Kardex quantities: exact, up to 3 decimals
// Kardex order key: local date + time, so a movement's date and its order always agree
const kxStamp=(d=new Date())=>{ const z=(n,l=2)=>String(n).padStart(l,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}.${z(d.getMilliseconds(),3)}`; };
// timestamp shown in the Kardex: when the movement was recorded (older rows: their order key)
const kxTsFmt=v=>{ v=String(v||""); if(!v) return ""; if(/Z$|[+-]\d\d:\d\d$/.test(v)){ const d=new Date(v); if(!isNaN(d)) v=kxStamp(d); } return v.slice(0,19).replace("T"," "); };
const kxTs=k=>{ const t=kxTsFmt(k.created||k.when); return t?`${esc(t.slice(0,10))}<small>${esc(t.slice(11))}</small>`:"—"; };
function kxSnap(k){ const s={unit:k.unit,pack:num(k.pack)||1,qty:num(k.balQty),cost:num(k.avgCost)};
  return {costPkg:cost2(k.unit==="pc"?s.cost*packOf(s):s.cost),perSub:Math.round(perUnit(s)*10000)/10000,stockVal:cost2(stockValue(s))}; }
const kxDir=k=>k.type==="open"?"Inicial":k.type==="in"||(k.type==="adj"&&num(k.qty)>0)?"Entrada":k.type==="out"||(k.type==="adj"&&num(k.qty)<0)?"Salida":"Costo";
const kxDirLbl=d=>d==="Inicial"?tt("Opening","Saldo inicial"):d==="Entrada"?tt("In","Entrada"):d==="Salida"?tt("Out","Salida"):tt("Cost","Costo");
/* Kardex: every stock movement (in, out, adjustment) with the unit cost, running balance and weighted average cost.
   Saved in the "kardex" collection (Google Sheet tab "Kardex" on the website; the app's database in Claude). */
/* ===== Monthly Kardex: opening balance (start of month) and closing (end of month) =====
   Closing a month saves each item's balance and weighted average cost at the end of the month and writes them as
   "open" rows (opening balance) on day 1 of the next month. Every month up to the last closed one is locked:
   its movements can't be added, edited or deleted, and recalculations start from the latest opening balance. */
const ym=d=>String(d||"").slice(0,7);
const nextYM=m=>{ const [y,mo]=String(m).split("-").map(Number), d=new Date(y,mo,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const prevYM=m=>{ const [y,mo]=String(m).split("-").map(Number), d=new Date(y,mo-2,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const monthName=m=>{ const [y,mo]=String(m).split("-").map(Number); if(!y||!mo) return m; const t=new Date(y,mo-1,1).toLocaleDateString(state.lang==="es"?"es-CA":"en-CA",{month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); };
const kxClosedMap=()=>(D.kxMonths&&D.kxMonths.closed)||{};
const kxLastClosed=()=>Object.keys(kxClosedMap()).sort().pop()||"";
const kxLocked=date=>{ const lc=kxLastClosed(); return !!lc&&ym(date)<=lc; };
const kxLockedMsg=()=>tt(`${monthName(kxLastClosed())} is closed: movements up to that month can't be added, edited or deleted.`,`${monthName(kxLastClosed())} está cerrado: no se pueden agregar, editar ni eliminar movimientos hasta ese mes.`);
// order of the Kardex: date and time; an opening balance goes first on day 1
const kxKey=k=>k.type==="open"?String(k.date||"").slice(0,10)+"T00:00:00.000":String(k.when||k.date||"");
const kxOrder=(a,b)=>kxKey(a).localeCompare(kxKey(b));
// balance and weighted average cost of an item at the end of a date (replaying its Kardex)
function kxBalanceAt(itemId,endDate){ const it=invItem(itemId)||{unit:(D.kardex.find(k=>k.itemId===itemId)||{}).unit}, u={unit:it.unit}, B=x=>toBaseI(x,u);
  let q=0,c=0,n=0;
  D.kardex.filter(k=>k.itemId===itemId&&String(k.date||"").slice(0,10)<=endDate).sort(kxOrder).forEach(k=>{ const qty=num(k.qty); n++;
    if(k.type==="open"){ q=r3(qty); c=costR(u,k.avgCost); }
    else if(k.type==="in"){ const uc=costR(u,k.unitCost), q1=r3(q+qty); c=q1>0?costR(u,(B(q)*c+B(qty)*uc)/B(q1)):uc; q=q1; }
    else if(k.type==="out") q=r3(Math.max(0,q-qty)); else if(k.type==="adj") q=r3(Math.max(0,q+qty)); else if(k.type==="cost") c=costR(u,k.unitCost); });
  return {q,c,n}; }
const monthEnd=m=>{ const [y,mo]=m.split("-").map(Number); return m+"-"+String(new Date(y,mo,0).getDate()).padStart(2,"0"); };
const kxOpenRows=m=>D.kardex.filter(k=>k.type==="open"&&ym(k.date)===m);
async function kxWriteOpening(m,why){   // opening balance rows for month m = balance at the end of the previous month
  const pe=monthEnd(prevYM(m)), ids=[...new Set(D.kardex.filter(k=>String(k.date||"")<=pe).map(k=>k.itemId))].filter(id=>invItem(id));
  let n=0;
  for(const id of ids){ const it=invItem(id), b=kxBalanceAt(id,pe); if(!b.n) continue;
    const sn=kxSnap({unit:it.unit,pack:packOf(it),balQty:b.q,avgCost:b.c}), kid="o"+m.replace("-","")+id;
    await dbSet("kardex/"+kid,{item:it.name,itemId:id,unit:it.unit,costPer:baseOf(it.unit),pack:packOf(it),type:"open",reason:"opening",dir:"Inicial",
      qty:b.q,unitCost:b.c,avgCost:b.c,balQty:b.q,costPkg:sn.costPkg,perSub:sn.perSub,stockVal:sn.stockVal,balValue:sn.stockVal,total:sn.stockVal,
      date:m+"-01",when:m+"-01T00:00:00.000",created:kxStamp(),supplier:"",lot:"",expiry:"",ref:why||"",by:SESSION?(SESSION.name||SESSION.user):""}); n++; }
  return {ids,n}; }
async function kxRecalcAll(){ const ids=[...new Set(D.kardex.map(k=>k.itemId))].filter(id=>id&&invItem(id)); for(const id of ids) await kardexRecalcItem(id); return ids.length; }
async function kxStartMonth(m){
  if(!DB) return noDb(); if(kxOpenRows(m).length) return toast(tt(`${monthName(m)} already has its opening balance.`,`${monthName(m)} ya tiene su saldo inicial.`));
  const lc=kxLastClosed(); if(lc&&lc!==prevYM(m)) return toast(tt(`Close ${monthName(prevYM(m))} first.`,`Primero cierra ${monthName(prevYM(m))}.`));
  const r=await kxWriteOpening(m,tt(`Opening balance of ${monthName(m)}`,`Saldo inicial de ${monthName(m)}`));
  for(const id of r.ids) await kardexRecalcItem(id);
  await dbSet("settings/kardex",{...(D.kxMonths||{}),started:{...((D.kxMonths||{}).started||{}),[m]:{at:kxStamp(),by:SESSION?(SESSION.name||SESSION.user):""}}});
  return r.n; }
async function kxCloseMonth(m){
  if(!DB) return noDb(); const cur=ym(today());
  if(m>=cur) return toast(tt("Only a month that has ended can be closed.","Solo se puede cerrar un mes que ya terminó."));
  if(kxClosedMap()[m]) return toast(tt(`${monthName(m)} is already closed.`,`${monthName(m)} ya está cerrado.`));
  const nx=nextYM(m);
  for(const k of kxOpenRows(nx)) await dbDel("kardex",k.id);          // re-created below with the closing values
  await kxRecalcAll();                                                   // the month's balances and averages, up to date
  const end=monthEnd(m), items={}; let value=0;
  [...new Set(D.kardex.map(k=>k.itemId))].filter(id=>invItem(id)).forEach(id=>{ const it=invItem(id), b=kxBalanceAt(id,end); if(!b.n) return;
    const v=cost2(toBaseI(b.q,it)*b.c); value+=v; items[id]={name:it.name,unit:it.unit,q:b.q,c:b.c,value:v}; });
  const r=await kxWriteOpening(nx,tt(`Closing of ${monthName(m)}`,`Cierre de ${monthName(m)}`));
  for(const id of r.ids) await kardexRecalcItem(id);
  const who=SESSION?(SESSION.name||SESSION.user):"", km=D.kxMonths||{};
  await dbSet("settings/kardex",{...km,closed:{...(km.closed||{}),[m]:{at:kxStamp(),by:who,value:cost2(value),items}},started:{...(km.started||{}),[nx]:{at:kxStamp(),by:who,from:m}}});
  return {items:Object.keys(items).length,value}; }
async function kxReopenLast(){

  for(const k of kxOpenRows(nextYM(lc))) await dbDel("kardex",k.id);
  const km=D.kxMonths||{}, closed={...(km.closed||{})}; delete closed[lc]; const started={...(km.started||{})}; delete started[nextYM(lc)];
  await dbSet("settings/kardex",{...km,closed,started});
  await kxRecalcAll(); return lc; }

async function kardexMove(it,m){
  if(kxLocked(m.date&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)?m.date:today())){ toast(kxLockedMsg()); return; }
  const kt=m.base||kxTotals()[it.id], q0=kt?kt.q:0, c0=kt?kt.c:(m.type==="in"?0:costR(it,it.cost)), stamp=new Date().toISOString();   // the balance comes from the Kardex itself
  let qty=num(m.qty), uc=c0, q1=q0, c1=c0, type=m.type;
  const B=q=>toBaseI(q,it);
  if(type==="in"){ uc=m.unitCost!=null&&m.unitCost!==""?costR(it,m.unitCost):c0; q1=r3(q0+qty); c1=q1>0?costR(it,(B(q0)*c0+B(qty)*uc)/B(q1)):uc; }
  else if(type==="out"){ q1=r3(Math.max(0,q0-qty)); }
  else if(type==="adj"){ q1=r3(Math.max(0,num(m.newQty))); qty=r3(q1-q0); if(!qty) return; }
  else if(type==="cost"){ uc=costR(it,m.unitCost); c1=uc; qty=0; if(c1===c0) return; }
  if(!DB) return noDb();
  await dbUpd("inventory",it.id,{qty:q1,cost:c1,costPer:baseOf(it.unit),updated:stamp});
  const id=m.id||("k"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const date=m.date&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)?m.date:today(), snap=kxSnap({unit:it.unit,pack:packOf(it),balQty:q1,avgCost:c1});
  await dbSet("kardex/"+id,{item:it.name,costPkg:snap.costPkg,perSub:snap.perSub,stockVal:snap.stockVal,date,dir:kxDir({type,qty}),qty:r3(qty),unitCost:uc,balQty:q1,
    supplier:String(m.supplier!=null?m.supplier:(type==="in"?it.supplier||"":"")).slice(0,60),lot:String(m.lot||"").slice(0,40),expiry:m.expiry&&/^\d{4}-\d{2}-\d{2}$/.test(m.expiry)?m.expiry:"",
    created:kxStamp(),when:date+kxStamp().slice(10),itemId:it.id,unit:it.unit,costPer:baseOf(it.unit),pack:packOf(it),type,reason:m.reason||type,total:cost2(B(qty)*uc),
    avgCost:c1,balValue:snap.stockVal,ref:m.ref||"",by:SESSION?(SESSION.name||SESSION.user):""});
  return {q1,c1,id};
}
/* Restart the Kardex: only erases every movement in the Kardex database. It reads nothing and writes nothing else;

// "Delete sales & bills": erases every daily sales record and every bill (receipts), then replays every item's Kardex
// so balances, weighted average costs and inventory are recalculated. The Kardex movements themselves stay (stock is not given back).
const canSalesReset=()=>MODE!=="sheet"||(SESSION&&SESSION.role==="admin");
async function salesReset(){
  if(!DB) return noDb();
  const sales=[...D.sales], bills=[...D.bills];
  for(const x of sales) if(x.id) await dbDel("sales",x.id);
  for(const b of bills) if(b.id) await dbDel("bills",b.id);
  if(D.bill&&D.bill.costClearedAt) await dbSet("settings/bill",{...D.bill,costClearedAt:"",costClearedBy:""});
  const items=await kxRecalcAll();

async function kardexReset(){
  if(!DB) return noDb();
  const old=[...D.kardex]; for(const k of old) if(k.id) await dbDel("kardex",k.id);
  if(canWrite("settings")) await dbSet("settings/kardex",{closed:{},started:{}});
  return {del:old.length};

/* Kardex totals per ingredient: replay every movement in date order with the weighted average cost */
function kxTotals(){ const by={};
  [...D.kardex].sort(kxOrder).forEach(k=>{
    const t=by[k.itemId]||(by[k.itemId]={itemId:k.itemId,item:k.item,unit:k.unit,pack:num(k.pack)||1,ins:0,outs:0,q:0,c:0,n:0}); const it={unit:t.unit}, B=q=>toBaseI(q,it), qty=num(k.qty); t.n++; t.item=k.item||t.item;
    if(k.type==="open"){ t.q=num(k.qty); t.c=costR(it,k.avgCost); }
    else if(k.type==="in"){ const uc=num(k.unitCost), q1=t.q+qty; t.c=q1>0?costR(it,(B(t.q)*t.c+B(qty)*uc)/B(q1)):uc; t.q=q1; t.ins+=qty; }
    else if(k.type==="out"){ t.q=Math.max(0,t.q-qty); t.outs+=qty; }

function kxChainOff(itemId){ const it=invItem(itemId); if(!it) return false; const u={unit:it.unit}, B=x=>toBaseI(x,u);
  const rows=D.kardex.filter(k=>k.itemId===itemId).sort(kxOrder);

    if(k.type==="open"){ q=r3(qty); c=costR(u,k.avgCost); }
    else if(k.type==="in"){ const uc=costR(u,k.unitCost), q1=r3(q+qty); c=q1>0?costR(u,(B(q)*c+B(qty)*uc)/B(q1)):uc; q=q1; }

async function kardexHeal(){

  const sig=D.kardex.length+"|"+D.kardex.map(k=>k.id+":"+k.qty+":"+k.unitCost+":"+(k.when||k.date)).join(",")+"|"+D.inventory.map(i=>i.id+":"+i.qty+":"+i.cost).join(",");

  const ids=[...new Set(D.kardex.map(k=>k.itemId))].filter(id=>id&&kxChainOff(id)); if(!ids.length) return;
  kxHealBusy=true;
  try{ for(const id of ids) await kardexRecalcItem(id);
    const names=ids.map(id=>(invItem(id)||{}).name).filter(Boolean);
    toast(tt(`Kardex recalculated (weighted average and balances): ${names.join(", ")}`,`Kardex recalculado (promedio ponderado y saldos): ${names.join(", ")}`)); }
  catch(e){ console.warn("kardexHeal",e); }
  finally{ kxHealBusy=false; }
}

  const prev=document.activeElement, w=document.createElement("div"); w.className="cfmwrap";
  w.innerHTML=`<div class="cfm" role="alertdialog" aria-modal="true" aria-labelledby="cfmT" aria-describedby="cfmM"><h3 id="cfmT">${esc(title)}</h3><p id="cfmM">${esc(msg||"")}</p><div class="cfmbtns"><button type="button" class="btn ghost" data-cfm="0">${tt("Cancel","Cancelar")}</button><button type="button" class="btn danger" data-cfm="1">${esc(okLabel||tt("OK","Aceptar"))}</button></div></div>`;
  const done=v=>{ w.remove(); document.removeEventListener("keydown",key,true); if(prev&&prev.focus) prev.focus(); res(v); };
  const key=e=>{ if(e.key==="Escape"){ e.preventDefault(); done(false); } if(e.key==="Tab"){ const bs=[...w.querySelectorAll("button")], i=bs.indexOf(document.activeElement); e.preventDefault(); bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus(); } };
  w.addEventListener("click",e=>{ const b=e.target.closest("[data-cfm]"); if(b) done(b.dataset.cfm==="1"); else if(e.target===w) done(false); });
  document.addEventListener("keydown",key,true); document.body.appendChild(w); w.querySelector('[data-cfm="0"]').focus(); }); }
/* ✓ Save an edited stock row: no blanks or 0; stock changes go to the Kardex as a count / adjustment */
// units an item can switch to: same family (g ↔ kg, mL ↔ L) always — quantities are converted and the cost per kg / L stays;
// another family (weight ↔ volume ↔ pieces) only while the item has no stock and no Kardex movements
const invUnitName=u=>({g:tt("grams (g)","gramos (g)"),kg:tt("kilos (kg)","kilos (kg)"),ml:tt("millilitres (mL)","mililitros (mL)"),mL:tt("millilitres (mL)","mililitros (mL)"),L:tt("litres (L)","litros (L)"),pc:tt("pieces","unidades")})[u]||u;
const invHasMoves=it=>num(it.qty)>0||(D.kardex||[]).some(k=>k.itemId===it.id);
function invUnitOpts(it,cur){ const locked=invHasMoves(it), list=UNITS.includes(it.unit)?UNITS:[it.unit,...UNITS];
  return list.map(u=>{ const off=locked&&baseOf(u)!==baseOf(it.unit); return `<option value="${u}"${u===cur?" selected":""}${off?` disabled title="${esc(tt("Only while the item has no stock or Kardex movements","Solo mientras el artículo no tenga stock ni movimientos en el Kardex"))}"`:""}>${esc(invUnitName(u))}</option>`; }).join(""); }
const invUnitF=(from,to)=>factorOf({unit:to})/factorOf({unit:from});   // e.g. kg → g = ×1000
async function invChangeUnit(it,to){ const from=it.unit; if(to===from) return true;
  if(baseOf(to)!==baseOf(from)){
    if(invHasMoves(it)){ toast(tt("This item has stock or Kardex movements: it can only change between g ↔ kg or mL ↔ L.","Este artículo tiene stock o movimientos en el Kardex: solo puede cambiar entre g ↔ kg o mL ↔ L.")); return false; }
    await dbUpd("inventory",it.id,{unit:to,cost:0,costPer:baseOf(to),...(to==="pc"?{pack:1}:{})}); return true; }
  const f=invUnitF(from,to);
  await dbUpd("inventory",it.id,{unit:to,qty:r3(num(it.qty)*f),costPer:baseOf(to)});
  for(const k of (D.kardex||[]).filter(k=>k.itemId===it.id)){ const bal=r3(num(k.balQty)*f), sn=kxSnap({unit:to,pack:1,balQty:bal,avgCost:k.avgCost});
    await dbUpd("kardex",k.id,{unit:to,qty:r3(num(k.qty)*f),balQty:bal,costPkg:sn.costPkg,perSub:sn.perSub,stockVal:sn.stockVal,balValue:sn.stockVal}); }
  return true; }
async function invSave(id){ const it=invItem(id); if(!it) return; const rowQ=f=>document.querySelector(`#invTable [data-f="${f}"][data-id="${id}"]`);
  const fl=[["name",tt("Item","Artículo"),"text"],["min",tt("Alert","Alerta"),"pos"],["par",tt("Max. quantity","Cantidad máxima"),"pos"],...(it.unit==="pc"?[["pack",tt("Pieces per package","Piezas por paquete"),"pos"]]:[])];
  const bad=[]; fl.forEach(([f,l,k])=>{ const el=rowQ(f); if(!el) return; const v=String(el.value||"").trim(), ok=k==="text"?!!v:k==="zero"?(v!==""&&num(v)>=0):(v!==""&&num(v)>0); el.setAttribute("aria-invalid",ok?"false":"true"); if(!ok) bad.push(l); });
  if(bad.length) return toast(tt("Fill in, no blanks or 0.00: ","Completa, sin vacíos ni 0,00: ")+bad.join(", "));
  const v=f=>String(rowQ(f)?rowQ(f).value:"").trim();
  if(num(v("par"))<num(v("min"))){ rowQ("par").setAttribute("aria-invalid","true"); return toast(tt("Maximum quantity must be at least the alert level.","La cantidad máxima debe ser mayor o igual a la alerta.")); }
  const code=rowQ("barcode")?v("barcode"):String(it.barcode||""), cErr=bcCheck(code,id);
  if(cErr){ if(rowQ("barcode")) rowQ("barcode").setAttribute("aria-invalid","true"); return toast(tt("Barcode: ","Código de barras: ")+cErr); }
  if(!DB) return noDb();
  const unit=rowQ("unit")?v("unit"):it.unit;
  if(unit!==it.unit&&!(await invChangeUnit(it,unit))){ rowQ("unit").setAttribute("aria-invalid","true"); return; }
  const name=v("name").slice(0,60), upd={name,min:num(v("min")),par:num(v("par")),barcode:code,updated:new Date().toISOString()};
  await dbUpd("inventory",id,upd);
  if(name!==it.name) for(const k of D.kardex.filter(k=>k.itemId===id)) await dbUpd("kardex",k.id,{item:name});
  const it2={...it,...upd,unit};
  if(it.unit==="pc"&&unit==="pc"){ const n=Math.max(1,Math.round(num(v("pack")))); if(n!==packOf(it)){ const pkg=num(it.cost)*packOf(it); await dbUpd("inventory",id,{pack:n}); await kardexMove({...it2,pack:n},{type:"cost",reason:"cost",unitCost:pkg/n,ref:tt(`Package of ${n}: ${money2(pkg)} ÷ ${n}`,`Paquete de ${n}: ${money2(pkg)} ÷ ${n}`)}); it2.pack=n; } }
  invEdit=null; invDraft={}; toast(tt(`“${name}” saved.`,`“${name}” guardado.`)+(unit!==it.unit?" "+tt(`Unit: ${unitLbl(it.unit)} → ${unitLbl(unit)}.`,`Unidad: ${unitLbl(it.unit)} → ${unitLbl(unit)}.`):"")); listM2(); }
/* Kitchen & inventory: no blank fields and no 0 / 0.00 values. fields = [id, label, "text" | "pos"] */
function reqCheck(fields){ const bad=[];
  fields.forEach(([id,lbl,k])=>{ const el=document.getElementById(id); if(!el) return; const v=String(el.value||"").trim(), ok=k==="text"?!!v:k==="zero"?(v!==""&&num(v)>=0):(v!==""&&num(v)>0);
    el.setAttribute("aria-invalid",ok?"false":"true"); if(!ok) bad.push(lbl); });
  if(!bad.length) return true;
  toast(tt("Fill in, no blanks or 0.00: ","Completa, sin vacíos ni 0,00: ")+bad.join(", "));
  const f=document.querySelector('[aria-invalid="true"]'); if(f) f.focus(); return false; }
