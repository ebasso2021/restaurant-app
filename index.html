function invStatus(i){ const q=stockQty(i);
  if(num(i.min)>0&&q<=num(i.min)) return ["bad",tt("Below alert level","Bajo el nivel de alerta"),"low"];
  if(num(i.par)>0&&q>num(i.par)) return ["warn",tt("Overstocked","Con exceso"),"over"];
  if(!(num(i.min)>0)||!(num(i.par)>0)||!String(i.supplier||"").trim()) return ["warn",tt("Missing data","Faltan datos"),"missing"];
  return ["ok","OK","ok"]; }
// colours shared by the KPI tiles, the notice, the item rows and the item lists: red = below alert level, amber = overstocked
const invStyle=i=>{ const k=invStatus(i)[2]; return k==="low"?"background:var(--bad-bg);color:var(--bad)":k==="over"?"background:var(--warn-bg);color:var(--warn)":""; };
const invTag=i=>{ const k=invStatus(i)[2]; return k==="low"?" — ⛔ "+tt("below alert","bajo alerta"):k==="over"?" — ▲ "+tt("overstocked","con exceso"):""; };
function poLines(){ return D.inventory.filter(i=>i.min>0&&i.qty<=i.min&&i.par>i.qty).map(i=>({...i,order:i.par-i.qty,est:toBaseI(i.par-i.qty,i)*num(i.cost)})); }
function poText(){ const L=poLines(); const by={}; L.forEach(l=>{(by[l.supplier||tt("No supplier","Sin proveedor")] ||= []).push(l);});
  return tt("PURCHASE ORDER","ORDEN DE COMPRA")+" — "+today()+"\n"+Object.entries(by).map(([s,ls])=>`\n${s}\n`+ls.map(l=>`• ${l.name}: ${+l.order.toFixed(2)} ${l.unit}`).join("\n")).join("\n"); }
// "Portions possible with current stock": one row per menu item with a saved recipe linked to inventory (fewest first)
function ppRows(){ return D.menu.filter(m=>m.active!==false).map(m=>{const r=recipeOf(m.id); if(!r||!r.locked) return null; const pp=portionsPossible(r); return pp.linked?{m,pp}:null;}).filter(Boolean).sort((a,b)=>a.pp.best-b.pp.best); }
function ppListHTML(){ const rows=ppRows();
  return rows.length?`<ul class="rows">${rows.map(x=>`<li><div>${esc(itemName(x.m)||x.m.name)}<small>${tt("runs out first","se acaba primero")}: ${esc(x.pp.limit||"—")}</small></div><b class="${x.pp.best===0?"alltxt":""}">${x.pp.best===0?"⛔ ":""}${x.pp.best} ${tt("portions","porciones")}</b></li>`).join("")}</ul>`
    :`<p class="empty">${tt("No saved recipe is linked to inventory yet.","Aún no hay recetas guardadas vinculadas al inventario.")}</p>`; }
// latest stock entries (Kardex "in" rows), newest first; entries from today are marked
function recentStockHTML(n=8){
  const rows=(D.kardex||[]).filter(k=>k.type==="in"&&num(k.qty)>0).sort((a,b)=>String(b.created||b.when||b.date).localeCompare(String(a.created||a.when||a.date))).slice(0,n);
  if(!rows.length) return `<p class="empty">${tt("No stock added yet.","Aún no se ha agregado stock.")}</p>`;
  const t=today();
  return `<ul class="rows">${rows.map(k=>{ const ts=kxTsFmt(k.created||k.when)||k.date||"", isToday=String(ts).slice(0,10)===t||k.date===t;
    return `<li><div>${isToday?`<span class="badge ok">${tt("Today","Hoy")}</span> `:""}${esc(k.item||"")}<small>${esc(ts.slice(0,16))} · ${esc(kxReason(k.reason))}${k.supplier?" · "+esc(k.supplier):""}${k.by?" · "+tt("by","por")+" "+esc(k.by):""}</small></div><b class="kin">+${fmtQ(num(k.qty))} ${esc(unitLbl(k.unit))}</b></li>`; }).join("")}</ul>`;

// portions left for a dish typed in an order (null = no saved recipe linked to inventory)
function portionsForDish(d){ const m=menuFind(d); if(!m) return null; const r=recipeOf(m.id); if(!r||!r.locked) return null; const pp=portionsPossible(r); return pp.linked?pp.best:null; }
// "Add stock" is locked while a purchase is being saved and until the Kardex shows it
let asBusy=false;
function asLock(on){ asBusy=on; const f=document.getElementById("addStockForm"); if(!f) return; const b=f.querySelector('button[type="submit"]');
  if(b){ b.disabled=on; b.textContent=on?"⏳ "+tt("Updating Kardex…","Actualizando Kardex…"):tt("Add stock","Agregar stock"); }
  f.setAttribute("aria-busy",on?"true":"false"); }
// last "Updated balance" of an item in the Kardex (its most recent movement by date and time)

// a movement in purchase units: g → kg, mL → L, pieces → packages (kg / L stay as they are)
function kxBig(k){ const q=Math.abs(num(k.qty)), u=k.unit;
  if(u==="g") return {v:r3(q/1000),u:"kg"}; if(u==="ml"||u==="mL") return {v:r3(q/1000),u:"L"};
  if(u==="pc"){ const pk=num(k.pack)>0?num(k.pack):packOf(invItem(k.itemId)||{unit:"pc"}); return {v:r3(q/pk),u:tt(pk===1?"pc":"packages",pk===1?"und":"paquetes")}; }
  return {v:r3(q),u:unitLbl(u)}; }

function stockUseForLines(lines){ const use=[];
  (lines||[]).forEach(l=>{ const q=num(l.qty); if(!(q>0)) return; const m=menuFind(l.dish); const r=m?recipeOf(m.id):null; if(!r||!r.locked) return;
    stockUseFor(r,q).forEach(u=>{ const f=use.find(x=>x.id===u.id); if(f) f.qty=r3(f.qty+u.qty); else use.push({...u}); }); });
  return use; }

// a dish or drink served from the Kitchen board: every ingredient of its recipe leaves the Kardex (type out)
async function serveOrder(o){
  const stamp=new Date().toISOString();
  if(o.stockDone){ await dbUpd("orders",o.id,{status:"served",updated:stamp}); return {use:o.stockUse||[],again:true}; }
  const use=stockUseForLines((o.items||[]).map(i=>({dish:i.dish,qty:i.qty})));
  if(MODE==="sheet"){   // the server takes the stock out when it saves the order as served (any role can serve)
    await dbUpd("orders",o.id,{status:"served",updated:stamp});
    if(DB&&DB._refresh) setTimeout(()=>{ ["orders","kardex","inventory"].forEach(c=>DB._refresh(c)); },900);
  } else {
    const ref=tt(`Served · table ${o.table}`,`Servido · mesa ${o.table}`);
    for(const u of use){ const it=invItem(u.id); if(it) await kardexMove(it,{type:"out",reason:"sale",qty:u.qty,ref}); }
    await dbUpd("orders",o.id,{status:"served",stockDone:true,stockUse:use,stockText:useText(use),updated:stamp});
  }
  return {use};
}

function salesDays(n){ const out=[]; for(let i=n-1;i>=0;i--){const d=addDays(today(),-i); const s=D.sales.find(x=>x.id===d); const items={...((s&&s.items)||{})};
    (D.bills||[]).filter(b=>b.date===d&&!b.salesAll).forEach(b=>(b.lines||[]).forEach(l=>{ if(matchProduct(l.dish)) return; const k=saleKeyOf(l.dish); if(!k) return;   // older bills: dishes were not counted then
      const it=items[k]?{...items[k]}:{cups:0,revenue:0}; it.cups=num(it.cups)+num(l.qty); it.revenue=num(it.revenue)+num(l.qty)*num(l.price); items[k]=it; }));
    out.push({date:d,items,hours:(s&&s.hours)||{}});} return out; }
function dayTotals(day){ let cups=0,rev=0,cost=0; Object.entries(day.items).forEach(([pid,it])=>{cups+=num(it.cups);rev+=num(it.revenue);cost+=num(it.cups)*prodCost(pid).c;}); return {cups,rev,cost}; }
function weekdayForecast(){
  const hist=salesDays(56).filter(d=>Object.keys(d.items).length);
  if(hist.length<7) return null;
  const res=[];
  for(let i=1;i<=7;i++){ const d=addDays(today(),i), wd=dow(d); const same=hist.filter(h=>dow(h.date)===wd).slice(-4);
    const per={}; P.forEach(p=>{per[p.id]=same.length?same.reduce((s,h)=>s+num(h.items[p.id]?.cups),0)/same.length:0;});
    const rev=same.length?same.reduce((s,h)=>s+dayTotals(h).rev,0)/same.length:0;
    res.push({date:d,per,cups:Object.values(per).reduce((a,b)=>a+b,0),rev,n:same.length}); }
  return res;
}
function hourlyProfile(){ const hrs={}; salesDays(28).forEach(d=>Object.entries(d.hours).forEach(([h,c])=>{hrs[h]=(hrs[h]||0)+num(c);})); const days=salesDays(28).filter(d=>Object.keys(d.hours).length).length; return {hrs,days}; }

  const hh=Object.keys(hrs).sort();
  return `<div class="tablewrap"><table class="dt"><thead><tr><th>${tt("Day","Día")}</th>${P.map(p=>`<th>${esc(prodLabel(p))}</th>`).join("")}<th>${tt("Total cups","Total vasos")}</th></tr></thead><tbody>${f.map(r=>`<tr><td class="nw">${DOWN[state.lang][dow(r.date)]} ${+r.date.slice(8)}</td>${P.map(p=>`<td>${Math.round(r.per[p.id])}</td>`).join("")}<td><b>${Math.round(r.cups)}</b></td></tr>`).join("")}</tbody></table></div>
   <p class="hint">${tt("Estimate from your own sales: average of the same weekday, last 4 weeks.","Estimación con tus propias ventas: promedio del mismo día de la semana, últimas 4 semanas.")}</p>
   ${hh.length?`<h4 class="minih">${tt("Average cups by hour","Vasos promedio por hora")} (${days} ${tt("days with hourly data","días con datos por hora")})</h4><div class="hours">${hh.map(h=>{const v=hrs[h]/Math.max(1,days);const mx=Math.max(...hh.map(k=>hrs[k]/Math.max(1,days)));return `<div class="hr" title="${h}:00 — ${v.toFixed(1)}"><span style="height:${Math.max(4,v/mx*60)}px"></span><small>${h}</small></div>`;}).join("")}</div>`:`<p class="hint">${tt("Add the hour when you log sales to see the hourly forecast.","Agrega la hora al registrar ventas para ver la predicción por hora.")}</p>`}`;
}

Adjust the baseline only where the context or a clear trend in the data justifies it, and keep changes modest. ${LANGLINE()}

/* ================= BARCODES — scan 1D / 2D codes and print our own labels =================
   International standard: GS1.
   · Product codes (GTIN): EAN-13, UPC-A, EAN-8, UPC-E and GTIN-14 (ITF-14), each with a mod-10 check digit.
   · GS1 Application Identifiers read from GS1-128, GS1 DataMatrix, GS1 QR / Digital Link and DataBar:
     (01) GTIN · (10) lot · (17) expiry · (15) best before · (310n) net kg · (315n) net L · (320n) net lb · (30)/(37) count.
   · Our own codes: GS1 Restricted Circulation Numbers "within a company" (GS1 prefixes 040–049):
     0400 + 8-digit sequence + check digit, printed as EAN-13. They are unique only inside the restaurant.
   Readers: USB / Bluetooth scanners (they type the code + Enter — 1D and 2D), the phone / tablet camera, or a photo.
   Camera reading uses the browser's BarcodeDetector when it has one; otherwise, and for drawing every label, the open-source
   ZXing-C++ library (zxing-wasm, MIT licence), loaded only when needed from vendor/zxing-wasm/ or, if missing, from jsDelivr. */
const ZXV="3.1.3";
const gtinCheck=s=>{ let t=0; for(let i=s.length-1,w=3;i>=0;i--,w=4-w) t+=(+s[i])*w; return (10-t%10)%10; };   // s = the digits WITHOUT the check digit
const gtinValid=s=>/^(\d{8}|\d{12,14})$/.test(s)&&gtinCheck(s.slice(0,-1))===+s.slice(-1);
// UPC-E (8 digits) → UPC-A (12 digits), so a short code on a small pack finds the same item
function upceToA(e){ if(!/^[01]\d{7}$/.test(e)) return null; const n=e[0], d=e.slice(1,7), x=d[5]; let m;
  if(x<="2") m=d.slice(0,2)+x+"0000"+d.slice(2,5); else if(x==="3") m=d.slice(0,3)+"00000"+d.slice(3,5);
  else if(x==="4") m=d.slice(0,4)+"00000"+d[4]; else m=d.slice(0,5)+"0000"+x;
  const a=n+m+e[7]; return gtinValid(a)?a:null; }
// keys a code is matched by: the text itself, and any valid GTIN as GTIN-14 (so EAN-13 0750… = UPC-A 750… = GTIN-14 00750…)
function bcKeys(code){ const s=String(code==null?"":code).trim(); if(!s) return []; const out=new Set([s.toUpperCase()]);
  if(/^\d+$/.test(s)){ if(gtinValid(s)) out.add(s.padStart(14,"0")); if(s.length===8){ const a=upceToA(s); if(a) out.add(a.padStart(14,"0")); } }
  return [...out]; }
function bcFind(code,exceptId){ const ks=bcKeys(code); if(!ks.length) return null;
  return D.inventory.find(i=>i.id!==exceptId&&bcKeys(i.barcode).some(k=>ks.includes(k)))||null; }
// a code typed or scanned for an item: "" when it is fine, otherwise the problem
function bcCheck(code,exceptId){ const s=String(code||"").trim(); if(!s) return "";
  if(s.length>48||!/^[\x20-\x7E]+$/.test(s)) return tt("Use up to 48 letters, digits or symbols.","Usa hasta 48 letras, dígitos o símbolos.");
  if(/^\d+$/.test(s)&&[8,12,13,14].includes(s.length)&&!gtinValid(s)) return tt(`Wrong check digit: a ${s.length}-digit GS1 code ending in ${gtinCheck(s.slice(0,-1))} was expected (${s.slice(0,-1)}${gtinCheck(s.slice(0,-1))}).`,`Dígito de control incorrecto: se esperaba un código GS1 de ${s.length} dígitos terminado en ${gtinCheck(s.slice(0,-1))} (${s.slice(0,-1)}${gtinCheck(s.slice(0,-1))}).`);
  const o=bcFind(s,exceptId); if(o) return tt(`Already used by “${o.name}”.`,`Ya lo usa “${o.name}”.`);
  return ""; }
// next free internal code: 0400 + sequence (8 digits) + check digit
function bcNewInternal(){ let n=1; D.inventory.forEach(i=>{ const b=String(i.barcode||""); if(/^0400\d{9}$/.test(b)) n=Math.max(n,+b.slice(4,12)+1); });
  for(;;n++){ const d="0400"+String(n).padStart(8,"0"), c=d+gtinCheck(d); if(!bcFind(c)) return c; } }
const bcKind=code=>{ const s=String(code||"").trim(); if(!gtinValid(s)) return tt("own code","código propio");
  return s.length<=13&&s.padStart(13,"0").startsWith("04")?tt("internal · GS1 RCN","interno · GS1 RCN"):"GTIN-"+s.length; };

/* ---- GS1 element strings ---- */
// [AI, data length] for the AI that starts at s[i] (length 0 = variable, ends at the GS separator or at the end)
function aiInfo(s,i){ const two=s.substr(i,2);
  if(/^(00|01|02|03|04|20)$/.test(two)) return [two,{"00":18,"01":14,"02":14,"03":14,"04":16,"20":2}[two]];
  if(/^1[1-9]$/.test(two)) return [two,6];
  if(/^(10|21|22|30|37|90|9[1-9])$/.test(two)) return [two,0];
  if(/^3[1-6]$/.test(two)) return [s.substr(i,4),6];
  if(two==="41") return [s.substr(i,3),13];
  if(/^(23|24|25|40|42)$/.test(two)){ const a=s.substr(i,3); return [a,{"402":17,"422":3,"424":3,"426":3}[a]||0]; }
  if(/^(70|71|72|80|81|82)$/.test(two)){ const a=s.substr(i,4); return [a,{"7001":13,"7003":10,"8001":14,"8005":6,"8006":18,"8017":18,"8018":18,"8026":18}[a]||0]; }
  return null; }
function gs1Raw(s){ const GS="\x1d", out={}; let i=0;
  while(i<s.length){ if(s[i]===GS){ i++; continue; } const inf=aiInfo(s,i); if(!inf) return Object.keys(out).length?out:null;
    const [ai,len]=inf; i+=ai.length; let v;
    if(len){ v=s.substr(i,len); if(v.length<len) return Object.keys(out).length?out:null; i+=len; }
    else { let j=s.indexOf(GS,i); if(j<0) j=s.length; v=s.slice(i,j); i=j; }
    out[ai]=v; }
  return out; }
function gs1HRI(s){ const out={}, re=/\((\d{2,4})\)([^(]*)/g; let m, any=false; while((m=re.exec(s))){ out[m[1]]=m[2].trim(); any=true; } return any?out:null; }
function gs1DL(s){ let u; try{ u=new URL(s); }catch(e){ return null; }
  const p=u.pathname.split("/").filter(Boolean), k=p.findIndex((x,i)=>/^(01|gtin)$/.test(x)&&/^\d{8,14}$/.test(p[i+1]||"")); if(k<0) return null;
  const out={}; for(let i=k;i+1<p.length;i+=2) out[p[i]==="gtin"?"01":p[i]]=decodeURIComponent(p[i+1]);
  u.searchParams.forEach((v,key)=>{ if(/^\d{2,4}$/.test(key)) out[key]=v; }); out["01"]=out["01"].padStart(14,"0"); return out; }
// GS1 dates are YYMMDD; day 00 = the last day of the month
function gs1Date(d){ const y=2000+(+d.slice(0,2)), m=+d.slice(2,4); let dd=+d.slice(4,6); const last=new Date(y,m,0).getDate(); if(m<1||m>12||dd>last) return "";
  if(!dd) dd=last; return `${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`; }
// what a scan contains → {raw, code, gtin?, lot?, expiry?, kg?, L?, count?, ai?}
function bcParse(raw){
  const s=String(raw==null?"":raw).replace(/<GS>/g,"\x1d").replace(/[\r\n\t]+/g,"").trim(), r={raw:s,code:s,ai:null}; if(!s) return r;
  let ai=null;
  if(/^https?:\/\//i.test(s)) ai=gs1DL(s);
  else if(/^\(\d{2,4}\)/.test(s)) ai=gs1HRI(s);
  else { let t=s, gs1=false; const m=t.match(/^\](C1|e0|d2|Q3|J1)/);
    if(m){ gs1=true; t=t.slice(3); } else if(/^\][A-Za-z][0-9A-Za-z]/.test(t)) t=t.slice(3);   // AIM symbology identifier sent by some scanners
    if(t[0]==="\x1d"){ gs1=true; t=t.slice(1); }
    if(gs1||t.includes("\x1d")||(/^(01|02)\d{14}/.test(t)&&t.length>16&&gtinValid(t.substr(2,14)))) ai=gs1Raw(t);
    r.code=t.replace(/\x1d/g,""); }
  if(ai&&Object.keys(ai).length){ r.ai=ai; const g=ai["01"]||ai["02"]; if(g&&gtinValid(g)) r.gtin=g; if(r.gtin) r.code=r.gtin;
    if(ai["10"]) r.lot=ai["10"].slice(0,40);
    const dt=ai["17"]||ai["15"]||ai["16"]; if(dt&&/^\d{6}$/.test(dt)) r.expiry=gs1Date(dt);
    for(const [k,v] of Object.entries(ai)){ const mm=k.match(/^3(10|15|20)(\d)$/); if(!mm||!/^\d{6}$/.test(v)) continue;
      const x=+v/Math.pow(10,+mm[2]); if(mm[1]==="10") r.kg=x; else if(mm[1]==="15") r.L=x; else if(r.kg==null) r.kg=Math.round(x*0.45359237*1000)/1000; }
    const c=ai["30"]||ai["37"]; if(c&&/^\d{1,8}$/.test(c)) r.count=+c; }
  return r; }

/* ---- the ZXing library (camera without BarcodeDetector, photos, and drawing the labels) ---- */
let zxP=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.async=true; s.onload=res; s.onerror=()=>{ s.remove(); rej(new Error(src)); }; document.head.appendChild(s); }); }
function zxLoad(){ if(zxP) return zxP;
  const CDN=`https://cdn.jsdelivr.net/npm/zxing-wasm@${ZXV}/dist/`, web=/^https?:$/.test(location.protocol);
  zxP=(async()=>{
    if(!window.ZXingWASM){ if(web) try{ await loadScript("vendor/zxing-wasm/index.js"); }catch(e){} if(!window.ZXingWASM) await loadScript(CDN+"iife/full/index.js"); }
    const Z=window.ZXingWASM; if(!Z||!Z.prepareZXingModule) throw new Error("zxing");
    for(const dir of (web?["vendor/zxing-wasm/",CDN+"full/"]:[CDN+"full/"])){
      try{ await Z.prepareZXingModule({overrides:{locateFile:(p,pre)=>p.endsWith(".wasm")?dir+p:pre+p},fireImmediately:true}); return Z; }catch(e){} }
    throw new Error("wasm"); })();
  zxP.catch(()=>{ zxP=null; }); return zxP; }
const zxFail=()=>tt("The barcode library couldn't load — check the internet connection and try again.","No se pudo cargar la librería de códigos de barras — revisa la conexión a internet e inténtalo de nuevo.");

/* ---- scanner: mode, messages, sound ---- */
let bcMode=(()=>{ const m=lsGet("top-bcmode"); return ["purchase","waste","find"].includes(m)?m:"purchase"; })();
let bcLast=null;   // last scan result shown in the box
function bcSay(kind,html){ const el=document.getElementById("bcMsg"); if(!el) return; el.className="hint bcmsg "+(kind==="ok"?"oknote":kind==="warn"?"warnnote":""); el.innerHTML=html; }
function bcBeep(ok){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=bcBeep.c||(bcBeep.c=new A()), o=c.createOscillator(), g=c.createGain();
    o.frequency.value=ok?1760:330; g.gain.value=0.08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+(ok?0.09:0.25)); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(ok?40:[60,40,60]); }catch(e){} }
const setv=(id,v)=>{ const el=document.getElementById(id); if(el){ el.value=v; el.setAttribute("aria-invalid","false"); } };
const bcFmtQ=(x,u)=>`${fmtQ(x)} ${unitLbl(u)}`;
// quantity a scan carries, in the item's own unit (net weight / volume in the code), or null
function bcQtyFor(it,r){ const u=it.unit;
  if(r.kg!=null&&baseOf(u)==="kg") return u==="g"?r.kg*1000:r.kg;
  if(r.L!=null&&baseOf(u)==="L") return u==="L"||u==="l"?r.L:r.L*1000;

function bcDetails(r){ const d=[]; if(r.gtin) d.push("GTIN "+esc(r.gtin)); if(r.lot) d.push(tt("lot","lote")+" "+esc(r.lot)); if(r.expiry) d.push(tt("expiry","caducidad")+" "+esc(r.expiry));
  if(r.kg!=null) d.push(fmtQ(r.kg)+" kg"); if(r.L!=null) d.push(fmtQ(r.L)+" L"); if(r.count!=null) d.push(r.count+" "+tt("pcs","und")); return d.join(" · "); }

    else bcSay("ok",`✅ ${head}<br>🛒 ${tt("Purchase","Compra")}: ${tt(`type the quantity received (${unitLbl(it.unit)}), the price and the supplier, then press “Add stock”.`,`escribe la cantidad recibida (${unitLbl(it.unit)}), el precio y el proveedor, y pulsa “Agregar stock”.`)}`);

  // find

    <span class="bcacts"><button type="button" class="btn sm ghost" data-bcgo="kx" data-id="${it.id}">📒 Kardex</button> <button type="button" class="btn sm ghost" data-bcgo="buy" data-id="${it.id}">🛒 ${tt("Add stock","Agregar stock")}</button> <button type="button" class="btn sm ghost" data-bcgo="lbl" data-id="${it.id}">🏷 ${tt("Label","Etiqueta")}</button></span>`);

// after a scan from a scanner or the scan box, the cursor goes back to the scan box so the next scan lands there
function bcKeep(src){ if(src!=="typed"&&src!=="wedge") return false; const i=document.getElementById("bcIn"); if(i){ i.focus({preventScroll:true}); i.select(); } return true; }
function bcUnknown(r,det){
  const can=canWrite("inventory"), noCode=D.inventory.filter(i=>!String(i.barcode||"").trim()).sort((a,b)=>a.name.localeCompare(b.name));
  const linkable=can&&!bcCheck(r.code);
  bcSay("warn",`⚠ ${tt("Unknown code","Código desconocido")} <span class="mono">${esc(r.code)}</span>${r.gtin||gtinValid(r.code)?` (GS1 GTIN)`:""}${det?`<br><small>${det}</small>`:""}
    ${linkable?`<div class="bclink"><label for="bcLinkSel">${tt("Link it to an item","Vincúlalo a un artículo")}</label> <select id="bcLinkSel">${noCode.length?noCode.map(i=>`<option value="${i.id}">${esc(i.name)} (${esc(unitLbl(i.unit))})</option>`).join(""):`<option value="">${tt("All items already have a code","Todos los artículos ya tienen código")}</option>`}</select>
      <button type="button" class="btn sm" data-bcgo="link"${noCode.length?"":" disabled"}>🔗 ${tt("Link","Vincular")}</button>
      <button type="button" class="btn sm ghost" data-bcgo="new">＋ ${tt("New item with this code","Artículo nuevo con este código")}</button></div>`
      :!can?`<br><small>${tt("Ask a user who can change the inventory to link this code.","Pide a un usuario que pueda cambiar el inventario que vincule este código.")}</small>`:`<br><small>${esc(bcCheck(r.code))}</small>`}`); }
async function bcLink(id){ const it=invItem(id), r=bcLast; if(!it||!r) return; if(!DB) return noDb();

  await dbUpd("inventory",id,{barcode:r.code,updated:new Date().toISOString()});

/* ---- camera and photo ---- */
let bcCam=null;   // {stream, video, timer}
async function bcDetector(){
  if("BarcodeDetector" in window){ try{ const f=await window.BarcodeDetector.getSupportedFormats(); if(f&&f.length){ const d=new window.BarcodeDetector({formats:f});
    return async src=>(await d.detect(src)).map(x=>x.rawValue).filter(Boolean); } }catch(e){} }
  const Z=await zxLoad(), cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
  return async src=>{ let input=src;
    if(!(src instanceof Blob)){ const w=src.videoWidth||src.width, h=src.videoHeight||src.height; if(!w||!h) return []; const k=Math.min(1,1280/Math.max(w,h));
      cv.width=Math.round(w*k); cv.height=Math.round(h*k); cx.drawImage(src,0,0,cv.width,cv.height); input=cx.getImageData(0,0,cv.width,cv.height); }
    const res=await Z.readBarcodes(input,{tryHarder:true,maxNumberOfSymbols:1}); return res.filter(x=>x.isValid!==false&&x.text).map(x=>x.text); }; }
function bcCamStop(){ const c=bcCam; bcCam=null; if(!c) return; clearTimeout(c.timer); try{ c.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  const box=document.getElementById("bcCamBox"); if(box) box.hidden=true; const b=document.getElementById("bcCamBtn"); if(b) b.textContent="📷 "+tt("Camera","Cámara"); }
async function bcCamStart(){
  if(bcCam) return bcCamStop();
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return bcSay("warn","⚠ "+tt("This browser can't open the camera here (it needs https). Use “Photo” or a USB / Bluetooth scanner.","Este navegador no puede abrir la cámara aquí (necesita https). Usa “Foto” o un lector USB / Bluetooth."));
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e){ return bcSay("warn","⚠ "+tt("The camera is blocked or not available. Allow the camera for this page in the browser settings, or use “Photo”.","La cámara está bloqueada o no está disponible. Permite la cámara para esta página en los ajustes del navegador, o usa “Foto”.")); }
  const box=document.getElementById("bcCamBox"), v=box&&box.querySelector("video"); if(!v){ stream.getTracks().forEach(t=>t.stop()); return; }
  box.hidden=false; v.setAttribute("playsinline",""); v.muted=true; v.srcObject=stream; try{ await v.play(); }catch(e){}
  bcCam={stream,video:v,timer:null}; document.getElementById("bcCamBtn").textContent="⏹ "+tt("Stop camera","Detener cámara");
  bcSay("","📷 "+tt("Point the camera at the barcode or QR / Data Matrix code…","Apunta la cámara al código de barras o al código QR / Data Matrix…"));
  let detect; try{ detect=await bcDetector(); }catch(e){ bcCamStop(); return bcSay("warn","⚠ "+zxFail()); }
  const me=bcCam; if(!me) return;
  const tick=async()=>{ if(bcCam!==me) return; if(!me.video.isConnected){ bcCamStop(); return; }
    try{ if(me.video.readyState>=2){ const res=await detect(me.video); if(bcCam!==me) return; if(res.length){ bcCamStop(); bcHandle(res[0],"camera"); return; } } }catch(e){}
    me.timer=setTimeout(tick,220); };
  tick(); }
async function bcPhoto(file){ if(!file) return; bcSay("","⏳ "+tt("Reading the photo…","Leyendo la foto…"));
  try{ let res=[];
    if("BarcodeDetector" in window){ try{ const d=await bcDetector(), bmp=await createImageBitmap(file); res=await d(bmp); }catch(e){ res=[]; } }
    if(!res.length){ const Z=await zxLoad(); res=(await Z.readBarcodes(file,{tryHarder:true,maxNumberOfSymbols:1})).filter(x=>x.text).map(x=>x.text); }
    if(res.length) bcHandle(res[0],"photo"); else { bcBeep(false); bcSay("warn","⚠ "+tt("No code found in the photo. Take it closer, sharp and well lit.","No se encontró ningún código en la foto. Tómala más cerca, nítida y con buena luz.")); } }
  catch(e){ bcSay("warn","⚠ "+zxFail()); } }

/* ---- USB / Bluetooth scanners: they "type" the code very fast and press Enter.
   Anywhere in “2 · Kitchen & inventory” a fast burst of keys ending in Enter is taken as a scan — even if the cursor was left in
   another box (e.g. the price): the burst is taken out of that box and the form is not sent. People typing are much slower. ---- */
const bcWedge={buf:"",t:0,t0:0,el:null,before:null};
document.addEventListener("keydown",e=>{
  if(!(state.tab==="ai"&&state.aiView==="m2")||!document.getElementById("bcIn")) return;
  const a=document.activeElement; if(a&&a.id==="bcIn") return;   // the scan box has its own Enter
  const inField=!!a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable), now=performance.now();
  if(now-bcWedge.t>50||bcWedge.el!==a){ bcWedge.buf=""; bcWedge.t0=now; bcWedge.el=a; bcWedge.before=inField&&a.tagName!=="SELECT"&&"value" in a?a.value:null; }
  bcWedge.t=now;
  if(e.key==="Enter"){ const n=bcWedge.buf.length, fast=n>=(inField?6:4)&&(now-bcWedge.t0)/n<(inField?35:50);
    if(fast){ e.preventDefault(); e.stopPropagation(); const s=bcWedge.buf; if(bcWedge.before!=null){ a.value=bcWedge.before; a.setAttribute("aria-invalid","false"); } bcHandle(s,"wedge"); }
    bcWedge.buf=""; return; }
  if(e.ctrlKey&&(e.key==="]"||e.code==="BracketRight")){ bcWedge.buf+="\x1d"; e.preventDefault(); return; }   // GS1 separator (GS = Ctrl+])
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ bcWedge.buf+=e.key; if(!inField&&e.key===" ") e.preventDefault(); }
},true);

function wireBarcode(){
  const inp=document.getElementById("bcIn"); if(!inp) return;
  document.getElementById("bcMode").onchange=e=>{ bcMode=e.target.value; lsSet("top-bcmode",bcMode); bcSay("",""); inp.focus(); };
  inp.addEventListener("keydown",e=>{
    if(e.ctrlKey&&(e.key==="]"||e.code==="BracketRight")){ e.preventDefault(); const p=inp.selectionStart; inp.setRangeText("<GS>",p,inp.selectionEnd,"end"); return; }
    if(e.key==="Enter"){ e.preventDefault(); const v=inp.value; if(v.trim()) bcHandle(v,"typed"); inp.select(); } });
  document.getElementById("bcCamBtn").onclick=bcCamStart;
  document.getElementById("bcPhotoBtn").onclick=()=>document.getElementById("bcPhoto").click();
  document.getElementById("bcPhoto").onchange=e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; bcPhoto(f); };
  document.getElementById("bcMsg").addEventListener("click",async e=>{ const b=e.target.closest("[data-bcgo]"); if(!b) return; const go=b.dataset.bcgo, id=b.dataset.id;
    if(go==="link"){ const s=document.getElementById("bcLinkSel"); if(s&&s.value) await bcLink(s.value); return; }
    if(go==="new"){ setv("iCode",bcLast?bcLast.code:""); const f=document.getElementById("iName"); f.scrollIntoView({behavior:"smooth",block:"center"}); f.focus({preventScroll:true}); bcSay("",tt("Fill in the new item and press “Add item”; the code is already in “Barcode”.","Completa el artículo nuevo y pulsa “Agregar item”; el código ya está en “Código de barras”.")); return; }
    if(go==="kx"){ kxItem=id; state.aiView="m3"; m3Sub="kardex"; save(); render(); window.scrollTo({top:0}); return; }
    if(go==="buy"){ bcMode="purchase"; document.getElementById("bcMode").value="purchase"; lsSet("top-bcmode",bcMode); if(bcLast) bcHandle(bcLast.raw,"relink"); return; }
    if(go==="lbl"){ setv("lbItem",id); setv("lbWhich","one"); lbForm(); const p=document.getElementById("lbForm"); p.scrollIntoView({behavior:"smooth",block:"center"}); lbPreview(); } });
}

const svgClean=svg=>{ const m=svg.match(/<svg[^>]*width="([\d.]+)"[^>]*height="([\d.]+)"[^>]*>/); if(!m) return svg.replace(/<\?xml[^>]*>|<!DOCTYPE[^>]*>/g,"");

// one symbol for an item → {svg, text, two} or {err}
async function lbSymbol(it,type,lot,exp){
  const code=String(it.barcode||"").trim(); if(!code) return {err:tt(`“${it.name}” has no code yet — press “Generate” in ✏ Edit or link one by scanning.`,`“${it.name}” aún no tiene código — pulsa “Generar” en ✏ Editar o vincula uno escaneando.`)};
  const gt=gtinValid(code)?code:null, yymmdd=exp?exp.slice(2,4)+exp.slice(5,7)+exp.slice(8,10):"";
  let text, opt;
  if(type==="ean"){ if(!gt||code.length===14) return {err:tt(`“${it.name}”: EAN / UPC needs a GTIN of 8, 12 or 13 digits (this code is ${esc(code)}). Use Code 128 or GS1-128.`,`“${it.name}”: EAN / UPC necesita un GTIN de 8, 12 o 13 dígitos (este código es ${esc(code)}). Usa Code 128 o GS1-128.`)};
    text=code; opt={format:code.length===13?"EAN13":code.length===12?"UPCA":"EAN8",withHRT:true}; }
  else if(type==="gs1128"||type==="gs1dm"){ if(!gt) return {err:tt(`“${it.name}”: GS1 symbols need a GTIN (8–14 digits with a valid check digit). Generate an internal code or use Code 128.`,`“${it.name}”: los símbolos GS1 necesitan un GTIN (8–14 dígitos con dígito de control válido). Genera un código interno o usa Code 128.`)};
    text="(01)"+gt.padStart(14,"0")+(yymmdd?"(17)"+yymmdd:"")+(lot?"(10)"+lot:""); opt=type==="gs1dm"?{format:"DataMatrix",options:"gs1",forceSquareDataMatrix:true}:{format:"Code128",options:"gs1",withHRT:true}; }
  else if(type==="qr"){ text=gt?`https://id.gs1.org/01/${gt.padStart(14,"0")}${lot?"/10/"+encodeURIComponent(lot):""}${yymmdd?"?17="+yymmdd:""}`:code; opt={format:"QRCode",ecLevel:"M"}; }
  else { text=code; opt={format:"Code128",withHRT:true}; }
  const Z=await zxLoad(); const w=await Z.writeBarcode(text,{scale:0,...opt});
  if(w.error||!w.svg) return {err:esc(it.name)+": "+esc(w.error||"?")};
  return {svg:svgClean(w.svg),text,two:["gs1dm","qr"].includes(type)}; }
async function lbBuild(){
  const type=val("lbType"), all=val("lbWhich")==="all", two=["gs1128","gs1dm","qr"].includes(type);
  const lot=two?val("lbLot"):"", exp=two?val("lbExp"):"", copies=Math.min(300,Math.max(1,Math.round(num(val("lbCopies"))||1)));
  if(lot&&!LOT_RE.test(lot)){ document.getElementById("lbLot").setAttribute("aria-invalid","true"); return {err:tt("Lot: up to 20 letters, digits or - . / _ (no spaces).","Lote: hasta 20 letras, dígitos o - . / _ (sin espacios).")}; }
  const items=all?D.inventory.filter(i=>String(i.barcode||"").trim()).sort((a,b)=>a.name.localeCompare(b.name)):[invItem(val("lbItem"))].filter(Boolean);
  if(!items.length) return {err:all?tt("No item has a code yet.","Ningún artículo tiene código todavía."):tt("Choose an item.","Elige un artículo.")};
  const labels=[], errs=[];
  for(const it of items){ let s; try{ s=await lbSymbol(it,type,lot,exp); }catch(e){ return {err:zxFail()}; }
    if(s.err){ errs.push(s.err); continue; }
    const sub=[two&&lot?tt("Lot","Lote")+" "+esc(lot):"",two&&exp?tt("Exp.","Cad.")+" "+esc(exp):""].filter(Boolean).join(" · ");
    const html=`<div class="lb${s.two?" lb2":""}">${val("lbName")!=="none"?`<div class="lbn">${esc(it.name)}</div>`:""}<div class="lbs">${s.svg}</div>${s.two?`<div class="lbc">${esc(it.barcode)}</div>`:""}${sub?`<div class="lbx">${sub}</div>`:""}</div>`;
    for(let c=0;c<copies;c++) labels.push(html); }
  return {labels,errs}; }

async function lbPreview(){ const msg=document.getElementById("lbMsg"), box=document.getElementById("lbPrev"); if(!box) return null;
  msg.className="hint"; msg.textContent="⏳ "+tt("Drawing the labels…","Dibujando las etiquetas…");

const OPEX_FREQ=[["week","per week","por semana",52/12],["month","per month","por mes",1],["year","per year","por año",1/12]];
const OPEX_BASE=[["staff","Staff (wages)","Personal (sueldos)","month"],["rent","Rent","Alquiler del local","month"],["electricity","Electricity","Electricidad","month"],
  ["taxes","Taxes (property, business, other)","Impuestos (predial, negocio, otros)","year"],["insurance","Insurance","Seguros","year"],["licences","Annual licences","Licencias anuales","year"],
  ["permits","Annual permits (e.g. AHS food handling)","Permisos anuales (p. ej. manipulación de alimentos AHS)","year"],["maintenance","Equipment maintenance","Mantenimiento de equipos","year"],["other","Other operating expenses","Otros gastos operativos","month"]];
const opexFactor=f=>(OPEX_FREQ.find(x=>x[0]===f)||OPEX_FREQ[1])[3];
function opexRows(){
  const o=D.opex||{}, rows=OPEX_BASE.map(b=>({key:b[0],name:tt(b[1],b[2]),amt:num(o["amt_"+b[0]]),freq:o["freq_"+b[0]]||b[3],base:true}));
  const st=o.staff||{};
  const staffCalc=num(st.n)>0&&num(st.hours)>0&&num(st.wage)>0;
  if(staffCalc){ rows[0].amt=num(st.n)*num(st.hours)*num(st.wage)*52/12*(1+num(st.extra)/100); rows[0].freq="month"; rows[0].calc=true; }
  (Array.isArray(o.extra)?o.extra:[]).forEach(x=>rows.push({key:x.id,name:x.name,amt:num(x.amt),freq:x.freq||"month",base:false}));
  return rows.map(r=>({...r,monthly:r.amt*opexFactor(r.freq)}));
}

}

// "Cost per cup": every menu item with a saved recipe, costed with the Kardex weighted average; manual cost only when there is no recipe cost
function costBoxHTML(){
  const target=num(D.costs&&D.costs._target)||60;
  const items=D.menu.filter(m=>m.active!==false).map(m=>{ const r=recipeOf(m.id); return {m,r:r&&r.locked?r:null}; });
  let saleSum=0, saleN=0;
  const rows=items.filter(x=>x.r).map(x=>{ const pc=portionCost(x.r), price=num(x.m.price), mg=price>0&&pc.known?(price-pc.cost)/price*100:null;
    // portions the current stock allows × the price = what the item would bring in if all of them were sold
    const pp=portionsPossible(x.r), port=pp.linked?pp.best:null, sale=port!=null&&price>0?cost2(port*price):null;

function prodStats(n){
  const days=salesDays(n), st={};
  // listed: what is on the active menu (app products through their menu entry) + anything that sold in the period;
  // built-in products that are not on the menu and did not sell (old data) are left out
  (D.menu||[]).filter(m=>m.active!==false).forEach(m=>{ const k=m.prodId&&P.some(p=>p.id===m.prodId)?m.prodId:"m_"+m.id; st[k]={cups:0,rev:0}; });
  if(!(D.menu||[]).length) P.forEach(p=>st[p.id]={cups:0,rev:0});
  days.forEach(d=>Object.entries(d.items).forEach(([pid,it])=>{ if(!st[pid]) st[pid]={cups:0,rev:0}; st[pid].cups+=num(it.cups); st[pid].rev+=num(it.revenue); }));
  return Object.entries(st).map(([pid,s])=>{const pcx=prodCost(pid), c=pcx.c, partial=!!pcx.partial;const cost=s.cups*c;const m=s.rev-cost;return {pid,...s,unitCost:c,cost,margin:m,pct:s.rev?m/s.rev*100:0,hasCost:c>0,partial};});
}

function barChart(pts,W0){
  const W=Math.max(300,Math.min(900,W0||640)),H=200,pl=48,pb=24,pt=10,max=Math.max(...pts.map(p=>p.y),1),n=pts.length,bw=(W-pl)/n;
  const nice=m=>{const e=Math.pow(10,Math.floor(Math.log10(m)));return Math.ceil(m/e)*e;}; const top=nice(max);
  const y=v=>H-pb-(v/top)*(H-pb-pt);
  const ticks=[0,top/2,top];
  return `<svg viewBox="0 0 ${W} ${H}" class="bars" role="img" aria-label="${tt("Daily revenue","Ingresos diarios")}">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" class="ax">$${Math.round(t)}</text>`).join("")}
   ${pts.map((p,i)=>{const x=pl+i*bw+2,w=Math.max(2,bw-4),h=H-pb-y(p.y);return `<g class="bar"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pb-pt}" fill="transparent"><title>${p.x}: ${money(p.y)}</title></rect>${p.y>0?`<path d="M${x},${H-pb} v${-(h-Math.min(4,h))} q0,-${Math.min(4,h)} ${Math.min(4,w/2)},-${Math.min(4,h)} h${w-2*Math.min(4,w/2)} q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,h)} v${h-Math.min(4,h)} z" class="mark"><title>${p.x}: ${money(p.y)}</title></path>`:""}<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" class="ax"${n>16?' style="font-size:9px"':""}>${p.x.slice(8)}</text></g>`;}).join("")}
  </svg>`;
}

   <div class="acts"><button class="btn sm ghost" data-p="copy" data-id="${p.id}">${tt("Copy","Copiar")}</button><button class="btn sm" data-p="pub" data-id="${p.id}">${tt("Mark published","Marcar publicada")}</button><button class="btn sm ghost" data-p="del" data-id="${p.id}" aria-label="${tt("Delete","Borrar")}">✕</button></div></li>`).join("")}</ul>`

   :`<p class="empty">${tt("Published posts appear here so you can enter their results.","Las publicaciones marcadas como publicadas aparecen aquí para ingresar sus resultados.")}</p>`;

async function engAI(){
  const out=document.getElementById("engOut"); const pub=D.posts.filter(p=>p.status==="published"&&num(p.reach));
  if(pub.length<2){out.textContent=tt("Enter results for at least 2 published posts.","Ingresa resultados de al menos 2 publicaciones.");return;}
  const data=pub.map(p=>`${p.when} ${p.channel} reach=${num(p.reach)} likes=${num(p.likes)} comments=${num(p.comments)} saves=${num(p.saves)} rate=${engRate(p).toFixed(1)}% text="${p.text.slice(0,200).replace(/\s+/g," ")}"`).join("\n");
  out.textContent=tt("Thinking…","Pensando…");
  try{ await SAMPLE(`Analyze the real social-media results below for a small Peruvian drinks counter. In 4-5 short bullets: what worked, what didn't, best channel and time if visible, and what to post next. Use only these numbers. ${LANGLINE()}\n${data}`,{cache:false,onText:({text})=>{out.textContent=text;}}); }
  catch(e){ out.textContent=e.text||aiErr(e); }
}

     <div class="panel"><h3>${tt("Weekly report","Reporte semanal")}</h3><p class="hint">${tt("Combines the last 7 days of reviews, sales, stock alerts and waste.","Combina los últimos 7 días de reseñas, ventas, alertas de stock y merma.")}</p><button class="btn" id="repAI" data-needs-ai>${tt("Generate report","Generar reporte")}</button><div id="repOut" class="aiout"></div></div>

function wireM5(){
  document.getElementById("rvForm").onsubmit=async e=>{e.preventDefault(); if(!val("rvText")) return;
    await dbAdd("reviews",{source:val("rvSrc"),stars:num(val("rvStars")),date:val("rvDate")||today(),name:val("rvName"),text:val("rvText"),reply:"",replied:false});
    document.getElementById("rvText").value=""; document.getElementById("rvName").value="";};
  document.getElementById("rvList").onclick=async e=>{const b=e.target.closest("[data-r]"); if(!b) return; const id=b.dataset.id, r=D.reviews.find(x=>x.id===id); if(!r) return;
    if(b.dataset.r==="draft") draftReply(r);
    if(b.dataset.r==="save") await dbUpd("reviews",id,{reply:document.getElementById("rp"+id).value,replied:true});
    if(b.dataset.r==="copy") copyText(document.getElementById("rp"+id).value);
    if(b.dataset.r==="del") await dbDel("reviews",id);};
  document.getElementById("patAI").onclick=patternsAI;
  const rl=document.getElementById("rvList"); rl.addEventListener("focusout",()=>setTimeout(()=>{if(!rl.contains(document.activeElement))refreshAI();},50));
  document.getElementById("repAI").onclick=reportAI;
}
function listM5(){
  const el=document.getElementById("rvList"); if(!el) return;
  const rv=[...D.reviews].sort((a,b)=>b.date.localeCompare(a.date));
  const avg=rv.length?rv.reduce((s,r)=>s+num(r.stars),0)/rv.length:0, wk=rv.filter(r=>r.date>=addDays(today(),-6));
  document.getElementById("rKpis").innerHTML=[[rv.length?avg.toFixed(1)+" ★":"—",tt("average rating","calificación promedio")],[rv.length,tt("reviews","reseñas")],[wk.length,tt("this week","esta semana")],[rv.filter(r=>!r.replied).length,tt("waiting for reply","sin respuesta"),rv.some(r=>!r.replied)?"warn":""],[rv.filter(r=>RISK.test(r.text)).length,tt("need a manual check","requieren revisión manual"),rv.some(r=>RISK.test(r.text))?"bad":""]]
    .map(k=>`<div class="kpi ${k[2]||""}"><div class="big">${k[0]}</div><div class="lbl">${k[1]}</div></div>`).join("");
  if(el.contains(document.activeElement)&&document.activeElement.tagName==="TEXTAREA") return;
  el.innerHTML=rv.length?rv.map(r=>`<div class="review"><div class="rvh"><b>${"★".repeat(num(r.stars))}<span class="dim">${"★".repeat(5-num(r.stars))}</span></b> ${esc(r.source)} · ${esc(r.date)}${r.name?" · "+esc(r.name):""}
     ${RISK.test(r.text)?`<span class="badge bad">${tt("Health/safety — reply by hand","Salud/inocuidad — responde a mano")}</span>`:""}${r.replied?`<span class="badge ok">${tt("Replied","Respondida")}</span>`:""}</div>
     <p>${esc(r.text)}</p>
     <label class="sr" for="rp${r.id}">${tt("Reply","Respuesta")}</label><textarea id="rp${r.id}" rows="3" placeholder="${tt("Reply…","Respuesta…")}">${esc(r.reply)}</textarea>
     <div class="acts"><button class="btn sm" data-r="draft" data-id="${r.id}" data-needs-ai ${capsReady&&!SAMPLE?"disabled":""}>${tt("Draft with AI","Redactar con IA")}</button><button class="btn sm ghost" data-r="save" data-id="${r.id}">${tt("Save reply","Guardar")}</button><button class="btn sm ghost" data-r="copy" data-id="${r.id}">${tt("Copy","Copiar")}</button><button class="btn sm ghost" data-r="del" data-id="${r.id}" aria-label="${tt("Delete","Borrar")}">✕</button></div></div>`).join("")
    :`<p class="empty">${tt("No reviews yet.","Aún no hay reseñas.")}</p>`;
}
async function draftReply(r){
  const box=document.getElementById("rp"+r.id); if(!SAMPLE||!box) return;
  const risky=RISK.test(r.text);
  box.value=tt("Thinking…","Pensando…");
  try{ await SAMPLE(`Write a short public reply from the owner of "Taste of Peru" (a Peruvian drinks counter in Edmonton) to this ${num(r.stars)}-star ${r.source} review. Reply in the review's language. Be warm and specific, thank them, and address any complaint without excuses. ${risky?"The review mentions a possible health or safety problem: do not admit fault or discuss medical details publicly; apologize for the experience, say you take it seriously, and invite them to contact the business privately.":""} ${CLAIM_RULES()} Do not invent facts, offers or names. Reply with the text only.
REVIEW: ${r.text}`,{cache:false,modelTier:"quick",onText:({text})=>{box.value=text;}}); }
  catch(e){ box.value=e.text||r.reply||""; toast(aiErr(e)); }
}
async function patternsAI(){
  const out=document.getElementById("patOut"); const rv=D.reviews.filter(r=>r.date>=addDays(today(),-60));
  if(rv.length<3){out.textContent=tt("Add at least 3 reviews from the last 60 days.","Agrega al menos 3 reseñas de los últimos 60 días.");return;}
  out.textContent=tt("Thinking…","Pensando…");
  try{ const j=await SAMPLE.json(`Find recurring themes in these customer reviews of a Peruvian drinks counter. Count only reviews that clearly mention each theme. ${LANGLINE()}
Reply with only JSON: [{"theme":"short name","type":"complaint"|"praise","count":0,"example":"short quote","action":"one concrete fix or next step"}]
REVIEWS:
${rv.map((r,i)=>`${i+1}. (${r.stars}★ ${r.date}) ${r.text.slice(0,500)}`).join("\n")}`,{cache:false});
    if(!Array.isArray(j)) throw {code:"invalid_json"};
    const sorted=[...j].sort((a,b)=>(a.type===b.type?num(b.count)-num(a.count):a.type==="complaint"?-1:1));
    out.innerHTML=`<ul class="rows">${sorted.map(t=>`<li><div><span class="badge ${t.type==="complaint"?"bad":"ok"}">${t.type==="complaint"?tt("Complaint","Queja"):tt("Praise","Elogio")}</span> <b>${esc(t.theme)}</b> — ${num(t.count)}<small>“${esc(t.example)}”</small><small>→ ${esc(t.action)}</small></div></li>`).join("")}</ul>`;
  }catch(e){ out.textContent=aiErr(e); }
}
async function reportAI(){
  const out=document.getElementById("repOut"); const since=addDays(today(),-6);
  const rv=D.reviews.filter(r=>r.date>=since), days=salesDays(7), st=prodStats(7);
  const low=D.inventory.filter(i=>invStatus(i)[0]==="bad").map(i=>i.name), waste=D.waste.filter(w=>w.date>=since);
  const ctx=`PERIOD: ${since} to ${today()}
SALES BY DAY: ${days.map(d=>d.date+": "+dayTotals(d).cups+" cups $"+dayTotals(d).rev.toFixed(2)).join("; ")}
SALES BY DRINK: ${st.map(s=>pname(s.pid)+" "+s.cups+" cups $"+s.rev.toFixed(2)+(s.hasCost?" margin "+s.pct.toFixed(0)+"%":"")).join("; ")}
LOW STOCK: ${low.join(", ")||"none"}
WASTE: ${waste.map(w=>w.item+" "+w.qty+w.unit+" ("+w.reason+") $"+num(w.cost).toFixed(2)).join("; ")||"none logged"}
REVIEWS: ${rv.map(r=>r.stars+"★ "+r.text.slice(0,300)).join(" | ")||"none"}`;
  out.textContent=tt("Thinking…","Pensando…");
  try{ await SAMPLE(`Write a concise weekly report for the owner of a small Peruvian drinks counter, using ONLY the data below. Sections: Summary, Sales, Stock & waste, Reviews, 3 priorities for next week. Say "no data" where a section is empty; never invent figures. ${LANGLINE()}\n\n${ctx}`,{cache:false,onText:({text})=>{out.textContent=text;}});
    out.insertAdjacentHTML("beforeend",`<p><button class="btn sm ghost" id="repCopy">${tt("Copy report","Copiar reporte")}</button></p>`);
    document.getElementById("repCopy").onclick=()=>copyText(out.firstChild.textContent);
  }catch(e){ out.textContent=e.text||aiErr(e); }
}

/* ----- Path to sale: a note per step (Edit → Save) and a Done ✓ mark, saved in settings/path ----- */
let pathEdit=null, pathSig="";
const pathGet=i=>{ const d=D.path||{}; return {note:d["note_"+i]||"",done:!!d["done_"+i],doneAt:d["doneAt_"+i]||"",doneBy:d["doneBy_"+i]||"",updated:d["upd_"+i]||""}; };
const pathCan=()=>!!DB&&canWrite("settings");
function pathProgress(n){
  let done=0; for(let i=0;i<n;i++) if(pathGet(i).done) done++;
  const pct=n?Math.round(done/n*100):0;
  return `<div class="pprog"><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><span style="width:${pct}%"></span></div>
   <b>${done} / ${n}</b> ${tt("steps done","pasos hechos")}${!DB?` · <span class="dimtxt">${tt("open the app in Claude (or sign in on the website) to save notes and progress","abre la app en Claude (o inicia sesión en la web) para guardar notas y avance")}</span>`:!pathCan()?` · <span class="dimtxt">${tt("read only for your role","solo lectura para tu rol")}</span>`:""}</div>`;
}
function pathStep(st,i){
  const g=pathGet(i), ed=pathEdit===i, can=pathCan();
  const when=g.doneAt?new Date(g.doneAt).toLocaleDateString(state.lang==="es"?"es-CA":"en-CA",{dateStyle:"medium"}):"";
  return `<div class="pstep${g.done?" done":""}" data-ps="${i}"><div class="n" aria-hidden="true">${g.done?"✓":i+1}</div><div>
    <h4>${st[0]}${g.done?` <span class="badge ok">✓ ${tt("Done","Hecho")}${when?" · "+esc(when):""}${g.doneBy?" · "+esc(g.doneBy):""}</span>`:""}</h4><p>${st[1]}</p>
    ${ed?`<div class="f full" style="margin-top:10px"><label for="pnote${i}">${tt("My notes for this step (what is done, what is missing, contacts, dates…)","Mis notas de este paso (qué está hecho, qué falta, contactos, fechas…)")}</label><textarea id="pnote${i}" rows="4">${esc(g.note)}</textarea></div>`
      :g.note?`<div class="pnote">📝 ${esc(g.note)}</div>`:""}
    ${can?`<div class="acts">${ed?`<button type="button" class="btn sm" data-psave="${i}">💾 ${tt("Save","Guardar")}</button><button type="button" class="btn sm ghost" data-pcancel="${i}">${tt("Cancel","Cancelar")}</button>`
        :`<button type="button" class="btn sm ghost" data-pedit="${i}">✎ ${g.note?tt("Edit note","Editar nota"):tt("Add note","Agregar nota")}</button>`}
      ${g.done?`<button type="button" class="btn sm ghost" data-pdone="${i}" aria-pressed="true">↺ ${tt("Mark as not done","Marcar como no hecho")}</button>`
        :`<button type="button" class="btn sm" data-pdone="${i}" aria-pressed="false">✓ ${tt("Done","Hecho")}</button>`}</div>`:""}
  </div></div>`;
}
function wirePath(){
  const box=main.querySelector(".path"); if(!box) return;
  box.onclick=async e=>{
    const b=e.target.closest("[data-pedit],[data-psave],[data-pcancel],[data-pdone]"); if(!b) return;
    if(!pathCan()) return noDb();
    if(b.dataset.pedit!=null){ pathEdit=+b.dataset.pedit; render(); const t=document.getElementById("pnote"+pathEdit); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } return; }
    if(b.dataset.pcancel!=null){ pathEdit=null; render(); return; }
    const stamp=new Date().toISOString();
    if(b.dataset.psave!=null){ const i=+b.dataset.psave, note=(document.getElementById("pnote"+i)?.value||"").trim().slice(0,2000);
      pathEdit=null; await dbSet("settings/path",{...(D.path||{}),["note_"+i]:note,["upd_"+i]:stamp}); render(); toast(tt("Note saved.","Nota guardada.")); return; }
    if(b.dataset.pdone!=null){ const i=+b.dataset.pdone, g=pathGet(i);
      if(pathEdit===i){ const t=document.getElementById("pnote"+i); if(t) D.path={...(D.path||{}),["note_"+i]:t.value.trim().slice(0,2000),["upd_"+i]:stamp}; pathEdit=null; }
      await dbSet("settings/path",{...(D.path||{}),["done_"+i]:!g.done,["doneAt_"+i]:g.done?"":stamp,["doneBy_"+i]:g.done?"":(SESSION?SESSION.name||SESSION.user:"")});
      render(); toast(g.done?tt("Step marked as not done.","Paso marcado como no hecho."):tt("Step done ✓","Paso hecho ✓")); }
  };
}
function path(){
  const es=state.lang==="es";
  const S=es?[
   ["Define el concepto y el menú","Elige qué bebidas venderás, tamaños de porción y si serán al momento, en dispensador o embotelladas. Esto define tu clase de permiso y tu equipo."],
   ["Registra el negocio y la licencia municipal","Registra el nombre o la empresa en Alberta y solicita la licencia de negocio de la Ciudad de Edmonton. Si alquilas en un centro comercial o campus, revisa los requisitos del arrendador."],
   ["Revisión de planos","Envía los planos a la Ciudad de Edmonton al menos 6 semanas antes de construir; incluye equipo, lavamanos, fregaderos y menú completo."],
   ["Certificación en inocuidad","Al menos una persona a cargo certificada; si hay 6+ manipuladores por turno, siempre una persona certificada presente."],
   ["Proveedores aprobados","Compra pulpas congeladas (piña, manzana, membrillo, limón, plátano, lúcuma, chirimoya, chicha morada), maíz morado, maca y quinua a importadores con licencia CFIA o distribuidores establecidos. Guarda facturas y números de lote para trazabilidad. Necesitarás congelador a −18 °C."],
   ["Estandariza las recetas","Usa las calculadoras de esta app para fijar lotes, rendimiento y costo por vaso. Haz lotes de prueba de las recetas de referencia."],
   ["Plan de inocuidad escrito","Para cada producto registra los PCC: recepción congelada, descongelación en refrigerador, cocción, enfriamiento, frío ≤ 4 °C. Añade plan de limpieza y de plagas."],
   ["Solicita el permiso e inspección","Solicita el permiso de AHS en línea; la inspección de aprobación se hace con el equipo instalado y funcionando."],
   ["Etiquetas y menú","Declara alérgenos (leche, sulfitos), marca “no pasteurizado” en jugos frescos embotellados y evita afirmaciones de salud no verificadas."],
   ["Costeo y precio","Suma ingredientes, envases, mano de obra y gastos fijos por porción; fija el precio con tu margen objetivo."],
   ["Venta y registros diarios","Registra temperaturas de refrigeradores, lotes (fecha/hora) y desechos; exhibe el permiso; prepárate para inspecciones sin aviso."]
  ]:[
   ["Define the concept and menu","Choose which drinks you will sell, serving sizes, and whether they are made to order, dispensed, or bottled. This drives your permit class and equipment."],
   ["Register the business and city licence","Register the trade name or company in Alberta and apply for a City of Edmonton business licence. If leasing in a mall or campus, check the landlord's requirements."],
   ["Plan review","Send plans to the City of Edmonton at least 6 weeks before construction, including equipment, hand sinks, prep sinks and full menu."],
   ["Food safety certification","At least one certified person in charge; with 6+ handlers per shift, a certified person on site at all times."],
   ["Approved suppliers","Buy frozen pulps (pineapple, apple, quince, lime, banana, lúcuma, cherimoya, chicha morada), purple corn, maca and quinoa from CFIA-licensed importers or established distributors. Keep invoices and lot codes for traceability. You will need freezer space at −18 °C."],
   ["Standardize recipes","Use this app's calculators to lock batch sizes, yield and cost per cup. Test-batch the reference recipes."],
   ["Written food-safety plan","Record CCPs for each product: frozen receiving, fridge thawing, cooking, cooling, cold-hold ≤ 4 °C. Add cleaning and pest plans."],
   ["Apply for the permit and inspection","Apply online to AHS; the approval inspection happens with equipment installed and working."],
   ["Labels and menu","Declare allergens (milk, sulphites), mark bottled fresh juice “unpasteurized”, and avoid unverified health claims."],
   ["Costing and pricing","Add ingredients, packaging, labour and overhead per serving; set price at your target margin."],
   ["Sale and daily records","Log fridge temperatures, batches (date/time) and waste; post the permit; be ready for unannounced inspections."]
  ];
  return `<section style="--pc:var(--accent);--pc2:var(--accent)">
   <div class="hero"><div><div class="eyebrow">${es?"De la idea al primer vaso vendido":"From idea to first cup sold"}</div><h2>${es?"Camino a la venta":"Path to sale"}</h2><p>${es?"Pasos en orden para vender las seis bebidas en Edmonton. Cada pestaña de producto tiene además su propio flujo con puntos críticos de control.":"Ordered steps to sell all six drinks in Edmonton. Each product tab also has its own flow with critical control points."}</p></div></div>
   ${pathProgress(S.length)}
   <div class="path">${S.map((s,i)=>pathStep(s,i)).join("")}</div>
   <div class="panel sources" style="margin-top:20px"><h3>${es?"Fuentes":"Sources"}</h3><ul>
    <li>${L("ahs","AHS — Starting a Food Business (PUB-0420-202601)")}</li>
    <li>${L("temp","AHS — Important Temperatures for Safe Food Handling")}</li>
    <li>${L("hc","Health Canada — Unpasteurized juice and cider")}</li>
    <li>${L("code","Alberta — Food Retail and Foodservices Code (2020)")}</li>
    <li>${L("cfia","CFIA — Food labelling")}</li></ul></div>
  </section>`;
}

function render(){
  document.documentElement.lang=state.lang;
  document.getElementById("btnEn").setAttribute("aria-pressed",state.lang==="en");
  document.getElementById("btnEs").setAttribute("aria-pressed",state.lang==="es");
  document.getElementById("appTitle").textContent=state.lang==="es"?"Taste of Peru":"Taste of Peru";
  { const bl=document.getElementById("builtLbl"); if(bl) bl.textContent=state.lang==="es"?"Construido por":"Built by"; }
  document.getElementById("appSub").textContent=isGuest()?tt("Peruvian drinks, desserts and dishes in Edmonton.","Bebidas, postres y platos peruanos en Edmonton."):T(UI.sub);
  document.getElementById("disc").textContent=T(UI.disc);
  if(isGuest()){ state.tab="ai"; state.aiView="m1"; }
  renderTabs();
  if(P.some(x=>x.id===state.tab)){ state.recipe=state.tab; state.tab="recipes"; save(); renderTabs(); } // old saved tab
  if(state.tab==="recipes"){ main.innerHTML=recipesTab(); wireRecipes(); }
  else if(state.tab==="ai"){ main.innerHTML=aiSys(); wireAI(); }
  else if(state.tab==="menu"){ main.innerHTML=menuView(); wireMenu(); listMenu(); }
  else if(state.tab==="path"){ main.innerHTML=path(); wirePath(); pathSig=JSON.stringify(D.path||{}); }
  else main.innerHTML=rules();
  renderUserBox(); renderCurBox();
}
document.getElementById("curSel").onchange=e=>{
  const c=e.target.value;
  if(!curOk(c)){ toast(tt(`Set the CAD → ${c} rate in Billing by table first.`,`Primero pon el tipo de cambio CAD → ${c} en Facturación por mesa.`)); e.target.value=state.cur; return; }
  state.cur=c; save(); render();
};
document.getElementById("btnEn").onclick=()=>{state.lang="en";save();render();};
document.getElementById("btnEs").onclick=()=>{state.lang="es";save();render();};
render();
</script>

</body></html>
