<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taste of Peru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F4F8; --surface:#FFFFFF; --sunk:#EFEAF1; --ink:#24172A; --muted:#675A6D; --line:#E0D7E4;
  --accent:#5B2366; --accent-ink:#FFFFFF; --warn:#9A4A00; --warn-bg:#FFF2E0; --bad:#A3243B; --bad-bg:#FCE8EC; --ok:#2F6B3A; --ok-bg:#E6F3E7;
  --pc:#5B2366;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15101A; --surface:#1F1825; --sunk:#281F2F; --ink:#F0E9F3; --muted:#A99DAF; --line:#3A2F42;
    --accent:#C99AD6; --accent-ink:#1A1020; --warn:#F2B36B; --warn-bg:#3A2912; --bad:#F29AAB; --bad-bg:#3D1A22; --ok:#9BD3A3; --ok-bg:#1B3220;
  }
}
:root[data-theme="dark"]{
  --bg:#15101A; --surface:#1F1825; --sunk:#281F2F; --ink:#F0E9F3; --muted:#A99DAF; --line:#3A2F42;
  --accent:#C99AD6; --accent-ink:#1A1020; --warn:#F2B36B; --warn-bg:#3A2912; --bad:#F29AAB; --bad-bg:#3D1A22; --ok:#9BD3A3; --ok-bg:#1B3220;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;padding-block:28px 16px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.curbox{display:inline-flex;align-items:center;gap:4px}
.curbox select{font:600 13px var(--body);padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
nav.tabs .row{display:flex;gap:4px;min-width:max-content;padding-block:8px}
nav.tabs button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 14px var(--body);padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
nav.tabs button .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);border-color:var(--line)}
nav.tabs .sep{width:1px;background:var(--line);margin:6px 6px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:22px}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:18px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pc2)}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:4px 0 6px;line-height:1.15;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:65ch}
.swatch{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%, color-mix(in oklab,var(--pc) 55%, white), var(--pc) 70%);box-shadow:inset 0 -6px 12px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:1fr}.swatch{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font:700 13px var(--body);letter-spacing:.07em;text-transform:uppercase;margin:0 0 12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:20px}
.variants{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.variants button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.variants button[aria-pressed="true"]{background:var(--pc2);border-color:var(--pc2);color:var(--surface)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:14px;background:var(--sunk);border-radius:10px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font:600 12px var(--body);color:var(--muted);letter-spacing:.03em}
.field input{width:110px;font:500 16px var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--mono);padding:6px 9px;border-radius:7px;cursor:pointer}
.chips button:hover{border-color:var(--pc2)}
.factor{font:500 13px var(--mono);color:var(--muted);margin-left:auto}
.factor b{color:var(--ink);font-weight:500}
.tablewrap{overflow-x:auto}
.cfmwrap{position:fixed;inset:0;background:rgba(20,10,25,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.cfm{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px 22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.cfm h3{margin:0 0 8px;font-size:18px}.cfm p{margin:0 0 16px;color:var(--muted)}
.cfmbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
table.dt.invt tr.editing td{background:var(--sunk)}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 2px var(--bad-bg)!important}
table.ing{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.ing td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ing tr:last-child td{border-bottom:0}
table.ing td.amt{width:1%;white-space:nowrap}
table.ing input{width:92px;font:500 15px var(--mono);padding:5px 7px;border:1px solid transparent;border-radius:6px;background:var(--sunk);color:var(--ink);text-align:right}
table.ing input:hover{border-color:var(--line)}
table.ing input:focus{border-color:var(--pc2);background:var(--surface)}
table.ing .unit{font:500 13px var(--mono);color:var(--muted);padding-left:4px}
table.ing .conv{font:400 12px var(--mono);color:var(--muted);white-space:nowrap;text-align:right}
table.ing .name small{display:block;color:var(--muted);font-size:12px}
table.ing tr.driver .name{font-weight:600}
table.ing tr.driver .name::after{content:" ●";color:var(--pc2);font-size:10px;vertical-align:middle}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.ratio{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ratio span{font:500 12px var(--mono);background:var(--sunk);padding:4px 8px;border-radius:6px;color:var(--ink)}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li::marker{font:500 13px var(--mono);color:var(--pc2)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.claims{display:flex;flex-direction:column;gap:8px}
.claim{border-radius:10px;padding:10px 12px;font-size:14px;border:1px solid var(--line)}
.claim .v{display:inline-block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-bottom:4px}
.claim.bad .v{background:var(--bad-bg);color:var(--bad)}
.claim.warn .v{background:var(--warn-bg);color:var(--warn)}
.claim.ok .v{background:var(--ok-bg);color:var(--ok)}
.claim .q{font-style:italic;display:block;margin-bottom:2px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:12px}
.flow li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.flow li:last-child::before{display:none}
.flow .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.flow li.ccp .n{background:var(--pc2);color:var(--surface);border-color:var(--pc2)}
.flow .tag{font:600 10px var(--mono);letter-spacing:.06em;color:var(--pc2);border:1px solid var(--pc2);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.note{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.note b{color:var(--warn)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.rules .panel h4{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 8px}
.temps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.temp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.temp .big{font:500 26px var(--mono);line-height:1.1}
.temp .lbl{font-size:13px;color:var(--muted)}
.temp.danger{background:var(--bad-bg);border-color:transparent}
.temp.danger .big{color:var(--bad)}
.src{font-size:12px;color:var(--muted);margin-top:8px}
.src a,.sources a{color:var(--accent)}
.unv{font:600 10px var(--mono);letter-spacing:.05em;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.sources{font-size:13px;color:var(--muted)}
.sources ul{padding-left:18px}
.path{display:flex;flex-direction:column;gap:12px}
.pstep{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.pstep .n{font-family:var(--display);font-size:26px;color:var(--accent);line-height:1}
.pstep h4{margin:0 0 4px;font-size:16px}
.pstep p{margin:0;color:var(--muted);font-size:14px}
.pstep.done{border-color:var(--ok);background:color-mix(in oklab,var(--ok-bg) 60%,var(--surface))}
.pstep.done .n{color:var(--ok)}
.pstep .acts{margin-top:10px}
.pnote{margin-top:10px;padding:8px 10px;background:var(--sunk);border-radius:8px;font-size:14px;white-space:pre-wrap}
.pprog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.pbar{flex:1 1 200px;height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.pbar span{display:block;height:100%;background:var(--ok);border-radius:999px}
.disclaimer{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mods .panel h4{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 4px}
.mods .mnum{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mods .fit{margin-top:10px;font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:22px}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cap b{display:block;margin-bottom:4px}
.cap span{font-size:14px;color:var(--muted)}
h3.sec{font-family:var(--display);font-weight:400;font-size:22px;margin:26px 0 12px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.subnav button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
.subnav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.recipenav button{display:inline-flex;align-items:center;gap:7px}
.recipenav .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.recipenav button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
ol.steps{margin:6px 0 0 18px;padding:0;font-size:14px}
.docximp{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--sunk)}
.docximp.top{margin:0 0 16px}
#mnSubmit{white-space:nowrap}
#mnDocBox .btn{display:inline-flex;align-items:center}
.docximp .hint{margin:6px 0 0}
.docximp .hint:empty{display:none}
details.refrec{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
details.refrec>summary{cursor:pointer;font:600 14px var(--body);color:var(--accent)}
details.refrec[open]>summary{margin-bottom:10px}
select.invsel{max-width:180px;font:13px var(--body);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink)}
ol.steps li{margin-bottom:6px}
.capnote{font-size:13px;color:var(--muted);margin:0 0 16px}
.warnnote{background:var(--warn-bg);color:var(--ink);padding:10px 12px;border-radius:10px}
.oknote{background:var(--ok-bg);color:var(--ink);padding:10px 12px;border-radius:10px;border-left:4px solid var(--ok)}
.oknote:empty{display:none}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 14px var(--body);padding:8px 14px;border-radius:9px;cursor:pointer;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{font-size:13px;padding:5px 10px;min-height:30px}
.linkbtn{border:0;background:none;color:var(--accent);font:600 13px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.fgrid.wide{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f.inline{flex-direction:row;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.f label,.f>span{font:600 12px var(--body);color:var(--muted)}
.f input,.f select,.f textarea,.aibox textarea,.chatbar input,.gen textarea,.gen input,.review textarea{font:15px var(--body);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.f.inline input{width:80px}
textarea{resize:vertical}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .big{font:500 24px var(--mono);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi.bad{background:var(--bad-bg);border-color:transparent}.kpi.bad .big{color:var(--bad)}
.kpi.warn{background:var(--warn-bg);border-color:transparent}.kpi.warn .big{color:var(--warn)}
.badge{display:inline-block;font:600 11px var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
ul.rows{list-style:none;margin:0;padding:0}
ul.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}
ul.rows li:last-child{border-bottom:0}
ul.rows small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
ul.rows .acts{margin-top:0}
.empty{color:var(--muted);font-size:14px;margin:6px 0}
.chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--sunk);border-radius:10px;margin-bottom:10px}
.bub{max-width:85%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.mic{display:inline-flex;align-items:center;gap:6px}
.mic.rec{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.mic.rec svg{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}
.voicebar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:6px}
.voicebar .f.inline{margin-top:0}
.voicebar select{font:14px var(--body);padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.chatbar{display:flex;gap:6px;flex-wrap:wrap}.chatbar input{flex:1 1 180px;width:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
table.dt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.dt th{text-align:left;font:600 12px var(--body);color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.addstock{margin:14px 0;padding:12px;background:var(--sunk);border-radius:10px}
.addstock .minih{margin-top:0}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);font-size:13px;display:flex;flex-direction:column;gap:4px}
.tcard.occ{border-color:var(--warn);background:var(--warn-bg)}
.tstat{display:inline-block;font:600 12px var(--body);padding:4px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;cursor:pointer}
span.tstat{cursor:default}
.tcard .tstat{white-space:normal}
.tstat.free{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.tstat.occ{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.tstat.res{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tstat.off{background:var(--sunk);color:var(--muted)}
.kpi.okk{background:var(--ok-bg);border-color:transparent}.kpi.okk .big{color:var(--ok)}
.tnum{font:600 15px var(--body)}
.slots{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.oitem{display:grid;grid-template-columns:minmax(0,2fr) 60px minmax(0,1.3fr) minmax(0,2fr) auto;gap:6px;margin-bottom:6px;align-items:center}
.oitem input,.oitem select{font:14px var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
@media (max-width:640px){.oitem{grid-template-columns:1fr 64px}.oitem .odone,.oitem .onote{grid-column:1/2}}
fieldset.allerg{border:1px solid var(--bad);border-radius:10px;padding:8px 10px;margin:0}

/* ---------- FORMATTING ---------- */
const serveTxt=v=>v.serveMl?v.serveMl+" mL":T(v.serveLabel||{en:"1 portion",es:"1 porción"});
function nice(x){ if(x>=100) return Math.round(x).toString(); if(x>=10) return (Math.round(x*10)/10).toString(); return (Math.round(x*100)/100).toString(); }
function frac(x){ const w=Math.floor(x), r=x-w, qs=[[0,""],[.25,"¼"],[.33,"⅓"],[.5,"½"],[.67,"⅔"],[.75,"¾"],[1,""]]; let best=qs[0]; for(const q of qs){ if(Math.abs(r-q[0])<Math.abs(r-best[0])) best=q; } const ww=best[0]===1?w+1:w; return (ww?ww:"")+(best[1]) || "0"; }
const UN = {
  g:{en:"g",es:"g"}, ml:{en:"mL",es:"mL"}, u:{en:"pc",es:"und"}, tbsp:{en:"tbsp",es:"cda"}, tsp:{en:"tsp",es:"cdta"}
};
function conv(q,u){
  if(u==="ml"){ const cups=q/236.6; return (q>=1000? nice(q/1000)+" L · ":"")+frac(cups)+(state.lang==="es"?" tazas":" cups"); }
  if(u==="g"){ return q>=1000? nice(q/1000)+" kg" : (nice(q/28.35)+" oz"); }
  if(u==="tbsp"){ return nice(q*15)+" mL"; }
  if(u==="tsp"){ return nice(q*5)+" mL"; }
  if(u==="u"){ return "≈ "+frac(q); }
  return "";
}

  tabsEl.innerHTML=items.map(it=>it.sep?'<span class="sep" aria-hidden="true"></span>':
    `<button role="tab" id="tab-${it.id}" aria-selected="${state.tab===it.id}" data-tab="${it.id}" style="--c:${it.c}"><span class="dot"></span>${it.label}</button>`).join("");
}

  const strip=x=>x.replace(/^[#*\s]+|[*:\s]+$/g,"").replace(/[🍽️🇪🇸🇺🇸]/gu,"").trim();

  const stopH=/^(sources?|fuentes?|notes?|notas?|tips?|consejos?|nutrition|nutrici[oó]n|english version|versi[oó]n en)\b/i;
  const heads=[]; L.forEach((x,i)=>{ const h=strip(x); if(h.length<45&&ingH.test(h)) heads.push({i,type:"ing",es:/ingredientes/i.test(h)}); else if(h.length<45&&stepH.test(h)) heads.push({i,type:"step",es:/preparaci|pasos|procedimiento|elaboraci/i.test(h)}); else if(h.length<45&&stopH.test(h)) heads.push({i,type:"stop"}); });
  const es=state.lang==="es";
  const pick=type=>{ const all=heads.filter(h=>h.type===type); return all.find(h=>h.es===es)||all[0]; };
  const body=h=>{ if(!h) return []; const nx=heads.find(x=>x.i>h.i); return L.slice(h.i+1,nx?nx.i:L.length); };
  let ingL=body(pick("ing")); const stepL=body(pick("step"));
  if(!pick("ing")){ // no "Ingredients" heading: take the lines before the preparation (or all of them)
    const firstStep=heads.find(h=>h.type!=="ing"), cand=L.slice(0,firstStep?firstStep.i:L.length).filter(x=>!/\b(serves|servings|yield|makes|porciones|raciones|rinde|prep|cook|cocci[oó]n|minutes|minutos)\b/i.test(x));
    const withQty=cand.filter(x=>QTY_RE.test(x.replace(/^[-•*·▪◦]\s*/,"")));
    if(ingOnly||withQty.length>=2){ const title=cand.length>2&&!/\d/.test(cand[0])&&withQty.length>=cand.length/2; ingL=title?cand.slice(1):cand; if(!ingOnly) ingL=ingL.filter(x=>QTY_RE.test(x.replace(/^[-•*·▪◦]\s*/,""))||TASTE_RE.test(x)||/(al gusto|to taste)/i.test(x)); }

  const steps=[]; for(let i=0;i<stepL.length;i++){ let x=stepL[i]; if(/^\d+[.)]?$/.test(x)&&stepL[i+1]){ x=stepL[i+1]; i++; } x=x.replace(/^(\d+[.)]|[-•*·]|paso \d+[:.]?|step \d+[:.]?)\s*/i,"").trim(); if(x) steps.push(x); }

  let name=strip(L[0]||"").split(/\s[—–-]\s|\s\(/)[0].replace(/\b(recipe|receta)\b/ig,"").trim();
  const drink=/\b(jugo|juice|chicha|drink|bebida|refresco|batido|shake|smoothie|limonada|lemonade|emoliente|infusi[oó]n|t[eé]|tea|caf[eé]|coffee|c[oó]ctel|cocktail|pisco sour)\b/i.test(name);
  return {name,category:drink?"bebida":"comida",kind:drink?"jugo":"fondo",servings:serv||1,servingsFound:!!serv,portionLabel:"",ingredients:ings.map(g=>({name:g.n,qty:g.q,unit:g.u,note:g.taste?tt("to taste","al gusto"):g.note||""})),steps,notes:""};

let MODE="claude"; // "claude" | "local"
const LS_DB="top-db-v1", LS_KEY="top-apikey";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function makeLocalDB(){
  let store={}; try{store=JSON.parse(lsGet(LS_DB)||"{}")||{};}catch(e){store={};}
  const subs=new Set();
  const persist=()=>{ if(!lsSet(LS_DB,JSON.stringify(store))) toast(tt("Browser storage is full or blocked.","El almacenamiento del navegador está lleno o bloqueado.")); };
  const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const snapDoc=(path)=>({id:path.split("/").pop(),exists:path in store,data:()=>store[path]?JSON.parse(JSON.stringify(store[path])):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  function docRef(path){return{id:path.split("/").pop(),path,
    async get(){return snapDoc(path);},
    async set(d){store[path]=JSON.parse(JSON.stringify(d));persist();notify();},
    async update(d){if(!(path in store))throw{code:"invalid_argument"};Object.assign(store[path],JSON.parse(JSON.stringify(d)));persist();notify();},
    async delete(){delete store[path];persist();notify();},
    onSnapshot(next){const f=()=>next(snapDoc(path));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}};}
  function col(name){return{path:name,
    doc(id){return docRef(name+"/"+(id||rid()));},
    async add(d){const r=this.doc();await r.set(d);return r;},
    onSnapshot(next){const f=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(name+"/")&&k.split("/").length===2).sort().map(snapDoc);next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}});};subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}};}
  return {collection:col,doc:docRef,_dump:()=>JSON.parse(JSON.stringify(store)),_load:obj=>{store=obj||{};persist();notify();},_empty:()=>!Object.keys(store).length};
}

function makeApiSample(){
  async function call(input,opts={}){
    const key=lsGet(LS_KEY); if(!key) throw {code:"not_granted",message:"no key"};
    let msgs=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
    const merged=[]; msgs.forEach(m=>{const last=merged[merged.length-1]; if(last&&last.role===m.role) last.content+="\n\n"+m.content; else merged.push({...m});});
    let r;
    try{ r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:await pickModel(opts.modelTier),max_tokens:2048,messages:merged})}); }
    catch(e){ throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error",message:String(e)}; }
    if(!r.ok){ const code=r.status===401||r.status===403?"bad_key":r.status===429?"rate_limited":"upstream_error"; throw {code,message:"HTTP "+r.status}; }
    const j=await r.json(); const text=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim();
    if(!text) throw {code:"empty_completion"};
    opts.onText&&opts.onText({text,delta:text});
    return {text,truncated:j.stop_reason==="max_tokens",modelTierApplied:opts.modelTier||"default"};
  }
  const fn=(i,o)=>call(i,o);
  fn.json=async(i,o)=>{ const {text}=await call(typeof i==="string"?i+"\n\nReply with the JSON only.":i,o);
    const tryP=s=>{try{return JSON.parse(s);}catch(e){return undefined;}};
    let v=tryP(text); if(v===undefined){const m=text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) v=tryP(m[1]);}
    if(v===undefined){const a=text.search(/[\[{]/), b=Math.max(text.lastIndexOf("]"),text.lastIndexOf("}")); if(a>=0&&b>a) v=tryP(text.slice(a,b+1));}
    if(v===undefined) throw {code:"invalid_json",text}; return v; };
  return fn;
}

  }catch(e){}
}

/* ===== Google Sheets (Google Drive) database, via the Apps Script web app in google-apps-script/Code.gs ===== */
const LS_SURL="top-sheet-url", LS_SPIN="top-sheet-pin";
const SHEET_COLS=["reservations","inventory","waste","sales","posts","reviews","tables","orders","menu","bills","recipes","kardex","settings"];
async function sheetCall(url,body){
  if(SESSION&&SESSION.token&&!body.token) body={...body,token:SESSION.token};
  let r; try{ r=await fetch(url,{method:"POST",headers:{"content-type":"text/plain;charset=utf-8"},body:JSON.stringify(body),redirect:"follow"}); }
  catch(e){ throw {code:"unavailable",message:String(e)}; }
  if(!r.ok) throw {code:"unavailable",message:"HTTP "+r.status};
  let j; try{ j=await r.json(); }catch(e){ throw {code:"unavailable",message:"not json"}; }
  if(!j.ok){ if(j.error==="auth") onAuthLost(); throw {code:j.error==="bad_request"?"invalid_argument":j.error,message:j.message||j.error}; }
  return j;
}
function makeSheetDB(url){
  const cache={}, loaded={}, subs={}, rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const notify=col=>setTimeout(()=>(subs[col]||new Set()).forEach(f=>f()),0);
  const snap=(col,id)=>({id,exists:!!(cache[col]&&cache[col][id]),data:()=>cache[col]&&cache[col][id]?JSON.parse(JSON.stringify(cache[col][id])):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  const fails={}; // consecutive failed loads per tab
  async function load(col){
    let j=null, err=null;
    for(let i=0;i<3;i++){ // retry brief network / "busy" hiccups before warning
      try{ j=await sheetCall(url,{action:"list",col}); err=null; break; }
      catch(e){ err=e; if(e.code==="auth"||e.code==="forbidden"||e.code==="bad_collection") break; await new Promise(r=>setTimeout(r,1500*(i+1))); } }
    if(j){ fails[col]=0; const m={}; j.docs.forEach(d=>{m[d.id]=d.data;});
      const same=loaded[col]&&JSON.stringify(cache[col])===JSON.stringify(m);
      cache[col]=m; loaded[col]=true; if(!same) notify(col); return; }
    fails[col]=(fails[col]||0)+1; console.warn("Sheet load failed:",col,err);
    // background refreshes stay quiet unless the problem persists
    if(err.code!=="auth"&&(!loaded[col]||fails[col]>=3)) toast(tt("Can't reach the Google Sheet right now.","No se puede conectar con la hoja de Google ahora."));
  }
  const denied=()=>toast(tt("Your role can't make this change.","Tu rol no permite este cambio."));
  async function write(col,id,data){ if(!canWrite(col)){ denied(); await load(col); throw {code:"forbidden"}; }
    try{ try{ await sheetCall(url,{action:"set",col,id,data}); }
         catch(e){ if(e.code!=="busy") throw e; await new Promise(r=>setTimeout(r,1500)); await sheetCall(url,{action:"set",col,id,data}); } } // one retry when the server is busy
    catch(e){ if(e.code==="forbidden") denied();
      else if(e.code==="too_big") toast(tt("Too much text to save in one record. Shorten it and try again.","Demasiado texto para guardar en un registro. Acórtalo e inténtalo de nuevo."));
      else if(e.code==="busy") toast(tt("The Google Sheet is busy. Try again in a moment.","La hoja de Google está ocupada. Inténtalo de nuevo en un momento."));
      else if(e.code!=="auth") toast(tt("Not saved to the Google Sheet. Try again.","No se guardó en la hoja de Google. Inténtalo de nuevo."));
      await load(col); throw e; } }
  function docRef(path){ const [col,id]=path.split("/"); return {id,path,
    async get(){ if(!loaded[col]) await load(col); return snap(col,id); },
    async set(d){ (cache[col] ||= {})[id]=JSON.parse(JSON.stringify(d)); notify(col); await write(col,id,cache[col][id]); },
    async update(d){ if(!(cache[col]&&cache[col][id])) throw {code:"invalid_argument"}; Object.assign(cache[col][id],JSON.parse(JSON.stringify(d))); notify(col); await write(col,id,cache[col][id]); },
    async delete(){ if(!canWrite(col)){ denied(); return; } if(cache[col]) delete cache[col][id]; notify(col); try{ await sheetCall(url,{action:"delete",col,id}); }catch(e){ if(e.code==="forbidden") denied(); else if(e.code!=="auth") toast(tt("Not deleted in the Google Sheet.","No se borró en la hoja de Google.")); await load(col); } },
    onSnapshot(next){ const f=()=>next(snap(col,id)); (subs[col] ||= new Set()).add(f); if(!loaded[col]) load(col); else setTimeout(f,0); return ()=>subs[col].delete(f); } }; }
  function colRef(col){ return {path:col,
    doc(id){ return docRef(col+"/"+(id||rid())); },
    async add(d){ const r=this.doc(); await r.set(d); return r; },
    onSnapshot(next){ const f=()=>{ const docs=Object.keys(cache[col]||{}).sort().map(id=>snap(col,id)); next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}}); }; (subs[col] ||= new Set()).add(f); if(!loaded[col]) load(col); else setTimeout(f,0); return ()=>subs[col].delete(f); } }; }
  // refresh every 30 s while the page is visible, so other devices' changes show up
  setInterval(()=>{ if(document.visibilityState==="visible") Object.keys(subs).forEach(c=>{ if(subs[c].size) load(c); }); },30000);
  return {collection:colRef,doc:docRef,_refresh:c=>load(c),
    _dump:async()=>{ for(const c of SHEET_COLS) if(!loaded[c]) await load(c); const o={}; SHEET_COLS.forEach(c=>Object.entries(cache[c]||{}).forEach(([id,d])=>{o[c+"/"+id]=d;})); return o; },
    _load:async obj=>{ for(const [k,d] of Object.entries(obj||{})){ const [c,id]=k.split("/"); if(SHEET_COLS.includes(c)&&id){ (cache[c] ||= {})[id]=d; await sheetCall(url,{action:"set",col:c,id,data:d}); } } SHEET_COLS.forEach(notify); },
    _empty:()=>false };
}


/* ===== Login + roles (website mode, backed by the Apps Script in google-apps-script/Code.gs) ===== */
const DEFAULT_SERVER_URL = "https://script.google.com/macros/s/AKfycbyI2kMnHQ24cJBsfxBSwGDpCoMaGurofj8NpFehlOqD7vGma5Nuzn5tlDBRZGUcOab-Rw/exec"; // optional: paste the /exec URL here so new devices don't have to type it
const SS_TOK = "top-token";
let SESSION = null;
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k);}catch(e){}}
function serverUrl(){ return lsGet(LS_SURL)||DEFAULT_SERVER_URL; }
const ROLE_LABEL={admin:["Administrator","Administrador"],chef:["Chef","Chef"],cocinero:["Cook","Cocinero"],mesero:["Waiter","Mesero"],lectura:["Read only","Solo lectura"]};
// roles limited to some modules (others see every module)
const ROLE_HOME={cocinero:"m2",mesero:"m1"};
const ROLE_VIEWS={mesero:["m1","tables","orders","kitchen","bill","settings"]};
const ROLE_READ={mesero:["reservations","tables","orders","menu","bills","recipes","settings","inventory","kardex"]};
const ROLE_WRITE={chef:["inventory","waste","settings","orders","recipes","kardex"],cocinero:["inventory","waste","kardex"],mesero:["reservations","tables","orders","bills","sales"],lectura:[]};
const myRole=()=>MODE==="sheet"&&SESSION?SESSION.role:null;
const canView=v=>{const r=myRole(); return !r||!ROLE_VIEWS[r]||ROLE_VIEWS[r].includes(v);};
const canRead=c=>{const r=myRole(); return !r||!ROLE_READ[r]||ROLE_READ[r].includes(c);};
const roleName=r=>ROLE_LABEL[r]?tt(ROLE_LABEL[r][0],ROLE_LABEL[r][1]):r;
function onAuthLost(){
  if(!SESSION) return;
  SESSION=null; ssDel(SS_TOK); ssSet("top-expired","1"); location.reload();
}
function renderUserBox(){
  const el=document.getElementById("userBox"); if(!el) return;
  if(MODE!=="sheet"||!SESSION){ el.hidden=true; return; }

  document.getElementById("logoutBtn").onclick=async()=>{ const t=SESSION&&SESSION.token; SESSION=null; ssDel(SS_TOK); try{ await sheetCall(serverUrl(),{action:"logout",token:t}); }catch(e){} location.reload(); };
}

      <div class="f"><label for="lgPass">${tt("Password","Contraseña")}</label><input id="lgPass" type="password" autocomplete="current-password" required></div>

  if(canRead("settings")){ DB.doc("settings/costs").onSnapshot(s=>{D.costs=s.exists?{...s.data()}:{};refreshAI();},()=>{});
    DB.doc("settings/bill").onSnapshot(s=>{D.bill=s.exists?{...s.data()}:{};refreshAI();},()=>{});
    DB.doc("settings/kardex").onSnapshot(s=>{D.kxMonths=s.exists?{...s.data()}:{};refreshAI();},()=>{});

function startSheet(url){
  MODE="sheet"; DB=makeSheetDB(url); if(lsGet(LS_KEY)) SAMPLE=makeApiSample();
  capsReady=true; startData();
  document.getElementById("login").hidden=true; document.body.classList.remove("locked");
  renderUserBox(); render();
}
async function startAuth(){
  const url=serverUrl(), tok=ssGet(SS_TOK);
  if(url&&tok){
    try{ const j=await sheetCall(url,{action:"me",token:tok}); SESSION={token:tok,user:j.user,name:j.name,role:j.role}; startSheet(url); return; }
    catch(e){ ssDel(SS_TOK); }
  }
  const expired=ssGet("top-expired"); ssDel("top-expired");
  showLogin(expired?tt("Your session ended. Sign in again.","Tu sesión terminó. Vuelve a iniciar sesión."):"");
}
// ----- what each role may change -----
function canWrite(col){ if(MODE!=="sheet") return true; const r=SESSION&&SESSION.role; return r==="admin"||!!(ROLE_WRITE[r]&&ROLE_WRITE[r].includes(col)); }
const READ_OK='[data-aiview],[data-mncat],#goMenu,#blTable,#blPrint,#blCopy,[data-bill],#ordRefresh,#ordServed,#tblDay,[data-range],#resFilt,#resBox,#chatIn,#chatForm button,#chatMic,#vLang,#vSpeak,[data-act="msg"],#fcNotes,#fcAI,#sAI,#engAI,#patAI,#repAI,#repCopy,#gForm input,#gForm select,#gForm textarea,#gForm button,[data-g="copy"],[data-p="copy"],[data-r="copy"],[data-r="draft"],#poCopy,[id^="gTxt"],[id^="gWhen"],[id^="rp"]';
function applyRoleUI(){
  if(MODE!=="sheet"||!SESSION||SESSION.role==="admin"||state.tab!=="ai") return;
  const v=state.aiView, chef=SESSION.role==="chef";
  if(v==="settings"||v==="overview") return;
  if(chef&&(v==="m2"||v==="orders"||v==="kitchen")) return;

async function dedupeAppDrinks(){
  dedupeDone=true;
  const groups={}; D.menu.forEach(m=>{ if(m.prodId) (groups[m.prodId] ||= []).push(m); });
  const saved=m=>{const r=recipeOf(m.id); return !!(r&&r.locked);};
  let removed=0;
  for(const list of Object.values(groups)){
    if(list.length<2) continue;
    const keep=list.slice().sort((a,b)=>(saved(b)-saved(a))||String((recipeOf(b.id)||{}).lockedAt||"").localeCompare(String((recipeOf(a.id)||{}).lockedAt||""))||String(a.id).localeCompare(String(b.id)))[0];
    for(const m of list) if(m.id!==keep.id&&!saved(m)){ await dbDel("menu",m.id); removed++; }
  }
  if(removed) toast(tt(`Removed ${removed} duplicated drink(s) from the menu; kept the one with the saved recipe.`,`Se quitaron ${removed} bebida(s) duplicada(s) del menú; se dejó la que tiene la receta guardada.`));
}

/* ================= TABLES LAYOUT (Distribución de mesas) ================= */
const BOOK_MIN=90; // each booking holds its table for 1 h 30 min
const tmin=t=>{const p=String(t||"").split(":");return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);};
const mtime=n=>{n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");};
const endTime=t=>mtime(tmin(t)+BOOK_MIN);
const activeTables=()=>D.tables.filter(t=>t.active!==false&&num(t.seats)>0).sort((a,b)=>num(a.num)-num(b.num));
const totalCap=()=>activeTables().reduce((s,t)=>s+num(t.seats),0);
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const dayNum=d=>{const p=String(d||"").split("-");return Date.UTC(+p[0]||1970,(+p[1]||1)-1,+p[2]||1)/86400000;};
const absMin=(date,time)=>dayNum(date)*1440+tmin(time); // minutes since epoch: safe across midnight
const nowAbs=()=>absMin(today(),nowHM());
const onTable=(r,tnum,exceptId)=>r.id!==exceptId&&r.status!=="cancelled"&&r.table!==""&&r.table!=null&&String(r.table)===String(tnum);
// another booking whose 1 h 30 min hold overlaps this one
function tableBooking(tnum,date,time,exceptId){
  const s=absMin(date,time);
  return D.reservations.find(r=>onTable(r,tnum,exceptId)&&Math.abs(absMin(r.date,r.time)-s)<BOOK_MIN);
}
// the booking sitting at the table right now (already started, still inside its 1 h 30 min)
function tableBookingNow(tnum){
  const n=nowAbs();
  return D.reservations.find(r=>{const st=absMin(r.date,r.time);return onTable(r,tnum)&&st<=n&&n<st+BOOK_MIN;});
}
// a table marked "occupied" (guests seated now) can't take a booking that starts today before it is expected to be free
function tableOccupiedFor(t,date,time){ const a=absMin(date,time),n=nowAbs(); return !!t.occupied&&a>n-BOOK_MIN&&a<n+BOOK_MIN; }
function tableStatus(t){
  if(t.active===false) return ["off",tt("Out of service","Fuera de servicio")];
  if(t.occupied) return ["occ",tt("Occupied","Ocupada")];
  const b=tableBookingNow(t.num);
  if(b) return ["res",tt(`Booked ${esc(b.time)}–${esc(endTime(b.time))}`,`Reservada ${esc(b.time)}–${esc(endTime(b.time))}`)];
  return ["free",tt("Free · ready for bookings","Libre · lista para reservas")];
}
// returns {table} (number, or "" when no layout is defined) or {err}
function pickTable(party,date,time,want){
  const tabs=activeTables();
  if(!tabs.length) return {table:""};
  if(want){
    const t=tabs.find(x=>String(x.num)===String(want));
    if(!t) return {err:tt("That table doesn't exist or is not active.","Esa mesa no existe o no está activa.")};
    if(num(t.seats)<party) return {err:tt(`Table ${t.num} has only ${t.seats} chairs.`,`La mesa ${t.num} tiene solo ${t.seats} sillas.`)};
    if(tableOccupiedFor(t,date,time)) return {err:tt(`Table ${t.num} is occupied now. Mark it free in “Tables layout” or book after ${mtime(tmin(nowHM())+BOOK_MIN)}.`,`La mesa ${t.num} está ocupada ahora. Márcala libre en “Distribución de mesas” o reserva después de las ${mtime(tmin(nowHM())+BOOK_MIN)}.`)};
    const b=tableBooking(t.num,date,time);
    if(b) return {err:tt(`Table ${t.num} is booked from ${b.time} to ${endTime(b.time)} (${b.name}). Each booking holds the table 1 h 30 min.`,`La mesa ${t.num} está reservada de ${b.time} a ${endTime(b.time)} (${b.name}). Cada reserva ocupa la mesa 1 h 30 min.`)};
    return {table:num(t.num)};
  }
  const max=Math.max(...tabs.map(t=>num(t.seats)));
  if(party>max) return {err:tt(`No table has ${party} chairs (largest: ${max}). Add a bigger table or join tables in “Tables layout”.`,`Ninguna mesa tiene ${party} sillas (la más grande: ${max}). Agrega una mesa más grande o junta mesas en “Distribución de mesas”.`)};
  const free=tabs.filter(t=>num(t.seats)>=party&&!tableOccupiedFor(t,date,time)&&!tableBooking(t.num,date,time)).sort((a,b)=>num(a.seats)-num(b.seats)||num(a.num)-num(b.num));
  if(!free.length) return {err:tt(`Full: no free table for ${party} between ${time} and ${endTime(time)}. Try another time.`,`Completo: no hay mesa libre para ${party} entre ${time} y ${endTime(time)}. Prueba otra hora.`)};
  return {table:num(free[0].num)};
}

  return (withAuto?`<option value="">${tt("Automatic (smallest free table)","Automática (mesa libre más pequeña)")}</option>`:"")+activeTables().map(t=>`<option value="${esc(t.num)}"${String(t.num)===String(sel)?" selected":""}>${tt("Table","Mesa")} ${esc(t.num)} · ${esc(t.seats)} ${tt("chairs","sillas")}${t.zone?" · "+esc(t.zone):""}</option>`).join("");

const OSTAT={new:["New","Nueva","warn"],prep:["Preparing","En preparación","warn"],ready:["Ready","Lista","ok"],served:["Served","Entregada","ok"],cancelled:["Cancelled","Cancelada","bad"]};
const ostat=s=>tt((OSTAT[s]||OSTAT.new)[0],(OSTAT[s]||OSTAT.new)[1]);

const allergenName=k=>{const a=ALLERGENS.find(x=>x[0]===k);return a?tt(a[1],a[2]):k;};
function itemsText(items){ return items.map(i=>`${i.qty}× ${i.dish}${i.doneness?" ("+donName(i.doneness)+")":""}${i.note?" — "+i.note:""}`).join("; "); }

function ordBookingHint(){
  const el=document.getElementById("oBook"); if(!el) return;
  const tv=val("oTable"), b=tv?tableBookingNow(tv):null;
  el.dataset.res=b?b.id:"";
  el.innerHTML=b?`📅 ${tt("Booking now at this table","Reserva ahora en esta mesa")}: <b>${esc(b.name)}</b> (${esc(b.party)}) ${esc(b.time)}–${esc(endTime(b.time))}${b.notes?` · <span class="alltxt">${tt("Booking notes","Notas de la reserva")}: ${esc(b.notes)}</span>`:""}`:"";
  if(b&&document.getElementById("oGuests").dataset.touched!=="1") document.getElementById("oGuests").value=b.party;
}
// warn the waiter while typing: dishes in this order that are out of stock or exceed the portions left
function ordStockCheck(){
  const el=document.getElementById("oStock"), box=document.getElementById("oItems"); if(!el||!box) return;
  const want={}; box.querySelectorAll(".oitem").forEach(r=>{ const d=r.querySelector(".odish").value.trim(); if(!d) return; const m=menuFind(d), k=m?m.id:dishKey(d);
    (want[k] ||= {d:m?(itemName(m)||m.name):d,q:0}).q+=Math.max(1,Math.round(num(r.querySelector(".oqty").value))); });
  const msgs=Object.values(want).map(w=>{ const left=portionsForDish(w.d); if(left==null) return "";
    return left===0?`<span class="badge bad">⛔ ${esc(w.d)}: ${tt("out of stock","sin stock")}</span>`
      :w.q>left?`<span class="badge bad">⚠ ${esc(w.d)}: ${w.q} ${tt("ordered, only","pedidas, solo quedan")} ${left}${tt(" left","")}</span>`
      :`<span class="badge ok">✓ ${esc(w.d)}: ${left} ${tt("left","disponibles")}</span>`; }).filter(Boolean);
  setHTML(el,msgs.length?`<div class="chips">${msgs.join(" ")}</div>`:"");
}
function listOrdPP(){ setHTML(document.getElementById("ordPP"),ppListHTML()); ordStockCheck(); }
function wireOrders(){
  const box=document.getElementById("oItems");
  box.addEventListener("input",ordStockCheck); box.addEventListener("change",ordStockCheck);
  document.getElementById("oAdd").onclick=()=>{box.insertAdjacentHTML("beforeend",itemRow());box.lastElementChild.querySelector(".odish").focus();applyRoleUI();};
  box.onclick=e=>{const b=e.target.closest("[data-orm]"); if(!b) return; if(box.children.length>1) b.closest(".oitem").remove(); else b.closest(".oitem").querySelectorAll("input").forEach(i=>{i.value=i.classList.contains("oqty")?1:"";});};
  document.getElementById("oTable").onchange=ordBookingHint;
  document.getElementById("oGuests").oninput=e=>{e.target.dataset.touched="1";};
  ordBookingHint();
  document.getElementById("ordForm").onsubmit=async e=>{
    e.preventDefault(); const msg=document.getElementById("ordMsg");
    const items=[...box.querySelectorAll(".oitem")].map(r=>({dish:r.querySelector(".odish").value.trim(),qty:Math.max(1,Math.round(num(r.querySelector(".oqty").value))),doneness:r.querySelector(".odone").value,note:r.querySelector(".onote").value.trim()})).filter(i=>i.dish);
    const table=Math.round(num(val("oTable")));
    if(!table){msg.textContent=tt("Choose the table.","Elige la mesa.");return;}
    if(!items.length){msg.textContent=tt("Add at least one dish.","Agrega al menos un plato.");return;}
    const al=[...document.querySelectorAll(".allerg input[type=checkbox]:checked")].map(c=>allergenName(c.value));
    const alTxt=val("oAllergyTxt"); if(alTxt) al.push(alTxt);
    const resId=document.getElementById("oBook").dataset.res||"", b=D.reservations.find(r=>r.id===resId);
    const stamp=new Date().toISOString();
    await dbAdd("orders",{date:today(),table,guests:Math.max(1,Math.round(num(val("oGuests")))),items,itemsText:itemsText(items),allergies:al.join(", "),message:val("oMsg"),status:"new",resId,booking:b?b.name:"",by:SESSION?SESSION.name:"",created:stamp,updated:stamp});
    msg.textContent=tt(`Order for table ${table} sent to the kitchen.`,`Orden de la mesa ${table} enviada a cocina.`);
    e.target.reset(); box.innerHTML=itemRow(); document.getElementById("oGuests").dataset.touched=""; ordBookingHint(); ordStockCheck(); applyRoleUI();
  };
}
function wireKitchen(){
  document.getElementById("ordServed").onchange=e=>{ordShowServed=e.target.checked;listOrders();};
  document.getElementById("ordRefresh").onclick=()=>{ if(DB&&DB._refresh) DB._refresh("orders"); else listOrders(); };
  document.getElementById("ordBoard").onclick=async e=>{
    const b=e.target.closest("[data-ost]"); if(!b) return; const id=b.dataset.id;
    if(b.dataset.ost==="del"){ if(confirm(tt("Delete this order?","¿Borrar esta orden?"))) await dbDel("orders",id); return; }
    await dbUpd("orders",id,{status:b.dataset.ost,updated:new Date().toISOString()});
  };
  clearInterval(ordTimer); ordTimer=setInterval(()=>{ if(state.tab!=="ai"||state.aiView!=="kitchen"){clearInterval(ordTimer);return;} if(DB&&DB._refresh&&document.visibilityState==="visible") DB._refresh("orders"); else listOrders(); },15000);
}
function listOrders(){
  const el=document.getElementById("ordBoard"); if(!el) return;
  const t=today(), mins=o=>Math.max(0,Math.round((Date.now()-Date.parse(o.created||0))/60000));
  const all=D.orders.filter(o=>o.date===t||["new","prep","ready"].includes(o.status)).sort((a,b)=>String(a.created).localeCompare(String(b.created)));
  const cols=[["new"],["prep"],["ready"]].concat(ordShowServed?[["served","cancelled"]]:[]);
  const next={new:["prep",tt("Start","Empezar")],prep:["ready",tt("Ready","Lista")],ready:["served",tt("Served","Entregada")]};
  const card=o=>`<article class="ocard${o.allergies?" hasal":""}"><div class="ohead"><b>${tt("Table","Mesa")} ${esc(o.table)}</b><span class="dimtxt">${esc(o.guests||"")} ${tt("diners","comensales")} · ${mins(o)} min</span><span class="badge ${(OSTAT[o.status]||OSTAT.new)[2]}">${ostat(o.status)}</span></div>
    ${o.allergies?`<div class="alban">⚠ ${tt("ALLERGIES","ALERGIAS")}: ${esc(o.allergies)}</div>`:""}
    <ul class="oitems">${(o.items||[]).map(i=>`<li><b>${esc(i.qty)}×</b> ${esc(i.dish)}${i.doneness?` <span class="don">${esc(donName(i.doneness))}</span>`:""}${i.note?`<small>${esc(i.note)}</small>`:""}</li>`).join("")||`<li>${esc(o.itemsText||"")}</li>`}</ul>
    ${o.message?`<div class="omsg">💬 ${esc(o.message)}</div>`:""}
    ${o.booking?`<div class="dimtxt">📅 ${esc(o.booking)}</div>`:""}
    <div class="acts">${next[o.status]?`<button class="btn sm" data-ost="${next[o.status][0]}" data-id="${esc(o.id)}">${next[o.status][1]}</button>`:""}${["new","prep"].includes(o.status)?`<button class="btn sm ghost" data-ost="cancelled" data-id="${esc(o.id)}">${tt("Cancel","Cancelar")}</button>`:""}${o.status==="served"||o.status==="cancelled"?`<button class="btn sm ghost" data-ost="new" data-id="${esc(o.id)}">${tt("Reopen","Reabrir")}</button><button class="btn sm ghost" data-ost="del" data-id="${esc(o.id)}">${tt("Delete","Borrar")}</button>`:""}</div></article>`;
  setHTML(el,`<div class="board">${cols.map(c=>{const rows=all.filter(o=>c.includes(o.status||"new")); return `<div class="bcol"><h4>${c.length>1?tt("Served / cancelled","Entregadas / canceladas"):ostat(c[0])} <span class="badge">${rows.length}</span></h4>${rows.map(card).join("")||`<p class="empty">—</p>`}</div>`;}).join("")}</div>`);
  applyRoleUI();
}


/* ================= BILLING BY TABLE (Facturación por mesa) ================= */
const PAYMENTS=[["cash","Cash","Efectivo"],["card","Card","Tarjeta"],["transfer","Transfer","Transferencia"],["other","Other","Otro"]];
const payName=k=>{const x=PAYMENTS.find(p=>p[0]===k);return x?tt(x[1],x[2]):k;};
const GST_DEFAULT=5;
const dishKey=d=>String(d||"").trim().toLowerCase();
const menuNamesOf=m=>{const p=m.prodId?P.find(x=>x.id===m.prodId):null;return [m.name,m.name_en,m.name_es,p&&p.name.en,p&&p.name.es].filter(Boolean);};
const menuFind=d=>{const k=dishKey(d);return D.menu.find(x=>menuNamesOf(x).some(n=>dishKey(n)===k));};
const priceOf=d=>{const m=menuFind(d);return m?num(m.price):0;};
const taxRate=()=>{const r=D.bill&&D.bill.taxRate!=null?num(D.bill.taxRate):GST_DEFAULT;return r>=0&&r<=100?r:GST_DEFAULT;};
const r2=n=>Math.round(num(n)*100)/100;
// orders of a table that are not cancelled and not billed yet
const openOrders=t=>D.orders.filter(o=>String(o.table)===String(t)&&o.status!=="cancelled"&&!o.billId);
const tablesToBill=()=>[...new Set(D.orders.filter(o=>o.status!=="cancelled"&&!o.billId).map(o=>String(o.table)))].sort((a,b)=>num(a)-num(b));
// the menu product a bill line matches, so paid drinks can be added to module 3
const matchProduct=d=>{const k=dishKey(d);const m=menuFind(d);if(m&&m.prodId) return m.prodId;const p=P.find(x=>dishKey(x.name.en)===k||dishKey(x.name.es)===k);return p?p.id:"";};
let billMsg=""; let billTable="", billLines=null, billTip=0, billTipPct=null, billDisc={v:0,mode:"pct",why:""}, billSplit=1, billMethod="cash", lastBill=null;
function billTotals(){
  const lines=billLines||[];
  const subtotal=r2(lines.reduce((s,l)=>s+num(l.qty)*num(l.price),0));
  const discount=r2(billDisc.mode==="pct"?subtotal*Math.min(100,Math.max(0,num(billDisc.v)))/100:Math.min(subtotal,Math.max(0,num(billDisc.v))));
  const base=r2(subtotal-discount), tax=r2(base*taxRate()/100);
  const tip=r2(billTipPct!=null?base*billTipPct/100:billTip);
  const total=r2(base+tax+tip), split=Math.max(1,Math.round(num(billSplit)||1));
  return {subtotal,discount,base,tax,tip,total,split,per:r2(total/split)};
}

   <div class="grid">
    <div class="stack">
     <div class="panel"><h3>${tt("Bill","Cuenta")}</h3>
      <div class="f" style="max-width:260px"><label for="blTable">${tt("Table","Mesa")}</label>
       <select id="blTable"><option value="">${tt("Choose a table…","Elige una mesa…")}</option>${opts.map(n=>`<option value="${esc(n)}"${String(n)===String(billTable)?" selected":""}>${tt("Table","Mesa")} ${esc(n)}${pend.includes(String(n))?" · "+tt("orders pending","órdenes pendientes"):""}</option>`).join("")}</select></div>
      <div id="blBody"></div>${dishDatalist("dishList2")}
     </div>
     <div class="panel" id="blReceiptPanel"${lastBill?"":" hidden"}><h3>${tt("Receipt","Recibo")}</h3><pre class="receipt" id="blReceipt"></pre>
      <div class="acts"><button type="button" class="btn sm" id="blPrint">🖨 ${tt("Print","Imprimir")}</button><button type="button" class="btn sm ghost" id="blCopy">${tt("Copy","Copiar")}</button></div></div>
    </div>
    <div class="stack">
     <div class="panel"><h3>${tt("Menu prices","Precios del menú")}</h3>
      <p class="hint">${tt("Prices come from the Menu module. Open “Menu” to add dishes and drinks or change their prices.","Los precios vienen del módulo Menú. Abre “Menú” para agregar platos y bebidas o cambiar sus precios.")} <button type="button" class="linkbtn" id="goMenu">${tt("Open the menu","Abrir el menú")}</button></p>
      <div class="tablewrap" id="prTable"></div>
      <div class="fgrid" style="margin-top:10px">
       ${field("blRate",tt("GST %","GST %"),`<input id="blRate" type="number" min="0" max="100" step="0.1" value="${taxRate()}">`)}
       ${field("blUsd",tt("1 CAD = USD","1 CAD = USD"),`<input id="blUsd" type="number" min="0" step="0.0001" value="${esc(num((D.bill||{}).rateUSD)||"")}" placeholder="0.00">`)}
       ${field("blPen",tt("1 CAD = PEN (soles)","1 CAD = PEN (soles)"),`<input id="blPen" type="number" min="0" step="0.0001" value="${esc(num((D.bill||{}).ratePEN)||"")}" placeholder="0.00">`)}
      </div>
      <p class="hint">${tt("Prices and reports are kept in Canadian dollars. Type today's rate to show and charge in US dollars or soles — the app does not look rates up on its own.","Los precios y reportes se guardan en dólares canadienses. Escribe el tipo de cambio del día para mostrar y cobrar en dólares americanos o soles — la app no consulta tipos de cambio por su cuenta.")}</p>
     </div>

    </div>
   </div></section>`;

function loadTableLines(){
  const os=openOrders(billTable), lines=[];
  os.forEach(o=>(o.items||[]).forEach(i=>{
    const k=dishKey(i.dish), f=lines.find(l=>dishKey(l.dish)===k&&!l.note);
    if(f) f.qty=num(f.qty)+num(i.qty); else lines.push({dish:i.dish,qty:num(i.qty)||1,price:priceOf(i.dish)});
  }));
  billLines=lines; billTip=0; billTipPct=null; billDisc={v:0,mode:"pct",why:""}; billSplit=Math.max(1,num(os[0]&&os[0].guests)||1);
}
function receiptText(b){
  const L=[], cur=b.currency||"CAD", rt=b.rate==null?1:num(b.rate);
  L.push("TASTE OF PERU"); L.push(tt("Table","Mesa")+" "+b.table+"  ·  "+b.date+" "+(b.paid||"").slice(11,16));
  L.push("".padEnd(34,"-"));
  (b.lines||[]).forEach(l=>{ const left=`${l.qty}x ${l.dish}`.slice(0,23); L.push(left.padEnd(24)+fmtCur(num(l.qty)*num(l.price),cur,rt).padStart(10)); });
  L.push("".padEnd(34,"-"));
  const amt=v=>(num(v)<0?"-":"")+fmtCur(Math.abs(num(v)),cur,rt);
  const row=(a,v)=>L.push(String(a).slice(0,23).padEnd(24)+amt(v).padStart(10));
  row(tt("Subtotal","Subtotal"),b.subtotal);
  if(num(b.discount)) row(tt("Discount","Descuento")+(b.discountReason?" ("+b.discountReason+")":""),-num(b.discount));
  row("GST "+num(b.taxRate)+"%",b.tax);
  if(num(b.tip)) row(tt("Tip","Propina"),b.tip);
  row(tt("TOTAL","TOTAL"),b.total);
  if(num(b.split)>1) row(tt("Each","Cada uno")+" ("+b.split+")",b.per);
  L.push(tt("Payment","Pago")+": "+payName(b.method)+" · "+cur);
  if(cur!=="CAD") L.push(tt("Rate","Cambio")+": 1 CAD = "+rt+" "+cur+"  ·  "+fmtCur(b.total,"CAD",1)+" CAD");
  L.push(""); L.push(tt("Thank you!","¡Gracias!"));
  return L.join("\n");
}
function wireBill(){
  const sel=document.getElementById("blTable");

  billBody();
  document.getElementById("blBody").addEventListener("click",async e=>{
    const rm=e.target.closest("[data-brm]"); if(rm){ billLines.splice(num(rm.dataset.brm),1); billBody(); return; }
    const tp=e.target.closest("[data-tip]"); if(tp){ billTipPct=num(tp.dataset.tip); billTip=0; billBody(); return; }
    if(e.target.id==="blAdd"){ (billLines=billLines||[]).push({dish:"",qty:1,price:0}); billBody(); return; }

  });
  document.getElementById("blBody").addEventListener("change",e=>{
    const el=e.target, tr=el.closest("tr");

      if(el.dataset.b==="qty") l.qty=Math.max(0,num(el.value));
      if(el.dataset.b==="price") l.price=Math.max(0,toCAD(el.value));
      billBody(); return; }
    if(el.id==="blDisc"){ billDisc.v=billDisc.mode==="amt"?toCAD(el.value):num(el.value); billBody(); }
    if(el.id==="blDiscMode"){ billDisc.mode=el.value; billDisc.v=0; billBody(); }
    if(el.id==="blDiscWhy"){ billDisc.why=el.value.trim(); }
    if(el.id==="blTip"){ billTip=toCAD(el.value); billTipPct=null; billBody(); }
    if(el.id==="blSplit"){ billSplit=Math.max(1,Math.round(num(el.value))); billBody(); }

  document.getElementById("blUsd").onchange=async e=>{ await dbSet("settings/bill",{...(D.bill||{}),rateUSD:Math.max(0,num(e.target.value))}); };
  document.getElementById("blPen").onchange=async e=>{ await dbSet("settings/bill",{...(D.bill||{}),ratePEN:Math.max(0,num(e.target.value))}); };

  if(!canWrite("settings")){ const r=document.getElementById("blRate"); r.disabled=true; r.classList.add("ro"); r.title=tt("Only an administrator can change the GST rate","Solo un administrador puede cambiar la tasa de GST"); }

async function payBill(){
  const msg=document.getElementById("blMsg"), t=billTotals();
  const lines=(billLines||[]).filter(l=>l.dish&&num(l.qty)>0);
  if(!lines.length||t.total<=0){ msg.textContent=tt("Add at least one line with a price.","Agrega al menos una línea con precio."); return; }
  const stamp=new Date().toISOString(), os=openOrders(billTable);
  const bill={date:today(),table:num(billTable),guests:num(os[0]&&os[0].guests)||t.split,lines,
    linesText:lines.map(l=>`${l.qty}× ${l.dish} @ ${money(l.price)}`).join("; "),
    subtotal:t.subtotal,discount:t.discount,discountReason:billDisc.why,taxRate:taxRate(),tax:t.tax,tip:t.tip,
    total:t.total,split:t.split,per:t.per,method:billMethod,status:"paid",orderIds:os.map(o=>o.id).join(","),
    currency:curOk(state.cur)?state.cur:"CAD",rate:curOk(state.cur)?curRate(state.cur):1,totalCur:r2(t.total*(curOk(state.cur)?curRate(state.cur):1)),
    by:SESSION?SESSION.name:"",created:stamp,paid:stamp};
  // stock used: each paid line × its recipe's standard measure (only saved measures linked to inventory)
  const use=[];
  lines.forEach(l=>{ const m=menuFind(l.dish); const r=m?recipeOf(m.id):null;
    if(!r||!r.locked) return; stockUseFor(r,num(l.qty)).forEach(u=>{ const f=use.find(x=>x.id===u.id); if(f) f.qty=r3(f.qty+u.qty); else use.push({...u}); }); });
  bill.stockUse=use; bill.stockText=use.map(u=>`${u.name} −${nice(u.qty)} ${u.unit}`).join("; ");
  const id="b"+today().replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,7);
  await dbSet("bills/"+id,bill);
  // on the Google Sheet the server discounts the stock when it saves a new bill; elsewhere the app does it
  if(MODE!=="sheet") for(const u of use){ const it=invItem(u.id); if(it) await kardexMove(it,{type:"out",reason:"sale",qty:u.qty,ref:tt("Bill","Factura")+" "+id}); }
  else if(use.length&&DB&&DB._refresh) setTimeout(()=>DB._refresh("inventory"),800);
  // close the table's orders, free the table and add the menu drinks to the day's sales
  for(const o of os) await dbUpd("orders",o.id,{status:"served",billId:id,updated:stamp});
  const tb=D.tables.find(x=>String(x.num)===String(billTable));
  if(tb&&tb.occupied) await dbUpd("tables",tb.id,{occupied:false,occSince:""});
  let counted=0, skipped=0;
  const cur=D.sales.find(s=>s.id===today())||{items:{},hours:{}};
  const items={...(cur.items||{})}, hours={...(cur.hours||{})};
  lines.forEach(l=>{ const pid=matchProduct(l.dish);
    if(!pid){ skipped++; return; }
    counted++; const it=items[pid]||{cups:0,revenue:0};
    it.cups=num(it.cups)+num(l.qty); it.revenue=r2(num(it.revenue)+num(l.qty)*num(l.price)); items[pid]=it; });
  if(counted){ const h=String(new Date().getHours()).padStart(2,"0"); hours[h]=num(hours[h])+lines.reduce((s,l)=>s+(matchProduct(l.dish)?num(l.qty):0),0); await dbSet("sales/"+today(),{items,hours}); }
  showReceipt({...bill,id});
  billMsg=tt(`Charged ${money(bill.total)} for table ${bill.table}. The table is free again and its orders are closed.`,`Cobrado ${money(bill.total)} de la mesa ${bill.table}. La mesa quedó libre y sus órdenes cerradas.`)+(skipped?" "+tt(`${skipped} line(s) are not menu drinks, so they are not counted in module 3 · Costs, sales & analytics.`,`${skipped} línea(s) no son bebidas del menú, así que no se cuentan en el módulo 3 · Costos, ventas y análisis.`):"");
  billTable=""; billLines=null; billTip=0; billTipPct=null; billDisc={v:0,mode:"pct",why:""}; billSplit=1;
  render();
}

/* ================= MODULE 2 — KITCHEN & INVENTORY ================= */
/* RULE: stock can be kept in g, kg, mL, L or pieces, but the COST is always per kg (g, kg), per L (mL, L) or per piece.
   Value = stock converted to kg / L × cost.  e.g. 4,500 g of purple corn at CA$8.50/kg = 4.5 kg × 8.50 = CA$38.25 */
const UNITS=["g","kg","ml","L","pc"];
const baseOf=u=>u==="g"||u==="kg"?"kg":u==="ml"||u==="mL"||u==="L"||u==="l"?"L":"pc";
/* Pieces: they are BOUGHT by the package but COSTED per piece. Unit cost = package price ÷ pieces in the package
   (e.g. a box of 30 eggs for CA$9.00 → CA$0.30 per egg). Value = pieces × unit cost. "pieces per package" is the usual box size. */
const packOf=i=>i&&i.unit==="pc"&&num(i.pack)>0?num(i.pack):1;
const factorOf=i=>i.unit==="g"||i.unit==="ml"||i.unit==="mL"?1000:1;   // stock units in 1 cost unit (g, mL → kg, L)
const toBase=(q,u)=>u==="g"||u==="ml"||u==="mL"?num(q)/1000:num(q);
const costR=(i,v)=>i&&i.unit==="pc"?Math.round(num(v)*10000)/10000:Math.round(num(v)*100)/100;   // per-piece costs keep 4 decimals
const toBaseI=(q,i)=>num(q)/factorOf(i);   // stock quantity → kg / L / packages
// the "Per g / mL / piece" column: g/mL = cost per kg/L ÷ 1,000; pieces = package price ÷ on hand (owner's rule)
const perUnit=i=>i.unit==="pc"?(num(i.qty)>0?num(i.cost)*packOf(i)/num(i.qty):0):num(i.cost)/factorOf(i);
// stock value: g / mL = Per g / mL × On hand; pieces = Per piece × pieces per package (owner's rule)
const stockValue=i=>i.unit==="pc"?perUnit(i)*packOf(i):perUnit(i)*num(i.qty);
const cost2=v=>Math.round(num(v)*100)/100;
const money2=v=>fmtCur(v,curNow());
const unitLbl=u=>u==="kg"?"kg":u==="L"||u==="l"?"L":u==="g"?"g":u==="ml"||u==="mL"?"mL":tt("pc","und");
const subUnit=u=>baseOf(u)==="kg"?"g":baseOf(u)==="L"?"mL":tt("pc","und");
// cost of 1 g / 1 mL / 1 piece from the cost per kg / L / package (shown with 4 decimals)
const subCost=(i,c)=>num(c!=null?c:i.cost)/factorOf(i);
const fmtSub=v=>{ const c=curInfo(curNow()); return c[1]+(v*(curRate(c[0])||1)).toLocaleString(state.lang==="es"?"es-CA":"en-CA",{minimumFractionDigits:4,maximumFractionDigits:4}); };
const costPerLbl=(u,i)=>baseOf(u)==="pc"?tt("piece","und"):baseOf(u);
const money4=v=>{ const c=curInfo(curNow()); return c[1]+(num(v)*(curRate(c[0])||1)).toLocaleString(state.lang==="es"?"es-CA":"en-CA",{minimumFractionDigits:2,maximumFractionDigits:4}); };
const KX_REASON={opening:["Opening balance of the month","Saldo inicial del mes"],initial:["Opening stock","Stock inicial"],purchase:["Purchase","Compra"],sale:["Sale (paid bill)","Venta (cuenta cobrada)"],waste:["Waste","Merma"],adjust:["Stock count / adjustment","Conteo / ajuste"],cost:["Cost change","Cambio de costo"],manual_in:["Manual entry","Entrada manual"],manual_out:["Manual exit","Salida manual"],unit:["Unit change to kg/L","Cambio de unidad a kg/L"]};
const kxReason=k=>KX_REASON[k]?tt(KX_REASON[k][0],KX_REASON[k][1]):k;
/* Kardex row snapshot with the same rules as the stock table:
   cost per kg / L / package · per g / mL / piece · stock value (pieces: per piece = package cost ÷ on hand, value = per piece × pieces per package) */
const fmtQ=v=>(Math.round(num(v)*1000)/1000).toLocaleString(state.lang==="es"?"es-CA":"en-CA",{maximumFractionDigits:3});   // Kardex quantities: exact, up to 3 decimals
// Kardex order key: local date + time, so a movement's date and its order always agree
const kxStamp=(d=new Date())=>{ const z=(n,l=2)=>String(n).padStart(l,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}.${z(d.getMilliseconds(),3)}`; };
// timestamp shown in the Kardex: when the movement was recorded (older rows: their order key)
const kxTsFmt=v=>{ v=String(v||""); if(!v) return ""; if(/Z$|[+-]\d\d:\d\d$/.test(v)){ const d=new Date(v); if(!isNaN(d)) v=kxStamp(d); } return v.slice(0,19).replace("T"," "); };
const kxTs=k=>{ const t=kxTsFmt(k.created||k.when); return t?`${esc(t.slice(0,10))}<small>${esc(t.slice(11))}</small>`:"—"; };
function kxSnap(k){ const s={unit:k.unit,pack:num(k.pack)||1,qty:num(k.balQty),cost:num(k.avgCost)};
  return {costPkg:cost2(k.unit==="pc"?s.cost*packOf(s):s.cost),perSub:Math.round(perUnit(s)*10000)/10000,stockVal:cost2(stockValue(s))}; }
const kxDir=k=>k.type==="open"?"Inicial":k.type==="in"||(k.type==="adj"&&num(k.qty)>0)?"Entrada":k.type==="out"||(k.type==="adj"&&num(k.qty)<0)?"Salida":"Costo";
const kxDirLbl=d=>d==="Inicial"?tt("Opening","Saldo inicial"):d==="Entrada"?tt("In","Entrada"):d==="Salida"?tt("Out","Salida"):tt("Cost","Costo");
/* Kardex: every stock movement (in, out, adjustment) with the unit cost, running balance and weighted average cost.
   Saved in the "kardex" collection (Google Sheet tab "Kardex" on the website; the app's database in Claude). */
/* ===== Monthly Kardex: opening balance (start of month) and closing (end of month) =====
   Closing a month saves each item's balance and weighted average cost at the end of the month and writes them as
   "open" rows (opening balance) on day 1 of the next month. Every month up to the last closed one is locked:
   its movements can't be added, edited or deleted, and recalculations start from the latest opening balance. */
const ym=d=>String(d||"").slice(0,7);
const nextYM=m=>{ const [y,mo]=String(m).split("-").map(Number), d=new Date(y,mo,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const prevYM=m=>{ const [y,mo]=String(m).split("-").map(Number), d=new Date(y,mo-2,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const monthName=m=>{ const [y,mo]=String(m).split("-").map(Number); if(!y||!mo) return m; const t=new Date(y,mo-1,1).toLocaleDateString(state.lang==="es"?"es-CA":"en-CA",{month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); };
const kxClosedMap=()=>(D.kxMonths&&D.kxMonths.closed)||{};
const kxLastClosed=()=>Object.keys(kxClosedMap()).sort().pop()||"";
const kxLocked=date=>{ const lc=kxLastClosed(); return !!lc&&ym(date)<=lc; };
const kxLockedMsg=()=>tt(`${monthName(kxLastClosed())} is closed: movements up to that month can't be added, edited or deleted.`,`${monthName(kxLastClosed())} está cerrado: no se pueden agregar, editar ni eliminar movimientos hasta ese mes.`);
// order of the Kardex: date and time; an opening balance goes first on day 1
const kxKey=k=>k.type==="open"?String(k.date||"").slice(0,10)+"T00:00:00.000":String(k.when||k.date||"");
const kxOrder=(a,b)=>kxKey(a).localeCompare(kxKey(b));
// balance and weighted average cost of an item at the end of a date (replaying its Kardex)
function kxBalanceAt(itemId,endDate){ const it=invItem(itemId)||{unit:(D.kardex.find(k=>k.itemId===itemId)||{}).unit}, u={unit:it.unit}, B=x=>toBaseI(x,u);
  let q=0,c=0,n=0;
  D.kardex.filter(k=>k.itemId===itemId&&String(k.date||"").slice(0,10)<=endDate).sort(kxOrder).forEach(k=>{ const qty=num(k.qty); n++;
    if(k.type==="open"){ q=r3(qty); c=costR(u,k.avgCost); }
    else if(k.type==="in"){ const uc=costR(u,k.unitCost), q1=r3(q+qty); c=q1>0?costR(u,(B(q)*c+B(qty)*uc)/B(q1)):uc; q=q1; }
    else if(k.type==="out") q=r3(Math.max(0,q-qty)); else if(k.type==="adj") q=r3(Math.max(0,q+qty)); else if(k.type==="cost") c=costR(u,k.unitCost); });
  return {q,c,n}; }
const monthEnd=m=>{ const [y,mo]=m.split("-").map(Number); return m+"-"+String(new Date(y,mo,0).getDate()).padStart(2,"0"); };
const kxOpenRows=m=>D.kardex.filter(k=>k.type==="open"&&ym(k.date)===m);
async function kxWriteOpening(m,why){   // opening balance rows for month m = balance at the end of the previous month
  const pe=monthEnd(prevYM(m)), ids=[...new Set(D.kardex.filter(k=>String(k.date||"")<=pe).map(k=>k.itemId))].filter(id=>invItem(id));
  let n=0;
  for(const id of ids){ const it=invItem(id), b=kxBalanceAt(id,pe); if(!b.n) continue;
    const sn=kxSnap({unit:it.unit,pack:packOf(it),balQty:b.q,avgCost:b.c}), kid="o"+m.replace("-","")+id;
    await dbSet("kardex/"+kid,{item:it.name,itemId:id,unit:it.unit,costPer:baseOf(it.unit),pack:packOf(it),type:"open",reason:"opening",dir:"Inicial",
      qty:b.q,unitCost:b.c,avgCost:b.c,balQty:b.q,costPkg:sn.costPkg,perSub:sn.perSub,stockVal:sn.stockVal,balValue:sn.stockVal,total:sn.stockVal,
      date:m+"-01",when:m+"-01T00:00:00.000",created:kxStamp(),supplier:"",lot:"",expiry:"",ref:why||"",by:SESSION?(SESSION.name||SESSION.user):""}); n++; }
  return {ids,n}; }
async function kxRecalcAll(){ const ids=[...new Set(D.kardex.map(k=>k.itemId))].filter(id=>id&&invItem(id)); for(const id of ids) await kardexRecalcItem(id); return ids.length; }
async function kxStartMonth(m){
  if(!DB) return noDb(); if(kxOpenRows(m).length) return toast(tt(`${monthName(m)} already has its opening balance.`,`${monthName(m)} ya tiene su saldo inicial.`));
  const lc=kxLastClosed(); if(lc&&lc!==prevYM(m)) return toast(tt(`Close ${monthName(prevYM(m))} first.`,`Primero cierra ${monthName(prevYM(m))}.`));
  const r=await kxWriteOpening(m,tt(`Opening balance of ${monthName(m)}`,`Saldo inicial de ${monthName(m)}`));
  for(const id of r.ids) await kardexRecalcItem(id);
  await dbSet("settings/kardex",{...(D.kxMonths||{}),started:{...((D.kxMonths||{}).started||{}),[m]:{at:kxStamp(),by:SESSION?(SESSION.name||SESSION.user):""}}});
  return r.n; }
async function kxCloseMonth(m){
  if(!DB) return noDb(); const cur=ym(today());
  if(m>=cur) return toast(tt("Only a month that has ended can be closed.","Solo se puede cerrar un mes que ya terminó."));
  if(kxClosedMap()[m]) return toast(tt(`${monthName(m)} is already closed.`,`${monthName(m)} ya está cerrado.`));
  const nx=nextYM(m);
  for(const k of kxOpenRows(nx)) await dbDel("kardex",k.id);          // re-created below with the closing values
  await kxRecalcAll();                                                   // the month's balances and averages, up to date
  const end=monthEnd(m), items={}; let value=0;
  [...new Set(D.kardex.map(k=>k.itemId))].filter(id=>invItem(id)).forEach(id=>{ const it=invItem(id), b=kxBalanceAt(id,end); if(!b.n) return;
    const v=cost2(toBaseI(b.q,it)*b.c); value+=v; items[id]={name:it.name,unit:it.unit,q:b.q,c:b.c,value:v}; });
  const r=await kxWriteOpening(nx,tt(`Closing of ${monthName(m)}`,`Cierre de ${monthName(m)}`));
  for(const id of r.ids) await kardexRecalcItem(id);
  const who=SESSION?(SESSION.name||SESSION.user):"", km=D.kxMonths||{};
  await dbSet("settings/kardex",{...km,closed:{...(km.closed||{}),[m]:{at:kxStamp(),by:who,value:cost2(value),items}},started:{...(km.started||{}),[nx]:{at:kxStamp(),by:who,from:m}}});
  return {items:Object.keys(items).length,value}; }
async function kxReopenLast(){
  if(!DB) return noDb(); const lc=kxLastClosed(); if(!lc) return;
  for(const k of kxOpenRows(nextYM(lc))) await dbDel("kardex",k.id);
  const km=D.kxMonths||{}, closed={...(km.closed||{})}; delete closed[lc]; const started={...(km.started||{})}; delete started[nextYM(lc)];
  await dbSet("settings/kardex",{...km,closed,started});

async function kardexMove(it,m){
  if(kxLocked(m.date&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)?m.date:today())){ toast(kxLockedMsg()); return; }
  const kt=m.base||kxTotals()[it.id], q0=kt?kt.q:0, c0=kt?kt.c:(m.type==="in"?0:costR(it,it.cost)), stamp=new Date().toISOString();   // the balance comes from the Kardex itself
  let qty=num(m.qty), uc=c0, q1=q0, c1=c0, type=m.type;
  const B=q=>toBaseI(q,it);
  if(type==="in"){ uc=m.unitCost!=null&&m.unitCost!==""?costR(it,m.unitCost):c0; q1=r3(q0+qty); c1=q1>0?costR(it,(B(q0)*c0+B(qty)*uc)/B(q1)):uc; }

  const id=m.id||("k"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));

function kxTotals(){ const by={};

    const t=by[k.itemId]||(by[k.itemId]={itemId:k.itemId,item:k.item,unit:k.unit,pack:num(k.pack)||1,ins:0,outs:0,q:0,c:0,n:0}); const it={unit:t.unit}, B=q=>toBaseI(q,it), qty=num(k.qty); t.n++; t.item=k.item||t.item;

    else if(k.type==="in"){ const uc=num(k.unitCost), q1=t.q+qty; t.c=q1>0?costR(it,(B(t.q)*t.c+B(qty)*uc)/B(q1)):uc; t.q=q1; t.ins+=qty; }

    else if(k.type==="cost"){ t.c=costR(it,k.unitCost); }

/* ---------- sales helpers (used by modules 2, 3, 5) ---------- */
function salesDays(n){ const out=[]; for(let i=n-1;i>=0;i--){const d=addDays(today(),-i); const s=D.sales.find(x=>x.id===d); out.push({date:d,items:(s&&s.items)||{},hours:(s&&s.hours)||{}});} return out; }
function dayTotals(day){ let cups=0,rev=0,cost=0; Object.entries(day.items).forEach(([pid,it])=>{cups+=num(it.cups);rev+=num(it.revenue);cost+=num(it.cups)*prodCost(pid).c;}); return {cups,rev,cost}; }
function weekdayForecast(){
  const hist=salesDays(56).filter(d=>Object.keys(d.items).length);
  if(hist.length<7) return null;
  const res=[];
  for(let i=1;i<=7;i++){ const d=addDays(today(),i), wd=dow(d); const same=hist.filter(h=>dow(h.date)===wd).slice(-4);
    const per={}; P.forEach(p=>{per[p.id]=same.length?same.reduce((s,h)=>s+num(h.items[p.id]?.cups),0)/same.length:0;});
    const rev=same.length?same.reduce((s,h)=>s+dayTotals(h).rev,0)/same.length:0;
    res.push({date:d,per,cups:Object.values(per).reduce((a,b)=>a+b,0),rev,n:same.length}); }
  return res;
}
function hourlyProfile(){ const hrs={}; salesDays(28).forEach(d=>Object.entries(d.hours).forEach(([h,c])=>{hrs[h]=(hrs[h]||0)+num(c);})); const days=salesDays(28).filter(d=>Object.keys(d.hours).length).length; return {hrs,days}; }
function forecastHTML(){
  const f=weekdayForecast(); const {hrs,days}=hourlyProfile();
  if(!f) return `<p class="empty">${tt("Needs at least 7 days of sales (Module 3). Forecast = average of the same weekday over the last 4 weeks.","Necesita al menos 7 días de ventas (Módulo 3). Predicción = promedio del mismo día de la semana en las últimas 4 semanas.")}</p>`;
  const hh=Object.keys(hrs).sort();
  return `<div class="tablewrap"><table class="dt"><thead><tr><th>${tt("Day","Día")}</th>${P.map(p=>`<th>${esc(T(p.name))}</th>`).join("")}<th>${tt("Total cups","Total vasos")}</th></tr></thead><tbody>${f.map(r=>`<tr><td class="nw">${DOWN[state.lang][dow(r.date)]} ${+r.date.slice(8)}</td>${P.map(p=>`<td>${Math.round(r.per[p.id])}</td>`).join("")}<td><b>${Math.round(r.cups)}</b></td></tr>`).join("")}</tbody></table></div>
   <p class="hint">${tt("Estimate from your own sales: average of the same weekday, last 4 weeks.","Estimación con tus propias ventas: promedio del mismo día de la semana, últimas 4 semanas.")}</p>
   ${hh.length?`<h4 class="minih">${tt("Average cups by hour","Vasos promedio por hora")} (${days} ${tt("days with hourly data","días con datos por hora")})</h4><div class="hours">${hh.map(h=>{const v=hrs[h]/Math.max(1,days);const mx=Math.max(...hh.map(k=>hrs[k]/Math.max(1,days)));return `<div class="hr" title="${h}:00 — ${v.toFixed(1)}"><span style="height:${Math.max(4,v/mx*60)}px"></span><small>${h}</small></div>`;}).join("")}</div>`:`<p class="hint">${tt("Add the hour when you log sales to see the hourly forecast.","Agrega la hora al registrar ventas para ver la predicción por hora.")}</p>`}`;
}

  const out=document.getElementById("fcOut"); const f=weekdayForecast();

  const hist=salesDays(28).map(d=>d.date+" ("+DOWN.en[dow(d.date)]+"): "+P.map(p=>p.id+"="+num(d.items[p.id]?.cups)).join(", ")).join("\n");

const OPEX_FREQ=[["week","per week","por semana",52/12],["month","per month","por mes",1],["year","per year","por año",1/12]];
const OPEX_BASE=[["staff","Staff (wages)","Personal (sueldos)","month"],["rent","Rent","Alquiler del local","month"],["electricity","Electricity","Electricidad","month"],
  ["taxes","Taxes (property, business, other)","Impuestos (predial, negocio, otros)","year"],["insurance","Insurance","Seguros","year"],["licences","Annual licences","Licencias anuales","year"],

const opexFactor=f=>(OPEX_FREQ.find(x=>x[0]===f)||OPEX_FREQ[1])[3];
function opexRows(){
  const o=D.opex||{}, rows=OPEX_BASE.map(b=>({key:b[0],name:tt(b[1],b[2]),amt:num(o["amt_"+b[0]]),freq:o["freq_"+b[0]]||b[3],base:true}));
  const st=o.staff||{};
  const staffCalc=num(st.n)>0&&num(st.hours)>0&&num(st.wage)>0;
  if(staffCalc){ rows[0].amt=num(st.n)*num(st.hours)*num(st.wage)*52/12*(1+num(st.extra)/100); rows[0].freq="month"; rows[0].calc=true; }
  (Array.isArray(o.extra)?o.extra:[]).forEach(x=>rows.push({key:x.id,name:x.name,amt:num(x.amt),freq:x.freq||"month",base:false}));
  return rows.map(r=>({...r,monthly:r.amt*opexFactor(r.freq)}));
}

   +(manual.length?`<h4 class="minih">${tt("Manual cost (only for drinks without a recipe cost)","Costo manual (solo para bebidas sin costo de receta)")}</h4><div class="costgrid">${manual.map(p=>`<label class="f"><span>${esc(T(p.name))}</span><input data-cost="${p.id}" type="number" min="0" step="0.01" value="${num(D.costs[p.id])?inCur(D.costs[p.id]):""}" placeholder="${curSym()}"></label>`).join("")}</div>`:"");

function prodStats(n){
  const days=salesDays(n), st={};
  P.forEach(p=>st[p.id]={cups:0,rev:0});
  days.forEach(d=>Object.entries(d.items).forEach(([pid,it])=>{ if(!st[pid]) st[pid]={cups:0,rev:0}; st[pid].cups+=num(it.cups); st[pid].rev+=num(it.revenue); }));
  return Object.entries(st).map(([pid,s])=>{const pcx=prodCost(pid), c=pcx.c, partial=!!pcx.partial;const cost=s.cups*c;const m=s.rev-cost;return {pid,...s,unitCost:c,cost,margin:m,pct:s.rev?m/s.rev*100:0,hasCost:c>0,partial};});
}
