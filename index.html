function barChart(pts,W0){
  const W=Math.max(300,Math.min(900,W0||640)),H=200,pl=48,pb=24,pt=10,max=Math.max(...pts.map(p=>p.y),1),n=pts.length,bw=(W-pl)/n;
  const nice=m=>{const e=Math.pow(10,Math.floor(Math.log10(m)));return Math.ceil(m/e)*e;}; const top=nice(max);
  const y=v=>H-pb-(v/top)*(H-pb-pt);
  const ticks=[0,top/2,top];
  return `<svg viewBox="0 0 ${W} ${H}" class="bars" role="img" aria-label="${tt("Daily revenue","Ingresos diarios")}">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" class="ax">$${Math.round(t)}</text>`).join("")}
   ${pts.map((p,i)=>{const x=pl+i*bw+2,w=Math.max(2,bw-4),h=H-pb-y(p.y);return `<g class="bar"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pb-pt}" fill="transparent"><title>${p.x}: ${money(p.y)}</title></rect>${p.y>0?`<path d="M${x},${H-pb} v${-(h-Math.min(4,h))} q0,-${Math.min(4,h)} ${Math.min(4,w/2)},-${Math.min(4,h)} h${w-2*Math.min(4,w/2)} q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,h)} v${h-Math.min(4,h)} z" class="mark"><title>${p.x}: ${money(p.y)}</title></path>`:""}${(i%Math.ceil(n/Math.max(4,Math.floor(W/44)))===0)?`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" class="ax">${p.x.slice(8)}</text>`:""}</g>`;}).join("")}
  </svg>`;
}

    const sorted=[...j].sort((a,b)=>(a.type===b.type?num(b.count)-num(a.count):a.type==="complaint"?-1:1));
    out.innerHTML=`<ul class="rows">${sorted.map(t=>`<li><div><span class="badge ${t.type==="complaint"?"bad":"ok"}">${t.type==="complaint"?tt("Complaint","Queja"):tt("Praise","Elogio")}</span> <b>${esc(t.theme)}</b> — ${num(t.count)}<small>“${esc(t.example)}”</small><small>→ ${esc(t.action)}</small></div></li>`).join("")}</ul>`;
  }catch(e){ out.textContent=aiErr(e); }
}
async function reportAI(){
  const out=document.getElementById("repOut"); const since=addDays(today(),-6);
  const rv=D.reviews.filter(r=>r.date>=since), days=salesDays(7), st=prodStats(7);
  const low=D.inventory.filter(i=>invStatus(i)[0]==="bad").map(i=>i.name), waste=D.waste.filter(w=>w.date>=since);
  const ctx=`PERIOD: ${since} to ${today()}
SALES BY DAY: ${days.map(d=>d.date+": "+dayTotals(d).cups+" cups $"+dayTotals(d).rev.toFixed(2)).join("; ")}
SALES BY DRINK: ${st.map(s=>pname(s.pid)+" "+s.cups+" cups $"+s.rev.toFixed(2)+(s.hasCost?" margin "+s.pct.toFixed(0)+"%":"")).join("; ")}
LOW STOCK: ${low.join(", ")||"none"}
WASTE: ${waste.map(w=>w.item+" "+w.qty+w.unit+" ("+w.reason+") $"+num(w.cost).toFixed(2)).join("; ")||"none logged"}
REVIEWS: ${rv.map(r=>r.stars+"★ "+r.text.slice(0,300)).join(" | ")||"none"}`;
  out.textContent=tt("Thinking…","Pensando…");
  try{ await SAMPLE(`Write a concise weekly report for the owner of a small Peruvian drinks counter, using ONLY the data below. Sections: Summary, Sales, Stock & waste, Reviews, 3 priorities for next week. Say "no data" where a section is empty; never invent figures. ${LANGLINE()}\n\n${ctx}`,{cache:false,onText:({text})=>{out.textContent=text;}});
    out.insertAdjacentHTML("beforeend",`<p><button class="btn sm ghost" id="repCopy">${tt("Copy report","Copiar reporte")}</button></p>`);
    document.getElementById("repCopy").onclick=()=>copyText(out.firstChild.textContent);
  }catch(e){ out.textContent=e.text||aiErr(e); }
}

/* ----- Path to sale: a note per step (Edit → Save) and a Done ✓ mark, saved in settings/path ----- */
let pathEdit=null, pathSig="";
const pathGet=i=>{ const d=D.path||{}; return {note:d["note_"+i]||"",done:!!d["done_"+i],doneAt:d["doneAt_"+i]||"",doneBy:d["doneBy_"+i]||"",updated:d["upd_"+i]||""}; };
const pathCan=()=>!!DB&&canWrite("settings");
function pathProgress(n){
  let done=0; for(let i=0;i<n;i++) if(pathGet(i).done) done++;
  const pct=n?Math.round(done/n*100):0;
  return `<div class="pprog"><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><span style="width:${pct}%"></span></div>
   <b>${done} / ${n}</b> ${tt("steps done","pasos hechos")}${!DB?` · <span class="dimtxt">${tt("open the app in Claude (or sign in on the website) to save notes and progress","abre la app en Claude (o inicia sesión en la web) para guardar notas y avance")}</span>`:!pathCan()?` · <span class="dimtxt">${tt("read only for your role","solo lectura para tu rol")}</span>`:""}</div>`;
}
function pathStep(st,i){
  const g=pathGet(i), ed=pathEdit===i, can=pathCan();
  const when=g.doneAt?new Date(g.doneAt).toLocaleDateString(state.lang==="es"?"es-CA":"en-CA",{dateStyle:"medium"}):"";
  return `<div class="pstep${g.done?" done":""}" data-ps="${i}"><div class="n" aria-hidden="true">${g.done?"✓":i+1}</div><div>
    <h4>${st[0]}${g.done?` <span class="badge ok">✓ ${tt("Done","Hecho")}${when?" · "+esc(when):""}${g.doneBy?" · "+esc(g.doneBy):""}</span>`:""}</h4><p>${st[1]}</p>
    ${ed?`<div class="f full" style="margin-top:10px"><label for="pnote${i}">${tt("My notes for this step (what is done, what is missing, contacts, dates…)","Mis notas de este paso (qué está hecho, qué falta, contactos, fechas…)")}</label><textarea id="pnote${i}" rows="4">${esc(g.note)}</textarea></div>`
      :g.note?`<div class="pnote">📝 ${esc(g.note)}</div>`:""}
    ${can?`<div class="acts">${ed?`<button type="button" class="btn sm" data-psave="${i}">💾 ${tt("Save","Guardar")}</button><button type="button" class="btn sm ghost" data-pcancel="${i}">${tt("Cancel","Cancelar")}</button>`
        :`<button type="button" class="btn sm ghost" data-pedit="${i}">✎ ${g.note?tt("Edit note","Editar nota"):tt("Add note","Agregar nota")}</button>`}
      ${g.done?`<button type="button" class="btn sm ghost" data-pdone="${i}" aria-pressed="true">↺ ${tt("Mark as not done","Marcar como no hecho")}</button>`
        :`<button type="button" class="btn sm" data-pdone="${i}" aria-pressed="false">✓ ${tt("Done","Hecho")}</button>`}</div>`:""}
  </div></div>`;
}
function wirePath(){
  const box=main.querySelector(".path"); if(!box) return;
  box.onclick=async e=>{
    const b=e.target.closest("[data-pedit],[data-psave],[data-pcancel],[data-pdone]"); if(!b) return;
    if(!pathCan()) return noDb();
    if(b.dataset.pedit!=null){ pathEdit=+b.dataset.pedit; render(); const t=document.getElementById("pnote"+pathEdit); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } return; }
    if(b.dataset.pcancel!=null){ pathEdit=null; render(); return; }
    const stamp=new Date().toISOString();
    if(b.dataset.psave!=null){ const i=+b.dataset.psave, note=(document.getElementById("pnote"+i)?.value||"").trim().slice(0,2000);
      pathEdit=null; await dbSet("settings/path",{...(D.path||{}),["note_"+i]:note,["upd_"+i]:stamp}); render(); toast(tt("Note saved.","Nota guardada.")); return; }
    if(b.dataset.pdone!=null){ const i=+b.dataset.pdone, g=pathGet(i);
      if(pathEdit===i){ const t=document.getElementById("pnote"+i); if(t) D.path={...(D.path||{}),["note_"+i]:t.value.trim().slice(0,2000),["upd_"+i]:stamp}; pathEdit=null; }
      await dbSet("settings/path",{...(D.path||{}),["done_"+i]:!g.done,["doneAt_"+i]:g.done?"":stamp,["doneBy_"+i]:g.done?"":(SESSION?SESSION.name||SESSION.user:"")});
      render(); toast(g.done?tt("Step marked as not done.","Paso marcado como no hecho."):tt("Step done ✓","Paso hecho ✓")); }
  };
}
