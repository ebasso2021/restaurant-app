# Copies this repository to Google Drive (folder "restaurant-app") on every push to main.
# Needs one GitHub secret: RCLONE_CONF  (see README, "GitHub -> Google Drive").
name: Sync to Google Drive

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config from secret
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "Missing secret RCLONE_CONF"; exit 1; fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Copy files to Google Drive
        run: rclone copy . gdrive:restaurant-app --exclude ".git/**" --exclude ".github/**" --verbose
